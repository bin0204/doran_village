<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>도란도란 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 위 HUD 띠, 가운데 마을 캔버스, 아래 도구 막대. 창은 캔버스 위에 뜬다. */
/* 빛깔: 한지(바탕·종이)와 나무(틀·테두리), 먹빛 글씨, 단청의 주홍과 뇌록. wood 나무 틀, paper2 조금 짙은 종이, fiber 한지의 닥 섬유 점 */
:root{
  --bg:#ece2cb; --surface:#fbf5e6; --ink:#33261c; --muted:#7a6751; --line:#cdb88f;
  --accent:#c4472b; --accent-ink:#fff8ec; --leaf:#3c7250; --water:#2b6f9a; --heart:#cf4a6e;
  --shade:rgba(40,28,16,.5); --wood:#8a5c36; --wood-dk:#5e3d22; --paper2:#f3e9d2; --fiber:rgba(138,92,54,.1);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1611; --surface:#29211a; --ink:#f0e6d2; --muted:#b5a48a; --line:#4d3f2f;
  --accent:#e5784f; --accent-ink:#1e1108; --leaf:#86c08f; --water:#77b9e0; --heart:#f083a2;
  --shade:rgba(0,0,0,.62); --wood:#9a6c44; --wood-dk:#6b4a2e; --paper2:#322920; --fiber:rgba(240,230,210,.05); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1b1611; --surface:#29211a; --ink:#f0e6d2; --muted:#b5a48a; --line:#4d3f2f;
  --accent:#e5784f; --accent-ink:#1e1108; --leaf:#86c08f; --water:#77b9e0; --heart:#f083a2;
  --shade:rgba(0,0,0,.62); --wood:#9a6c44; --wood-dk:#6b4a2e; --paper2:#322920; --fiber:rgba(240,230,210,.05); color-scheme:dark }
/* 화면 높이: 휴대폰은 주소창이 들락날락해서 100%만으로는 아래가 잘릴 수 있다. 지금 보이는 높이(dvh)에 맞추고, 화면 자체는 굴러가지 않게 한다 */
html,body{height:100%;touch-action:manipulation} /* manipulation: 빠르게 두 번 눌러도 화면이 확대되지 않는다 */
@supports (height:100dvh){ html,body{height:100dvh} }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  box-sizing:border-box;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
#app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.brand{font-family:var(--display);font-size:22px;color:var(--leaf);letter-spacing:.02em;margin-right:auto}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.stats{min-width:0;max-width:100%}
.chip{background:var(--surface);border:1.5px solid var(--wood);border-radius:7px;padding:2px 11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.coin{color:var(--accent)}
/* 계절 칩: 철마다 빛깔이 다르고(--sc), 누르면 철 안내가 열린다 */
button.chip{font:inherit;color:inherit;cursor:pointer;line-height:inherit}
#hSeason{border-color:var(--sc,var(--wood));box-shadow:inset 6px 0 0 var(--sc,var(--wood));padding-left:15px}
#hSeason:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.lv{display:flex;align-items:center;gap:6px}
.bar{display:block;width:74px;height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:9px;transition:width .3s}
.bar.en i{background:var(--accent)}
#stage{position:relative;flex:1;min-height:320px;border-radius:12px;overflow:hidden;border:3px solid var(--wood);box-shadow:0 0 0 1.5px var(--wood-dk);background:#16261c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#cv:focus{outline:none}
#cv:focus-visible{outline:3px solid var(--water);outline-offset:-3px}
#fade{position:absolute;inset:0;background:#0b1410;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
#toasts{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:1.5px solid var(--wood);border-radius:8px;padding:5px 14px;
  font-family:var(--display);font-size:15px;max-width:100%;animation:pop .25s ease-out;box-shadow:0 3px 0 var(--shade)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#actBtn{position:absolute;right:10px;bottom:10px;width:54px;height:54px;border-radius:50%;border:2.5px solid var(--accent-ink);padding:0;
  background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:13.5px;line-height:1.08;white-space:pre-line;cursor:pointer;box-shadow:0 3px 0 var(--shade);
  transition:opacity .15s}
#actBtn.idle{opacity:.42} /* 지금 할 것이 없으면 흐리게 */
/* 밭 되돌리기 단추: 행동 단추 바로 위에 잠깐 뜬다 */
#undoBtn{position:absolute;right:8px;bottom:78px;padding:4px 9px;border-radius:8px;border:1.5px solid var(--wood);background:var(--surface);color:var(--ink);font-family:var(--display);font-size:12.5px;cursor:pointer;box-shadow:0 2px 0 var(--shade);touch-action:manipulation}
#actBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
#stage,#bar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.btn,#actBtn{touch-action:manipulation}
/* 작은 지도(오른쪽 위)와 터치용 조작키(왼쪽 아래). 알림 글은 작은 지도를 피해 왼쪽으로 물러난다 */
#mini{position:absolute;top:8px;right:8px;width:min(27%,132px);height:auto;border-radius:8px;border:2px solid var(--wood);background:#16261c;opacity:.94;image-rendering:pixelated;cursor:pointer;z-index:1;transition:opacity .18s}
#mini.ghost{opacity:.13;pointer-events:none} /* 그 밑에 나나 짐승·이웃이 있으면 비켜 준다: 흐려지고, 누름은 그대로 마을 화면으로 간다 */
#stage.hasmini #toasts{right:calc(min(27%,132px) + 18px)}
#keys{position:absolute;left:8px;bottom:8px;width:116px;height:116px;touch-action:none;z-index:1;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#keys i{position:absolute;width:37px;height:37px;border-radius:8px;background:var(--surface);border:2px solid var(--wood);box-shadow:0 3px 0 var(--shade);opacity:.8;
  display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:var(--ink);pointer-events:none}
#keys .u{left:39.5px;top:0} #keys .d{left:39.5px;bottom:0} #keys .l{left:0;top:39.5px} #keys .r{right:0;top:39.5px}
#keys i.on{background:var(--accent);color:var(--accent-ink);opacity:.96;transform:translateY(2px);box-shadow:0 1px 0 var(--shade)}
#dlg:not([hidden])~#keys{display:none}
/* 대화 창은 두루마리처럼: 양옆의 굵은 나무 축 사이에 한지를 펼친 모양 */
#dlg{position:absolute;left:10px;right:10px;bottom:10px;background-color:var(--surface);border:2px solid var(--wood);border-left-width:8px;border-right-width:8px;border-radius:9px;
  padding:12px 14px;box-shadow:0 0 0 1.5px var(--wood-dk),0 5px 0 var(--shade);display:flex;flex-direction:column;gap:8px}
/* 한지의 닥 섬유: 종이로 된 창에 옅은 점을 흩는다 */
.sheet,#dlg,#deco{background-image:radial-gradient(var(--fiber) 1px,transparent 1.6px),radial-gradient(var(--fiber) 1px,transparent 1.4px);background-size:17px 13px,23px 29px;background-position:3px 5px,11px 17px}
#dlgWho{font-family:var(--display);font-size:17px;color:var(--accent);display:flex;align-items:center;gap:8px}
#dlgWho small{font-family:var(--body);font-size:12px;color:var(--muted)}
#dlgText{min-height:3em;font-size:16px;white-space:pre-wrap;cursor:pointer}
#dlgChoices{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
#dlgChoices .btn.sel{outline:3px solid var(--water);outline-offset:2px} /* 방향키로 고른 선택: 스페이스로 정한다 */
/* 단추는 나무패처럼: 모서리를 덜 둥글리고 나무 테두리에 얇은 그림자 턱 */
.btn{font-family:var(--display);font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--wood);
  border-radius:8px;padding:6px 13px;cursor:pointer;line-height:1.3;box-shadow:0 2px 0 var(--line)}
.btn:hover{border-color:var(--wood-dk);background:var(--paper2)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible,#actBtn:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on,.btn.on:hover{background:var(--leaf);color:var(--surface);border-color:var(--leaf)}
.btn.pri:hover{background:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
#bar{display:flex;flex-wrap:wrap;gap:6px}
#bar .sp{margin-left:auto}
#bar .btn{min-width:46px} /* "나"처럼 한 글자짜리 단추도 누르기 쉽게 */
/* 묶음 탭: 도구줄 단추 하나가 창 여럿을 맡는다. 창 제목 아래에 붙어 있고 내용과 함께 굴러가지 않는다 */
#mTabs{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0}
#mTabs .btn{padding:4px 12px;font-size:14px}
#deco{background-color:var(--surface);border:2px solid var(--wood);border-radius:10px;
  padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:30%;overflow:auto;flex:none}
#deco p{margin:0;font-size:13px;color:var(--muted)}
#decoList{display:flex;flex-wrap:wrap;gap:6px}
#decoList .btn{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 4px}
#modal{position:absolute;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
/* 창은 나무 틀에 한지를 바른 문짝처럼: 굵은 나무 테두리, 제목 줄 아래 겹줄, 제목 앞에 붉은 낙관 */
.sheet{background-color:var(--surface);border:3px solid var(--wood);border-radius:11px;box-shadow:0 0 0 1.5px var(--wood-dk),0 6px 0 var(--shade);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:3px double var(--wood);background:var(--paper2)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;margin-right:auto;color:var(--ink);display:flex;align-items:center;gap:8px}
.sheet h2::before{content:"";width:11px;height:11px;border-radius:2.5px;background:var(--accent);flex:none}
#mBody{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cell{border:1.5px solid var(--line);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:13px;text-align:center;background:transparent;color:var(--ink);font-family:var(--body);min-width:0}
button.cell{cursor:pointer}
button.cell:hover{border-color:var(--wood);background:var(--paper2)}
.cell b{font-family:var(--display);font-weight:400;font-size:14px}
.cell small{color:var(--muted)}
.cell.unk img{filter:brightness(0);opacity:.28}
.sub{font-family:var(--display);font-size:16px;margin:4px 0 0;color:var(--ink);border-left:4px solid var(--wood);padding-left:8px;line-height:1.2}
.row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;min-width:0}
.row .grow{flex:1;min-width:0}
.row b{font-family:var(--display);font-weight:400;font-size:16px}
.row small{display:block;color:var(--muted);font-size:13px}
.row .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.row.tap>.ic,.row.tap>.badge,.row.tap>.grow{cursor:pointer} /* 누르면 설명이 열리는 줄 */
.row.tap:hover{border-color:var(--wood)}
.row.tap>.grow:focus-visible{outline:3px solid var(--water);outline-offset:2px;border-radius:6px}
.hearts{color:var(--heart);letter-spacing:1px;font-size:15px}
.hearts i{color:var(--line);font-style:normal}
.note{color:var(--muted);font-size:13px;margin:0}
input,textarea,select{font-size:16px!important} /* 글자가 16px보다 작으면 휴대폰(아이폰)이 글 상자를 누를 때 화면을 확대해 버린다 */
.askbox{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;line-height:1.5;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;min-height:84px}
.askitem{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:4px;min-width:0}
.askitem b{font-size:13px;color:var(--muted);font-weight:400}
.askitem p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.askitem .re{border-left:3px solid var(--leaf);padding-left:8px;color:var(--ink)}
.askrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ic{width:36px;height:36px;flex:none;image-rendering:pixelated}
.ic.big{width:48px;height:48px}
/* 글자 표지는 붉은 도장처럼 */
.badge{width:36px;height:36px;flex:none;border-radius:8px;background:transparent;border:2px solid var(--accent);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px}
#title{position:absolute;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:14px;z-index:6}
#title .sheet{padding:20px 20px 16px;gap:12px;overflow:auto}
#title h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--ink);text-wrap:balance;border-bottom:3px double var(--wood);padding-bottom:6px}
#title p{margin:0}
#titleBody{display:flex;flex-direction:column;gap:12px}
#title label{font-family:var(--display);font-size:15px;display:flex;flex-direction:column;gap:4px}
#title input[type=text]{font:inherit;font-family:var(--body);padding:7px 10px;border-radius:8px;border:1.5px solid var(--wood);background:var(--bg);color:var(--ink);width:100%}
.swatches{display:flex;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
kbd{font-family:var(--display);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px}
ul.help{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
/* 휴대폰 세로: 마을 화면이 넓게 보이도록 위아래 띠를 얇게 한다. 제목은 숨기고, 숫자 칩과 도구 단추를 작게 줄여 두 줄 안에 담는다 */
@media (max-width:520px){
  body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
    padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
  #app{gap:6px} .brand{display:none} #hud{gap:4px}
  .stats{font-size:12.5px;gap:4px} .chip{padding:1px 8px} .bar{width:42px;height:8px}
  #stage{min-height:200px;border-radius:14px}
  #bar{gap:4px} #bar .btn{font-size:13px;padding:5px 8px;border-radius:10px} #bar .sp{margin-left:0}
  #dlgText{font-size:15px} .btn{padding:6px 10px}
  #modal,#title{padding:8px} #title .sheet{padding:14px 14px 12px}
}
/* 휴대폰 가로: 높이가 모자라니 위아래 띠를 한 줄씩으로 줄이고, 도구 단추는 옆으로 밀어 본다 */
@media (max-height:460px) and (orientation:landscape){
  body{padding-top:max(4px,env(safe-area-inset-top,0px));padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
  #app{gap:4px} .brand{display:none} #hud{flex-wrap:nowrap} .stats{flex-wrap:nowrap;overflow:hidden;font-size:12.5px;gap:4px} .chip{padding:1px 8px;flex:none}
  #stage{min-height:120px;border-radius:12px}
  #bar{flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none} #bar::-webkit-scrollbar{display:none}
  #bar .btn{flex:none;font-size:13px;padding:4px 9px;border-radius:10px} #bar .sp{margin-left:0}
  #actBtn{width:48px;height:48px;font-size:12.5px}#undoBtn{bottom:68px}
}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} #fade{transition:none} }
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="brand">도란도란 마을</div>
    <div class="stats">
      <span class="chip" id="hPeers" hidden>함께 2명</span>
      <button class="chip" id="hSeason" type="button" title="철 안내 보기">봄 1일</button>
      <span class="chip" id="hDay">맑음</span>
      <span class="chip" id="hTime">06:00</span>
      <span class="chip coin" id="hCoin">0냥</span>
      <span class="chip lv"><span>기력</span><span class="bar en"><i id="hEn"></i></span></span>
      <span class="chip lv"><span id="hLv">Lv.1</span><span class="bar"><i id="hXp"></i></span></span>
    </div>
  </header>
  <main id="stage">
    <canvas id="cv" tabindex="0" aria-label="마을 화면"></canvas>
    <div id="fade"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="tut" style="display:none"></div>
    <button id="actBtn" type="button" aria-label="행동하기">행동</button>
    <button id="undoBtn" type="button" hidden>되돌리기</button>
    <div id="dlg" hidden>
      <div id="dlgWho"></div>
      <div id="dlgText"></div>
      <div id="dlgChoices"></div>
    </div>
    <div id="keys" hidden aria-hidden="true"><i class="u" data-k="ArrowUp">▲</i><i class="l" data-k="ArrowLeft">◀</i><i class="r" data-k="ArrowRight">▶</i><i class="d" data-k="ArrowDown">▼</i></div>
    <canvas id="mini" hidden aria-label="작은 지도. 누르면 큰 지도가 열려요"></canvas>
    <div id="modal" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <header><h2 id="mTitle"></h2><button class="btn" id="mClose" type="button">닫기</button></header>
        <div id="mTabs" hidden></div>
        <div id="mBody"></div>
      </div>
    </div>

  {v:73,d:'11월 26일',t:'살림 스물한 가지와 돌려 놓기',l:[
    '가구가 스물한 가지 늘었어요. 벽에 거는 것(벽시렁, 합죽선, 양반탈, 갓걸이, 옷 건 횃대), 상 위에 올리는 것(다기, 벼루와 붓, 매화 꽃병, 과일 소쿠리, 서책 더미), 깔개(비단 방석, 대자리), 큰 가구(머릿장, 사방탁자, 뒤주, 네 칸짜리 대청 평상) 같은 것들이에요.',
    '잡화점에 날마다 다른 것이 들어오고, 귀한 것은 장날 보부상과 한양의 가게에서 팔아요. 수련장에서 활을 잘 쏘면 받는 것도 있어요.',
    '두 칸짜리 가구는 세로로 돌려 놓을 수 있어요. 꾸미기에서 고르면 나오는 단추로 가로·세로를 바꿔요.',
    '세트가 둘 늘었어요: 선비의 사랑방, 안방 살림.']},
  {v:72,d:'11월 26일',t:'크기가 다른 가구',l:[
    '가구마다 차지하는 자리가 달라졌어요. 병풍과 가리개, 평상, 보료와 안석, 가야금은 가로 두 칸, 화문석 돗자리는 네 칸을 차지해요. 꾸미기 목록에 [2칸]·[4칸]으로 적혀 있어요.',
    '전에 한 칸으로 놓아 둔 것은 그대로예요. 한 번 거뒀다가 다시 놓으면 큰 모습이 돼요. 평상처럼 넓은 받침에는 칸마다 하나씩 올릴 수 있어요.']},
  {v:71,d:'11월 26일',t:'그림과 액자를 벽에',l:[
    '그림과 액자를 벽에 걸 수 있어요. 꾸미기에서 [벽걸이] 가구를 고르고 벽 바로 아래 칸을 누르면 그 벽에 걸려요. 그 칸에는 다른 가구도 그대로 놓을 수 있어요.',
    '벽에 거는 산수 족자가 잡화점에 들어와요. 전에 바닥에 세워 둔 액자는 한 번 거뒀다가 다시 걸면 돼요.']},
  {v:70,d:'11월 26일',t:'겹쳐 놓는 꾸미기와 이부자리',l:[
    '집 안 가구를 겹쳐 놓을 수 있어요. 깔개는 가구 밑에 깔리고, 화분이나 좌등 같은 작은 것은 상이나 궤 위에 올리고, 등롱이나 풍경은 가구 위 천장에 매달아요.',
    '천장에 매다는 등롱이 잡화점에 들어와요. 상 위에 등을 달아 보세요.',
    '잠자리가 침대에서 바닥에 편 이부자리(요와 이불, 베개)로 바뀌었어요.']},
  {v:69,d:'11월 26일',t:'저마다 다른 가게, 돌아다니는 이웃, 수련장과 옥사',l:[
    '저잣거리의 건물이 저마다 다른 모습이 됐어요. 이층 비단전, 족자를 내건 화방, 차양을 친 방물전, 초가 주막, 누마루가 달린 별서처럼요.',
    '이웃들이 제자리만 맴돌지 않고 다른 이웃이나 가게 앞까지 걸어갔다가 돌아와요. 마주치면 잠깐 이야기도 나눠요.',
    '궁궐에 수련장이 생겼어요. 과녁으로 활을 쏘고, 짚 인형으로 받아치기 수련을 하면 무예가 올라요.',
    '궁궐에 옥사가 생겼어요. 날마다 다른 죄인이 갇혀 있고, 사식을 넣어 줄 수 있어요. 못된 짓을 하다 붙잡히면 여기서 밤을 보내요.']},
  {v:68,d:'11월 26일',t:'어디서 열어도 문의가 전해져요',l:[
    '이제 어느 주소에서 열어도 "문의"에 적은 글이 만든 사람에게 전해져요. 글은 만든 사람만 풀 수 있게 잠가서 보내요.',
    '전에 적어만 두고 보내지 못한 글은 문의 창에서 그 글의 "보내기"를 누르면 보낼 수 있어요.',
    '만든 사람이 답글을 달면 문의 창의 "내가 보낸 글"에 보이고, 아래 단추가 "문의 ●"로 바뀌어요.']},
  {v:67,d:'11월 26일',t:'휴대폰에서 글 쓸 때 확대되던 것 고침',l:[
    '휴대폰에서 문의 창이나 이름·방 이름 칸을 누르면 화면이 확대되던 것을 고쳤어요.']},
  {v:66,d:'11월 26일',t:'길잡이와 문의',l:[
    '레벨이 올라 새로 할 수 있게 된 일을 알려 주는 길잡이가 생겼어요. 아래 "기록"의 "길잡이"에서 지금 할 수 있는 일과 다음에 열리는 일을 볼 수 있어요. 본업처럼 놓치기 쉬운 일은 레벨이 오를 때도 알려 줘요.',
    '아래에 "문의" 단추가 생겼어요. 궁금한 것, 바라는 것, 이상한 것을 적어서 만든 사람에게 보낼 수 있어요.',
    '배경 음악의 소리를 바꿨어요. 짧게 끊겨서 단추 소리처럼 들리던 것을 길게 이어지는 부는 소리로 바꾸고, 장구 소리를 부드럽게 했어요. 설정에서 효과음과 따로 켜요.']},
  {v:65,d:'11월 26일',t:'씨름, 뱃놀이, 묵어 가기',l:[
    '놀이마당에 씨름판이 생겼어요. 틈이 나면 빠르게 눌러 밀고, 상대가 힘을 쓰면 꾹 눌러 버텨요. 세 판에 두 판을 따면 이기고, 이길수록 더 센 맞수가 나와요.',
    '저잣거리 연못에서 뱃놀이를 할 수 있어요. 누르면 아래로, 떼면 위로 배를 몰아 연꽃을 주워요. 쉬는 놀이라 기력이 차요. 밤에 타면 낙화놀이도 함께 봐요.',
    '저잣거리에서 묵어 갈 수 있어요. 주막 봉놋방은 싸고, 연못가에 새로 생긴 별서는 비싸지만 다음 날 하루 기력과 경험치가 올라요. 자고 나면 거기서 눈을 떠요.']},
  {v:64,d:'11월 25일',t:'저잣거리의 놀이와 구경거리',l:[
    '놀이마당에 놀이가 둘 더 생겼어요. 줄타기는 눌렀다 뗐다 하며 줄 위에서 버티는 놀이, 탈춤 장단은 굴러오는 북점에 맞춰 추임새를 넣는 놀이예요. 잘하면 돈을 따요.',
    '점집이 생겼어요. 하루에 한 번 50냥으로 오늘의 운세를 보면 그날 하루 작은 복이 붙어요.',
    '밤이 되면 연못 위로 불티가 꽃잎처럼 떨어지는 낙화놀이가 벌어져요. 연못가에서 행동하면 구경할 수 있어요.']},
  {v:63,d:'11월 25일',t:'놀러 가서 돈 쓰는 곳',l:[
    '놀러 가서 구경하고 돈을 쓸 수 있는 큰 저잣거리가 생겼어요. 어디로 가는지는 이웃에게 들을 수 있어요.',
    '팔도에서 온 사람 여섯이 가게를 열었어요. 비단전의 옷 여섯 벌, 화방의 세간 여섯 가지, 방물전의 장비 네 가지는 거기서만 살 수 있어요.',
    '방물전의 "선물 꾸러미"는 누구에게 주어도 가장 좋아하는 선물이에요. 주막에서는 국밥·파전·식혜를 그 자리에서 사 먹고 기력을 채워요.',
    '투호 놀이판에서 판돈을 걸고 살 다섯 대를 던져요. 연못가 풍류정에서는 하루 한 번 쉬어 갈 수 있어요.',
    '가게 주인과 ♥3이 되면 그 가게의 값을 열에 하나 깎아 줘요. 화방의 세간 여섯 가지를 다 놓으면 새 세트가 돼요.']},
  {v:62,d:'11월 25일',t:'새 짐승과 더 넓어진 사냥 땅',l:[
    '사냥할 짐승이 아홉 가지 늘었어요. 사냥터 숲에 너구리·고라니·오소리가, 깊은 산에 삵과 산양이 나와요. 오소리는 건드리면 덤벼요.',
    '사냥 땅이 하나 더 생겼어요. 어디인지는 이웃에게 들을 수 있어요. 그곳에는 더 날쌔고 사나운 짐승이 살고, 가끔 아주 드문 짐승도 나타난대요.',
    '새 짐승마다 새 전리품이 나와요. 도감의 "사냥감"과 "짐승" 갈래에 적히고, 사냥 방과 사냥 대회에도 새 짐승이 들어가요.']},
  {v:61,d:'11월 25일',t:'계절 칩과 철 안내',l:[
    '화면 위쪽에 계절 칩이 따로 생겼어요. 봄은 분홍, 여름은 풀빛, 가을은 감빛, 겨울은 물빛 띠가 붙어서 지금이 어느 철인지 바로 보여요.',
    '계절 칩을 누르면 "철 안내"가 열려요. 철이 며칠 남았는지, 지금 심을 수 있는 작물, 이 철에만 낚이는 물고기, 주울 수 있는 것, 명절 날짜를 볼 수 있어요.',
    '철이 바뀌는 날 아침에는 새 철이 왔다고 알려 줘요.']},
  {v:60,d:'11월 25일',t:'도감 크게 늘리기',l:[
    '물고기가 열세 가지 늘었어요. 민물에 피라미·미꾸라지·쏘가리·가물치, 바다에 조기·갈치·넙치, 철마다 바다에 도다리·농어·전어·대구, 먼바다에 삼치와 다랑어가 나와요.',
    '철마다 풀밭에서 나물과 열매를 주울 수 있어요. 봄의 쑥과 냉이, 여름의 산딸기와 더덕, 가을의 도토리·대추·은행, 겨울의 솔방울이에요. 바닷가에는 소라와 꽃게가 나와요.',
    '작물이 여섯 가지 늘었어요: 상추, 고추, 가지, 배추, 고구마, 보리. 보리는 겨울에도 자라요. 씨앗은 레벨에 따라 잡화점에 들어와요.',
    '도감에 "나물과 열매" 갈래가 생겼고, 맨 아래에 짐승·가구·옷 갈래도 더했어요. 못 얻은 것은 어디서 나는지 알려 줘요.',
    '갈래에 새것이 더해져서, 전에 다 채운 갈래도 새것을 찾아야 다시 "완성"으로 보여요.']},
  {v:59,d:'11월 25일',t:'한지와 나무로 바꾼 창',l:[
    '창과 단추, 대화 창의 모양을 바꿨어요. 창은 나무 틀에 한지를 바른 문짝처럼, 대화 창은 두루마리처럼, 단추는 나무패처럼 보여요.',
    '빛깔도 풀빛에서 한지 빛과 먹빛, 단청의 주홍으로 바꿨어요. 놀이판의 바탕과 이름표도 같은 빛으로 맞췄어요.',
    '잡화점 살림 다섯 가지의 이름과 그림을 옛 살림으로 바꿨어요: 두레상(둥근 탁자), 둥근 멍석(러그), 좌등(스탠드 조명), 보료와 안석(소파), 질화로(난로). 가지고 있던 것은 그대로 바뀌어요.']},
  {v:58,d:'11월 25일',t:'배경 가락, 소리는 꺼진 채로 시작',l:[
    '배경 가락이 생겼어요. 옛 5음 음계(평조·계면조)로 이 게임을 위해 새로 지은 가락이고, 가야금을 뜯는 듯한 소리와 장구 장단을 그 자리에서 만들어 내요.',
    '마을의 낮, 밤과 집 안, 궁궐, 사냥터·바다·동굴마다 가락이 달라요.',
    '소리는 이제 게임을 열 때마다 꺼진 채로 시작해요. 아래 "설정"에서 효과음과 배경 가락을 따로 켜고 꺼요.']},
  {v:57,d:'11월 25일',t:'이웃 일 거들기',l:[
    '솔이·파랑·다미와도 날마다 한 번씩 함께 할 일이 생겼어요. 말을 걸면 고를 수 있어요.',
    '솔이와 떡메치기: 솔이 손이 빠진 초록 칸에서 떡메를 내리쳐요. 수고비를 받고, 잘 치면 빵도 받아요.',
    '파랑과 그물 걷기: 누르고 있으면 그물을 당겨요. 파도가 오거나 너무 팽팽해지면 손을 떼요. 잡힌 물고기를 나눠 받아요.',
    '다미와 제기차기: 제기가 발 가까이 내려왔을 때 차요. 열 번을 넘기면 다미가 선물을 줘요.',
    '거들수록 친해지고 손맛·무예·기품이 조금씩 올라요. 다섯·열다섯·서른 번째에는 덤이 있어요.']},
  {v:56,d:'11월 25일',t:'높은 자리의 옷과 장비',l:[
    '본업의 높은 자리에 오를 때마다 그 자리의 옷 한 벌과 장비 하나를 받아요. 길마다 네 벌, 네 가지씩 모두 스물네 벌과 스물네 가지예요.',
    '장비는 단계마다 신발, 쓰개, 옷, 그리고 그 길의 으뜸 물건 순서로 받아요. 넷째 단계의 물건은 "전설의" 등급이에요.',
    '이미 높은 자리에 올라 있었다면 그 단계까지의 옷과 장비가 바로 들어와요.',
    '어떤 것이 있는지는 아래 "나"의 "장비" 맨 아래 목록에서 볼 수 있어요.']},
  {v:55,d:'11월 25일',t:'본업과 더 높은 자리',l:[
    '레벨 10부터 걷는 길 가운데 하나를 본업으로 고를 수 있어요. 아래 "나"의 "신분"에서 골라요. 다른 길의 일과 자리는 그대로 할 수 있어요.',
    '본업은 수고비와 녹봉을 1.25배로 받아요. 높은 자리에 오를 때마다 0.25배씩 더 늘어요.',
    '본업의 으뜸 자리에 오른 뒤에는 임금에게 "높은 자리 청하기"로 네 단계를 더 오를 수 있어요. 레벨 12·16·20·25와 스탯, 그 길의 일 횟수, 임금과의 ♥를 갖추고 사은숙배를 올려요.',
    '높은 자리는 그 길의 힘도 키워요: 상인은 파는 값, 무관은 기력, 문관은 경험치, 수라간은 하사금, 왕실은 내탕금, 나쁜 길은 자릿세가 늘어요.',
    '높은 자리에 한 번 오르면 본업을 바꿀 수 없어요. 그 전까지는 바꿀 수 있어요.',
    '길을 걷지 않을 때의 마을 이름도 레벨 26까지 여섯 단계가 더 생겼고, 레벨로 느는 기력도 레벨 16까지로 늘었어요.']},
  {v:54,d:'11월 25일',t:'골동품 장수',l:[
    '열흘에 한 번(10·20·30…일) 큰 장날에 골동품 장수가 와요. 보부상과 객주 좌판 사이에 돗자리를 펴요. 잔치와 겹치는 날에는 오지 않아요.',

function specTxt(B,st){
  const a=[];for(const key in B.fx){const v=B.fx[key]*st+(st>=3&&B.fx3&&B.fx3[key]||0);if(FX_TXT[key])a.push(FX_TXT[key](Math.round(v*100)/100))}
  if(st>=3&&B.fx3)for(const key in B.fx3)if(!(key in B.fx)&&FX_TXT[key])a.push(FX_TXT[key](B.fx3[key]));
  if(B.mw)for(const w in B.mw)a.push('받아칠 틈 +'+(B.mw[w]*st).toFixed(3)+'초');

function specSync(){

  for(const k in S.spec){
    const q=S.spec[k];if(!q||!SPEC[k]||!routeOf(k))continue;const B=SPEC[k].find(b=>b.id===q.id);if(!B)continue;
    while((q.st|0)<3){
      const n=SPEC_ST[(q.st|0)+1];if(S.level<n.lv||specProg(k)<(k==='rogue'?n.inf:n.done))break;
      q.st=(q.st|0)+1;const st=q.st;touch();
      setTimeout(()=>{if(S){sfx('level');toast('【'+B.n+' '+SPEC_ST[st].n+'】에 올랐어요! '+(st===3&&B.m?'달인의 재주: '+B.m:'갈래의 힘이 더 세졌어요')+' ("나"의 "신분")')}},900);
    }

}

    /* 돌려 놓은 것: 바닥에 눕는 것(깔개·가야금)은 그림을 그대로 돌리고, 서 있는 것은 옆모습을 그린다 */

function npcPath(sx,sy,goal,max){
  const key=(x,y)=>y*64+x,prev=new Map(),q=[[sx,sy,0]];prev.set(key(sx,sy),null);
  for(let i=0;i<q.length&&i<1600;i++){
    const [x,y,d]=q[i];
    if(d>0&&goal(x,y)){const out=[];let c=[x,y];while(c&&!(c[0]===sx&&c[1]===sy)){out.push(c);c=prev.get(key(c[0],c[1]))}return out.reverse()}
    if(d>=max)continue;
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(prev.has(k)||!npcStepOk(nx,ny))continue;prev.set(k,[x,y]);q.push([nx,ny,d+1])}

function useStart(x,y,tool){if(x==null||y==null)return;useS={t:USE_T,x,y,tool}}
function useTool(tg,x,y){
  switch(tg.t){
  case 'till':return'hoe';
  case 'soil':{const p=S.farm[x+','+y];return p&&p.c&&CROPS[p.c]&&p.g<CROPS[p.c].days&&!p.w?'can':'hand'}
  case 'tree':return tg.k==='pine'?'axe':'hand';
  case 'water':case 'shoal':return'rod';
  case 'forge':case 'work':case 'pen':return'hammer';
  case 'stock':case 'spring':case 'drill':case 'yard':case 'furn':case 'board':case 'hboard':return'hand';
  }
  return null;
}
function updUse(dt){if(useS&&(useS.t-=dt)<=0)useS=null}
/* 하고 있는 동안 내내 들고 있는 자세(v104, 사용자 요청: 모든 행동에 팔이 나와야 한다): 낚시하는 동안은 낚싯대, 놀이마다 그 연장을 든 팔이 계속 보이고 살짝 까딱인다.
   휘두르는 순간(useS)이 있으면 그것이 먼저다. 새 놀이를 넣으면 HOLD_TOOL에 한 줄 */
const HOLD_TOOL={chop:'axe',shake:'hand',build:'hammer',forge:'hammer',mine:'hammer',plane:'hand',pour:'hand',pound:'hammer',haul:'hand',milk:'hand',cook:'hand',salt:'hand',kindle:'hand',study:'hand',rite:'hand',eye:'hand',haggle:'hand',tuho:'hand',jegi:'hand',yut:'hand',catch:'hand',scoop:'hand',dol:'hand'};
function holdPose(){
  const f=[P.x+P.dir[0],P.y+P.dir[1]];
  if(fishing)return{t:USE_T*(.5+.08*Math.sin(now*3)),x:f[0],y:f[1],tool:'rod'};
  if(mg&&HOLD_TOOL[mg.kind]){const o=mg.o&&mg.o.x!=null?mg.o:null,sw=HOLD_TOOL[mg.kind]==='hand'?.5+.12*Math.sin(now*5):.42+.1*Math.sin(now*4);return{t:USE_T*(1-sw),x:o?o.x:f[0],y:o?o.y:f[1],tool:HOLD_TOOL[mg.kind]}}
  return null;
}
function drawUse(c){
  if(pkS||(mg&&mg.kind==='hunt'))return;
  const s=useS||holdPose();if(!s)return;
  const u=1-s.t/USE_T,px=(rx(P)+.5)*T,py=(ry(P)+.9)*T,tx=(s.x+.5)*T,ty=(s.y+.5)*T,a0=Math.atan2(ty-(py-16),tx-px)||0,sw=Math.sin(u*Math.PI);
  const swing=s.tool==='hoe'||s.tool==='axe'||s.tool==='hammer',r=swing?9:s.tool==='hand'?8+sw*7:10,ha=swing?a0-1.1+u*u*1.5:a0,h=[px+Math.cos(ha)*r,py-17+Math.sin(ha)*r*.8];
  drawArm(c,h);
  c.save();c.translate(h[0],h[1]);
  if(swing){
    c.rotate(a0-1.9+u*u*2.1);line(c,-3,0,16,0,'#8a5a34',2.6);
    if(s.tool==='hoe'){rr(c,13,-1,3.5,9,1,'#59626a');rr(c,13.6,0,2,7.5,1,'#aeb7bd')}
    else if(s.tool==='axe'){poly(c,[10,-1,13,-8,18,-6,18,1,13,2],'#59626a');poly(c,[12,-1,14,-6,17,-5,17,0],'#aeb7bd')}
    else{rr(c,12,-5,6,10,1.5,'#59626a');rr(c,13,-4,2,8,1,'#aeb7bd')}
  }else if(s.tool==='can'){
    c.rotate(a0+.5*sw);rr(c,-1,-5,11,9,2,'#5f8fb0');rr(c,0,-4,4,7,1,'#8fb8d6');line(c,10,-3,16,-6,'#5f8fb0',2.2);
    c.rotate(-(a0+.5*sw));c.fillStyle='#9fd8ff';for(let i=0;i<4;i++){const k=(u*3+i*.25)%1;c.fillRect(Math.cos(a0)*(15+i*2)-1,Math.sin(a0)*10-4+k*14,2,3)}
  }else if(s.tool==='rod'){c.rotate(a0-.5+sw*.5);line(c,-2,0,24,0,'#8a5a34',1.8);line(c,24,0,27,5,'#f3ead6',1)}
  c.restore();
}

  {const tl2=useTool(tg,x,y);if(tl2)useStart(x,y,tl2)}
  switch(tg.t){

  case 'tree':tutMark('act');if(tg.k==='pine')startChop(tg);else startShake(tg);break;
  case 'rock':startMine(tg);break;
  case 'beast':startHunt(tg.b);break;
  case 'peer':peerMenu(tg.p);break;
  case 'cave':caveTalk();break;
  case 'pasture':grazeTalk();break;
  case 'hboard':openHunt();break;
  case 'sgate':gateTalk();break;
  case 'spring':springAct();break;
  case 'drill':drillAct(tg);break;
  case 'yard':toast('내가 놓은 '+jo(YARD[tg.k].n,'이에요','예요')+'. 도구줄의 "가꾸기"에서 거둘 수 있어요');break;
  case 'crock':hitRock(tg);break;
  case 'ladder':ladderAct(tg);break;
  case 'deco':toast(tg.k==='rock'?'이끼 낀 큰 바위예요':'깊은 숲의 나무예요. 여기서는 사냥과 약초 찾기에 마음을 써요');break;
  case 'bld':if(tg.b.res){resAct(tg.b);break}if(tg.b.pal){palAct(tg.b);break}
    if(tg.b.id==='home'){
      // 새 편지가 와 있으면 우편함부터 살핀다
      if(mailNew()&&!tg.skipMail){const n=mailNew(),go=()=>act(Object.assign({},tg,{skipMail:1}),x,y);dialog({who:'우편함',text:'우편함에 깃발이 서 있어요. 새 편지가 '+n+'통 와 있어요.',choices:[['편지 읽기',openMail],[S.camp?'짚자리로':'집으로',go],['그만',null]]});break}
      if(S.camp)campTalk(); /* 아직 집이 없으면 짚자리 */
      else if(S.diy)dialog({who:'내 집',text:'내 손으로 짓는 중이에요. ('+S.diy.step+'/3 단계)',choices:[['이어서 짓기',startBuild],['들어가기',()=>enterHome()],['그만',null]]});
      else enterHome();
    }else if(tg.b.id==='shop')openShop('buy');else{
      const nm=NPCS[tg.b.id].name,say=npcOut()?jo(nm,'은','는')+' 밖에 나가 있어요':'쿨쿨… '+jo(nm,'은','는')+' 자고 있어요';
      // 못된 짓 이야기를 들은 뒤에는 이웃집 문 앞에서 고를 수 있다
      if(rogueKnown()&&bldOwner(tg.b))dialog({who:nm+'의 집',text:say+(S.ruin[tg.b.id]?'\n(집이 엉망이에요. 며칠 지나면 이웃이 고쳐 놓아요. 모루에게 삯을 주면 바로 고쳐요.)':''),choices:[['못된 짓',()=>mischief(tg.b)],['그냥 가기',null]]});
      else toast(say);
    }break;
  case 'board':if(rogueKnown()&&isNight()&&S.scrib!==S.day)dialog({who:'알림판',text:'밤이라 둘레에 아무도 없어요.',choices:[['부탁 보기',openQuests],['낙서하기',startScrib],['그만',null]]});else openQuests();break;
  case 'water':
    // 다리 재목을 가지고 있고 여기에 놓을 수 있으면 먼저 물어본다
    if(S.kit>0&&!tg.sea&&bridgeSpan()){dialog({who:'개울가',text:'여기에 다리를 놓을까요? 물 '+bridgeSpan().length+'칸을 건너요. (남은 재목 '+S.kit+'벌)',choices:[['다리 놓기',startBridge],['낚시하기',()=>startFishing(x,y,tg.sea)],['그만',null]]});break}
    startFishing(x,y,tg.sea);break;
  case 'soil':soilAct(tg.x,tg.y);break;
  case 'till':till(tg.x,tg.y,tg.d);break;
  case 'stock':stockAct(tg.a);break;
  case 'kid':kidMenu(tg.i);break;
  case 'pen':penAct(tg.k);break;
  case 'forge':openForge();break;
  case 'stall':if(tg.k==='peddler')openPeddler();else if(tg.k==='antique')openAntique();else openBroker();break;
  case 'fest':festTalk();break;
  case 'work':if(workDone(tg.k))workUse(tg.k);else openWork(tg.k);break;
  case 'shoal':startFishing(x,y);if(fishing)fishing.deep=tg;break;
  case 'bed':askSleep();break;
  case 'furn':furnAct(tg.f);break;
  }
}
function interact(){
  if(busy())return;
  if((mg||fishing)&&performance.now()<guardUntil)return; /* 막 시작한 놀이에 연달아 눌린 입력이 들어가지 않게 */
  if(mg){mgPress();return}
  if(fishing){reel();return}
  if(P.t<1)return;
  if(garden&&scene==='town'){gardenClick(P.x+P.dir[0],P.y+P.dir[1]);return} /* 가꾸기 중에는 바라보는 칸에 놓거나 거둔다 */
  if(glintHere()>=0){digPress();return} /* 반짝이는 곳 위에 서 있으면 파는 것이 먼저 */
  const f=faceTarget();if(f){act(f.tg,f.x,f.y);return}
  // 바라보는 곳에 아무것도 없을 때: 바로 곁(대각선 포함)의 이웃에게는 돌아서서 말을 걸고, 사냥터에서 가까운 짐승이 있으면 쏠 자리로 가서 겨눈다.
  // (이웃이 돌아다녀서 정확히 바라보기 어렵고, 짐승과 일직선을 맞추기 번거롭다는 말을 듣고 넣었다)
  const id=nearNpc();if(id){const n=N[id],dx=n.x-P.x,dy=n.y-P.y;P.dir=Math.abs(dx)>=Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];talk(id);return}
  const b=nearBeast();if(b)huntClick(b);
}
function nearNpc(){
  if(!civ()||!npcOut())return null;let best=null,bd=9;
  for(const id of NPC_IDS){if(!npcHere(id))continue;const n=N[id],dx=Math.abs(n.x-P.x),dy=Math.abs(n.y-P.y);if(Math.max(dx,dy)===1&&dx+dy<bd){bd=dx+dy;best=id}}
  return best;
}
function nearBeast(){
  if(scene!=='wild')return null;let best=null,bd=8;
  for(const b of beasts){const d=Math.abs(b.x-P.x)+Math.abs(b.y-P.y);if(d<bd){bd=d;best=b}}
  return best;
}
function setPath(goal,after){
  const p=findPath(P.x,P.y,goal,true)||findPath(P.x,P.y,goal,false);if(!p)return false;
  P.path=p;P.goal=goal;P.after=after;P.wait=0;return true;
}
const walkThen=(x,y,fn)=>setPath((a,b)=>a===x&&b===y,fn);
const approach=(x,y)=>setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1&&!npcOn(a,b),
  ()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)!==1)return;P.dir=[x-P.x,y-P.y];const t2=targetAt(x,y);if(t2)act(t2,x,y)});
function clickTile(x,y,low){
  if(mg){mgPress();return}
  if(fishing){reel();return}
  if(x===P.x&&y===P.y&&P.t>=1&&glintHere()>=0){digPress();return} /* 서 있는 자리의 반짝이는 곳을 누르면 판다 */
  P.after=null;P.path=[];
  let tg=targetAt(x,y);
  // 지붕이나 나무 윗부분을 눌렀으면 그 건물·나무를 누른 것으로 본다 (주울 것이 놓인 칸은 제외)
  if(!tg&&(civ())&&low&&!S.pickups.some(p=>p.x===x&&p.y===y)){const t2=targetAt(x,y+1);if(t2&&(t2.t==='tree'||t2.t==='bld'||t2.t==='pen'||t2.t==='stall'||t2.t==='fest'||t2.t==='work')){tg=t2;y++}}
  if(!tg&&scene==='town'&&tillable(x,y)&&soilSides(x,y)>=3){
    // 밭 한가운데 남은 빈칸을 누르면: 그 위나 바로 옆이면 곧바로 갈고, 멀면 옆까지 걸어가서 간다
    const d=Math.abs(x-P.x)+Math.abs(y-P.y),go=()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)===1){P.dir=[x-P.x,y-P.y];till(x,y)}};
    if(d===0)till(x,y,P.dir);else if(d===1)go();else setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1,go);
    return;
  }
  // 서 있는 칸(내 땅의 빈 풀밭)을 누르면 그 칸을 간다. 멀리 있는 풀밭은 그리로 걸어가기만 하고, 도착한 뒤 한 번 더 누르거나 행동하면 갈린다
  if(!tg&&scene==='town'&&x===P.x&&y===P.y&&P.t>=1&&tillable(x,y)){till(x,y,P.dir);return}
  if(!tg){if(walkable(x,y))walkThen(x,y,scene==='town'&&tillable(x,y)?()=>tip('till2','내 땅의 빈 풀밭에 서서 행동을 누르거나, 서 있는 칸을 한 번 더 누르면 그 칸을 갈아요. 흰 테두리가 행동이 걸릴 칸이에요'):null);return}
  if(tg.t==='beast'){huntClick(tg.b);return}
  if(tg.t==='bld'){const b=tg.b;walkThen(b.door[0],b.door[1],()=>{P.dir=[0,-1];act(tg)});return}
  if(tg.t==='soil'){if(Math.abs(x-P.x)+Math.abs(y-P.y)<=1&&(x!==P.x||y!==P.y)){P.dir=[x-P.x,y-P.y];act(tg,x,y)}else walkThen(x,y,()=>act(tg,x,y));return}
  if(tg.t==='npc')N[tg.id].hold=7;
  if(tg.t==='stock')tg.a.hold=7;
  if(tg.t==='water'&&scene!=='palace'){
    // 물은 한 번 눌러서는 낚싯대를 던지지 않는다(걷다가 물을 잘못 누르기 쉽다).
    // 처음 누르면 물가로 가서 물을 바라보기만 하고, 바라보는 물을 한 번 더 누르면(또는 행동 버튼을 누르면) 던진다
    const adj=Math.abs(x-P.x)+Math.abs(y-P.y)===1;
    if(adj&&P.t>=1&&P.dir[0]===x-P.x&&P.dir[1]===y-P.y){act(tg,x,y);return}
    const look=(wx,wy)=>{P.dir=[wx-P.x,wy-P.y];float('한 번 더 누르면 낚시',(wx+.5)*T,wy*T+6);tip('fish2','물가에서 바라보는 물을 한 번 더 누르거나 행동 버튼을 누르면 낚싯대를 던져요')};
    if(adj){if(P.t>=1)look(x,y);return}
    if(setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1&&!npcOn(a,b),()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)===1)look(x,y)}))return;
    // 먼 물을 눌렀으면 가장 가까운 물가로 간다
    let best=null,bd=1e9;
    for(let ty=1;ty<H-1;ty++)for(let tx=1;tx<W-1;tx++){
      if(!walkable(tx,ty))continue;
      for(const [dx,dy] of DIRS){const q=tile[ty+dy][tx+dx];if(q===3||q===4){const d=(tx+dx-x)**2+(ty+dy-y)**2;if(d<bd){bd=d;best=[tx,ty,dx,dy]}}}
    }
    if(best){if(best[0]===P.x&&best[1]===P.y)look(P.x+best[2],P.y+best[3]);else walkThen(best[0],best[1],()=>look(P.x+best[2],P.y+best[3]))}
    return;
  }
  if(approach(x,y))return;
  if(tg.t==='water'){
    // 먼 물을 눌렀으면 가장 가까운 물가로 간다
    let best=null,bd=1e9;
    for(let ty=1;ty<H-1;ty++)for(let tx=1;tx<W-1;tx++){
      if(!walkable(tx,ty))continue;
      for(const [dx,dy] of DIRS){const q=tile[ty+dy][tx+dx];if(q===3||q===4){const d=(tx+dx-x)**2+(ty+dy-y)**2;if(d<bd){bd=d;best=[tx,ty,dx,dy]}}}
    }
    if(best)walkThen(best[0],best[1],()=>{P.dir=[best[2],best[3]];const wx=P.x+best[2],wy=P.y+best[3];startFishing(wx,wy,tile[wy][wx]===4)});
  }
}

function dropFruit(m){

function till(x,y,d){

  if(!useEn(ox?1:3))return;

let lastTill=null,tillDebt=0;
function undoWhat(){
  if(!S||scene!=='town'||mg||fishing||busy()||garden||placing)return null;
  const L=lastTill;
  if(L){const cells=L.cells.filter(k=>S.farm[k]&&!S.farm[k].c);if(cells.length&&performance.now()-L.t<12000)return{cells,en:Math.round(L.en*cells.length/L.cells.length),txt:'되돌리기'};lastTill=null}

  if(tg&&tg.t==='soil'){const k=tg.x+','+tg.y,p=S.farm[k];if(p&&!p.c)return{cells:[k],en:0,txt:'밭 메우기'}}

function undoTill(){

  for(const k of u.cells)delete S.farm[k];
  if(lastTill){S.en=Math.min(maxEn(),S.en+u.en);tillDebt+=u.cells.length}
  const back=!!lastTill;lastTill=null;touch();hud();sfx('chop');

function soilAct(x,y){

  }

function rollBoss(){
  if(S.boss&&S.boss.day===S.day)return S.boss;
  const rng=mulberry((S.day*3571+townSeed*17+11)>>>0),B={day:S.day,on:rng()<.4?1:0,dead:0,at:null,trail:[]};
  if(B.on){
    const far=DEEP.GRASS.filter(q=>q[0]>=26),at=far[Math.floor(rng()*far.length)]||[30,12];B.at=at.slice();
    // 발자국: 들머리에서 그 자리까지 일곱 걸음으로 나눠, 그 근처의 빈 풀밭에 하나씩 찍는다

      const tx=Math.round(3+(at[0]-3)*i/8),ty=Math.round(DEEP_Y+(at[1]-DEEP_Y)*i/8);let best=null,bd=99;
      for(const q of DEEP.GRASS){const d=Math.abs(q[0]-tx)+Math.abs(q[1]-ty)+rng()*.9;if(d<bd){bd=d;best=q}}
      if(best&&!B.trail.some(q=>q[0]===best[0]&&q[1]===best[1]))B.trail.push(best.slice());
    }
  }
  return S.boss=B;
}

function updDrill(m,dt){

function drillEnd(m){

  S.drill=S.drill||{};S.min=Math.min(1380,S.min+20);let g,txt;

     고치기 전에는 기력 4씩으로 하루에 무예를 끝까지 올릴 수 있었다 */
  if(S.drill.day!==S.day){S.drill.day=S.day;S.drill.n=0}
  const full=S.drill.n<DRILL_DAY;S.drill.n++;
  if(m.kind==='bow'){
    const sc=m.score;g=sc>=36?3:sc>=24?2:sc>0?1:0;if(sc>(S.drill.bow|0))S.drill.bow=sc;addXp(full?6+Math.floor(sc/3):2);

    if(m.hits===5&&(!S.drill.ms||av<S.drill.ms))S.drill.ms=av;addXp(full?4+m.hits*3:2);
    txt='받아치기 수련 · 다섯 번 가운데 '+m.hits+'번'+(m.hits?', 평균 '+av+'ms':'')+(g?' · 무예가 조금 올랐어요':'');
  }

  else if(S.drill.n===DRILL_DAY)txt+=' · 오늘 수련은 여기까지 몸에 붙어요';

const payFee=n=>{if(scene!=='resort')return false;if(S.coins<n){toast('판돈이 모자라요');sfx('err');return false}addCoins(-n);return true};
// 줄타기: 누르고 있으면 오른쪽, 손을 떼면 왼쪽으로 기운다. 몸은 기운 쪽으로 더 쏠리고 바람도 민다. 끝까지(14초) 버티면 돈을 딴다
const ROPE_FEE=30;
function startRope(){
  if(!payFee(ROPE_FEE))return;
  mg={kind:'rope',o:{x:P.x,y:P.y,sh:0},b:0,v:0,pr:0,wind:0,wt:1.5,armed:false,note:'',nt:0,cool:0,fin:false,ok:false,end:0};P.path=[];P.after=null;N.deoksoe.hold=60;
  tip('rope','누르고 있으면 오른쪽으로, 손을 떼면 왼쪽으로 몸이 기울어요. 눌렀다 뗐다 하며 가운데에서 버텨요. 깃발이 바람 부는 쪽을 알려 줘요');
}
function updRope(m,dt){
  if(m.nt>0){m.nt-=dt;if(m.nt<=0)m.note=''}
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  const h=holding();if(!m.armed){if(!h)m.armed=true;return} /* 앞에서 누르던 손을 한 번 떼어야 시작 */
  m.wt-=dt;if(m.wt<=0){m.wt=rnd(1,1.8);m.wind=rnd(-1,1)*(.7+m.pr*.9)} /* 건널수록 바람이 세진다 */
  /* 값은 계산으로 맞췄다: 0.2초쯤 늦게 반응해도 거의 건너고, 0.3초 늦으면 셋에 한 번쯤 건넌다 */
  m.v=(m.v+((h?2.6:-2.6)+m.b*2.6+m.wind)*dt)*Math.pow(.4,dt);m.b+=m.v*dt;m.pr+=dt/14;
  if(Math.abs(m.b)>=1){m.fin=true;m.ok=false;m.end=1;m.note='줄에서 떨어졌어요!';m.nt=9;sfx('err')}
  else if(m.pr>=1){m.fin=true;m.ok=true;m.pr=1;m.end=1;m.note='끝까지 건넜어요! 얼쑤!';m.nt=9;sfx('level')}
}
function ropeEnd(m){
  N.deoksoe.hold=0;if(!m.fin){toast('줄타기를 그만뒀어요. 판돈은 돌려받지 못해요');return}
  const q=playTake(),pay=m.ok?Math.round(130*playMul()*q.c):m.pr>=.5?30:0;S.min=Math.min(1380,S.min+20); /* 절반을 넘겨 돌려받는 판돈은 줄이지 않는다 */
  if(pay)addCoins(pay);addXp(Math.round((8+m.pr*20)*q.c));addFriend('deoksoe',q.n<3?(m.ok?6:2):1);if(q.n<3)train('arms',m.ok?3:1);if(m.ok)S.ropeWin=(S.ropeWin|0)+1;saveAll();
  dialog({npc:'deoksoe',who:NPCS.deoksoe.name,text:(m.ok?'얼쑤! 줄 위에서 춤을 추는구먼. 자네, 어름산이 해도 되겠네!':m.pr>=.5?'절반은 넘겼구먼. 판돈은 돌려주지.':'허허, 줄은 눈이 아니라 발바닥으로 보는 걸세. 또 해 보게.')+'\n('+(pay?won(pay)+'을 받았어요':'받은 돈이 없어요')+' · 줄의 '+Math.round(m.pr*100)+'%를 건넜어요)'+playNote(q)});
}
// 탈춤 장단: 굴러오는 북점이 왼쪽 동그라미에 겹칠 때 행동을 눌러 추임새를 넣는다. 딱 맞으면 "얼쑤!"(2점), 조금 어긋나면 "좋다!"(1점), 헛누르면 1점 깎인다
const DANCE_FEE=30,DANCE_GAPS=[.6,.6,.3,.3,.6,.6,.3,.3,.6,.6,.45,.45,.3,.3,.6,.3,.3,.3,.6,.6];
function startDance(mode){
  /* mode가 'tune'(가야금)·'beat'(다듬이)면 집에서 하는 장단 놀이: 판돈도 상금도 없다(tuneEnd). 그 밖에는 놀이마당의 탈춤 장단 */
  const home=mode==='tune'||mode==='beat'?mode:null;
  if(!home&&!payFee(DANCE_FEE))return;
  let t=1.4;const notes=[];for(const gp of DANCE_GAPS){notes.push({t,j:0,s:0});t+=gp}
  mg={kind:'dance',home,o:{x:P.x,y:P.y,sh:0},notes,t:0,len:t+.3,perf:0,good:0,bad:0,hop:0,note:'',nt:0,cool:0,fin:false,end:0};P.path=[];P.after=null;if(!home)N.deoksoe.hold=60;
  tip('dance','북점이 왼쪽 동그라미에 겹칠 때 행동을 눌러요. 장구 소리에 맞추면 쉬워요(설정에서 효과음을 켜요)');
}
function dancePress(m){
  if(m.fin)return;let best=null,bd=9;
  for(const n of m.notes)if(!n.j){const d=Math.abs(n.t-m.t);if(d<bd){bd=d;best=n}}
  if(best&&bd<=.12){best.j=bd<=.055?2:1; /* v74: 얼쑤 ±0.07→±0.055초, 좋다 ±0.16→±0.12초. 전에는 박자를 꽤 놓쳐도 돈이 남았다 */if(best.j===2)m.perf++;else m.good++;m.note=best.j===2?'얼쑤!':'좋다!';m.nt=.35;m.hop=.22;sfx(best.j===2?'coin':'pick')}
  else{m.bad++;m.note='엇박!';m.nt=.3;sfx('err')}
}
function updDance(m,dt){
  if(m.nt>0){m.nt-=dt;if(m.nt<=0)m.note=''}
  if(m.hop>0)m.hop-=dt;
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  m.t+=dt;
  for(const n of m.notes){if(!n.s&&m.t>=n.t){n.s=1;sfx('chop')}if(!n.j&&m.t-n.t>.12)n.j=-1}
  if(m.t>=m.len){m.fin=true;m.end=1.1;m.note='한 판 끝! 얼쑤 '+m.perf+' · 좋다 '+m.good;m.nt=9}
}
function danceEnd(m){
  if(m.home){tuneEnd(m);return}
  N.deoksoe.hold=0;if(!m.fin){toast('탈춤 구경을 그만뒀어요. 판돈은 돌려받지 못해요');return}
  const q=playTake(),sc=Math.max(0,m.perf*2+m.good-m.bad),pay=Math.round(sc*5*playMul()*q.c);S.min=Math.min(1380,S.min+20); /* 점수마다 5냥(v74: 6냥에서 낮춤) */
  if(pay)addCoins(pay);addXp(Math.round((8+sc)*q.c));addFriend('deoksoe',q.n<3?(sc>=28?6:3):1);if(q.n<3)train('grace',sc>=28?3:1);if(sc>(S.danceBest|0))S.danceBest=sc;saveAll();
  dialog({npc:'deoksoe',who:NPCS.deoksoe.name,text:(sc>=32?'얼쑤! 구경꾼들이 다 자네만 보네. 타고난 광대일세!':sc>=18?'장단이 몸에 붙었구먼. 구경꾼들이 엽전을 던지네!':'허허, 장단은 귀로 듣고 어깨로 받는 걸세. 또 놀아 보게.')+'\n('+sc+'점 · '+(pay?'구경꾼들이 던진 '+won(pay)+'을 받았어요':'받은 돈이 없어요')+')'+playNote(q)});
}

// 낙화놀이: 밤이면 풍류정 연못 위로 불티가 떨어진다(render의 밤 빛 차례에 nakhwa). 연못가에서 행동하면 하루 한 번 구경한다
function nakhwa(c){
  const x0=4*T,x1=10*T,y0=16.2*T,t=now;
  for(let i=0;i<54;i++){
    const u=(t*(.32+((i*37)%10)*.02)+i*.193)%1,x=x0+((i*61)%97)/97*(x1-x0)+Math.sin(t*1.7+i)*3,y=y0+u*4.3*T,a=(1-u)*.9;
    c.fillStyle='rgba(255,'+(150+((i*13)%80))+',60,'+a.toFixed(2)+')';c.fillRect(x,y,2.2,2.2+u*5);
  }
  for(const q of [[5.2,16.2],[7,16],[8.8,16.2]]){const g=c.createRadialGradient(q[0]*T,q[1]*T,2,q[0]*T,q[1]*T,26);g.addColorStop(0,'rgba(255,190,90,.5)');g.addColorStop(1,'rgba(255,190,90,0)');circ(c,q[0]*T,q[1]*T,26,g)}
}
function watchNakhwa(){
  if(S.nakDay===S.day){toast('불티가 연못 위로 꽃잎처럼 떨어져요. 오늘 구경은 실컷 했어요');return}
  S.nakDay=S.day;addXp(20);train('grace',2);S.min=Math.min(1380,S.min+15);sfx('heart');saveAll();
  dialog({who:'낙화놀이',text:'줄에 매단 숯 주머니에서 불티가 꽃잎처럼 연못 위로 떨어져요. 구경꾼들 사이에서 한참을 바라봤어요.\n(경험치 +20 · 기품이 조금 올랐어요)'});
}
// 투호: 판돈을 내고 살 다섯 대를 던진다. 흰 줄이 좌우로 오가고, 가운데 초록 칸(항아리 입구)에 왔을 때 던지면 들어간다. 던질수록 빨라지고 입구가 좁아진다
const TUHO_FEE=40,TUHO_PAY=[0,0,40,100,200,450];
function tuhoTalk(){
  dialog({npc:'deoksoe',who:NPCS.deoksoe.name,text:'투호 한판 하겠나? 살 다섯 대를 던져 항아리에 넣는 놀이일세. 판돈은 '+won(TUHO_FEE)+'. 두 대면 본전이고, 셋부터는 돈을 따네!\n(가진 돈 '+won(S.coins)+(S.tuhoBest?' · 가장 많이 넣은 것 '+S.tuhoBest+'대':'')+')',
    choices:[['던져 본다',startTuho],['다음에요',null]]});
}
function startTuho(){
  if(scene!=='resort')return;if(S.coins<TUHO_FEE){toast('판돈이 모자라요');sfx('err');return}
  addCoins(-TUHO_FEE);
  mg={kind:'tuho',o:{x:P.x,y:P.y,sh:0},i:0,n:5,hit:0,p:rnd(0,6),sp:2.6,zw:.2,fly:0,res:0,at:0,note:'',nt:0,cool:0,fin:false,end:0};P.path=[];P.after=null;N.deoksoe.hold=60;
  tip('tuho','흰 줄이 좌우로 움직여요. 가운데 초록 칸에 왔을 때 행동을 눌러 살을 던져요');
}
function tuhoPress(m){
  if(m.fin||m.fly>0)return;
  m.at=Math.sin(m.p);m.res=Math.abs(m.at)<=m.zw?1:0;m.fly=.6;if(m.res)m.hit++;sfx('cast');
}
function updTuho(m,dt){
  if(m.nt>0){m.nt-=dt;if(m.nt<=0)m.note=''}
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  if(m.fly>0){
    m.fly-=dt;if(m.fly>0)return;
    m.note=m.res?'들어갔어요!':'빗나갔어요';m.nt=.6;sfx(m.res?'coin':'err');m.i++;
    if(m.i>=m.n){m.fin=true;m.end=1;m.note='다섯 대 가운데 '+m.hit+'대';m.nt=9}else{m.sp+=.45;m.zw=Math.max(.1,m.zw-.022);m.p=rnd(0,6)}
    return;
  }
  m.p+=dt*m.sp;
}
function tuhoEnd(m){
  N.deoksoe.hold=0;if(!m.fin){toast('투호를 그만뒀어요. 판돈은 돌려받지 못해요');return}
  const q=playTake(),pay=Math.round(TUHO_PAY[m.hit]*(perk('deoksoe')?1.2:1)*q.c),all=m.hit===5&&!S.tuhoAll;
  if(m.hit>(S.tuhoBest|0))S.tuhoBest=m.hit;S.min=Math.min(1380,S.min+20);
  if(pay)addCoins(pay);addXp(Math.round((6+m.hit*3)*q.c));addFriend('deoksoe',q.n<3?2+m.hit:1);if(all){S.tuhoAll=1;gain('giftbox',2)}
  saveAll();
  dialog({npc:'deoksoe',who:NPCS.deoksoe.name,text:(m.hit>=5?'허허, 다섯 대를 다 넣다니! 내 평생 몇 번 못 본 솜씨일세.':m.hit>=3?'제법이구먼! 약속대로 돈을 내주지.':m.hit===2?'아깝구먼. 두 대면 본전은 건졌네.':'허허, 오늘은 손이 안 풀렸구먼. 또 오게.')
    +'\n('+m.hit+'대를 넣었어요'+(pay?' · '+won(pay)+'을 받았어요':'')+(all?' · 처음으로 다 넣은 기념으로 선물 꾸러미 2개를 받았어요':'')+')'+playNote(q)});
}

const fishCount=()=>Object.keys(FISHLOOK).reduce((a,k)=>a+have(k),0);
const canCook=id=>Object.keys(RECIPES[id].need).every(k=>(k==='fish'?fishCount():have(k))>=RECIPES[id].need[k]);
function takeIngr(id){
  const need=RECIPES[id].need;
  for(const k in need){
    if(k!=='fish'){gain(k,-need[k]);continue}
    // 물고기는 가장 값싼 것부터 쓴다
    for(let n=need[k];n>0;n--){const f=Object.keys(FISHLOOK).filter(q=>have(q)).sort((a,b)=>ITEMS[a].p-ITEMS[b].p)[0];if(f)gain(f,-1)}
  }
}
function grantFit(r){const k=JOBS.cook.fit[r];if(!S.owned.includes(k))S.owned.push(k)}
// 재료 따지기와 쓰기 (요리와 장독대가 같이 쓴다). fish는 아무 물고기나, 값싼 것부터
const needText=need=>Object.keys(need).map(k=>(k==='fish'?'물고기':ITEMS[k].n)+' '+need[k]+'(가진 것 '+(k==='fish'?fishCount():have(k))+')').join(' · ');
const hasNeed=need=>Object.keys(need).every(k=>(k==='fish'?fishCount():have(k))>=need[k]);
function takeNeed(need){
  for(const k in need){
    if(k!=='fish'){gain(k,-need[k]);continue}
    for(let n=need[k];n>0;n--){const f=Object.keys(FISHLOOK).filter(q=>have(q)).sort((a,b)=>ITEMS[a].p-ITEMS[b].p)[0];if(f)gain(f,-1)}
  }
}
// 음식 짓기 창. home이면 집 아궁이: 누구나 집 음식(home)을 짓고, 수라간에서 배운 음식도 지을 수 있다
function openCook(home){
  if(!home&&!S.job){toast('수라간이에요. 여기서 일하려면 앞에 있는 연 상궁에게 말을 걸어요');return}
  openModal(home?'아궁이':'수라간',body=>{
    body.appendChild(el('p','note',home?'집에서 음식을 지어요. 불 조절에 실패해도 재료는 줄지 않아요. 수라간에서 배운 음식도 여기서 지을 수 있어요.'
      :'음식을 골라 지어요. 불 조절에 실패해도 재료는 줄지 않아요. 지은 음식은 수라상에 올리거나, 먹거나, 팔 수 있어요.'));
    const sq=S.job?specOf('cook'):null;let head=false;
    for(const id in RECIPES){
      const R=RECIPES[id];
      if(R.spec){ /* 전문 갈래의 음식: 고른 갈래의 것만 보이고, 단계가 차야 배운다 */
        if(!sq||sq.B.id!==R.spec)continue;
        if(!head){head=true;body.appendChild(el('p','sub','전문 갈래 · '+sq.B.n+' '+SPEC_ST[sq.st].n))}
        const no=sq.st<R.st;
        row(body,icon('item',id),ITEMS[id].n,no?['【'+sq.B.n+' '+SPEC_ST[R.st].n+'】이 되면 배워요']:['재료: '+needText(R.need),'팔면 '+sellPrice(id)+'냥 · 먹으면 기력 +'+EAT[id]],[['짓기',()=>{closeModal();startCook(id)},no||!canCook(id)]]);
        continue;
      }
      const lock=!(R.home||(S.job&&R.rank<=S.job.rank));
      if(lock&&!S.job)continue; // 수라간 사람이 아니면 배울 수 없는 음식은 보여 주지 않는다
      row(body,icon('item',id),ITEMS[id].n,lock?[JOBS.cook.ranks[S.sex==='f'?'f':'m'][R.rank]+'의 자리에 오르면 배워요']:['재료: '+needText(R.need),'팔면 '+sellPrice(id)+'냥 · 먹으면 기력 +'+EAT[id]],
        [['짓기',()=>{closeModal();startCook(id)},lock||!canCook(id)]]);
    }
    if(S.job&&!sq&&S.level>=SPEC_LV&&S.job.rank>=1)body.appendChild(el('p','note','"나"의 "신분" 창에서 수라간의 전문 갈래를 고르면 그 갈래만의 음식을 배워요.'));
  });
}

let cave=null;
function genCave(f){

  for(let y=0;y<H;y++){tile.push(new Array(W).fill(9));objAt.push(new Array(W).fill(null))}
  // 네모난 굴의 가장자리를 들쭉날쭉하게 깎는다 (모서리는 늘 벽)
  for(let y=Y0;y<=Y1;y++)for(let x=X0;x<=X1;x++){
    const ex=x===X0||x===X1,ey=y===Y0||y===Y1;
    if((ex&&ey)||((ex||ey)&&rng()<.45))continue;
    tile[y][x]=10;
  }
  // 들어온 자리: 왼쪽 벽에 올라가는 사다리가 걸려 있고, 그 앞은 늘 비어 있다
  const sy=Math.floor((Y0+Y1)/2),sp=[X0+1,sy],up=[X0,sy];
  tile[sy][X0]=9;objAt[sy][X0]={t:'ladder',x:X0,y:sy};
  for(let dy=-1;dy<=1;dy++)for(let dx=0;dx<=1;dx++)tile[sy+dy][X0+1+dx]=10;
  const cells=[];
  for(let y=Y0;y<=Y1;y++)for(let x=X0;x<=X1;x++)if(tile[y][x]===10&&!(x<=X0+2&&Math.abs(y-sy)<=1))cells.push([x,y]);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}

  const table=CAVE_ORE(f),n=Math.floor(cells.length*.42),veinP=.18+Math.floor((f-1)/5)*.03;

function studyFlip(i){

function riteRound(m){
  m.seq=[];
  for(let i=0;i<m.rounds[m.r];i++){let d=Math.floor(Math.random()*4);if(i&&d===m.seq[i-1]&&Math.random()<.7)d=(d+1+Math.floor(Math.random()*3))%4;m.seq.push(d)}
  m.phase='show';m.t=-.8;m.k=-1;m.i=0;
}
// 미니게임 판 키우기(v82, 사용자 요청: 너무 작고 읽기 어렵다): 머리 위의 판을 화면 크기에 맞춰 mgK()배(1~1.7)로 그린다.
// ritePad()=판의 가운데(화면 밖으로 나가지 않게 안으로 민다. 화면이 낮으면 캐릭터를 덮는다). 그릴 때는 mgPad(c)가 가운데를 축으로 늘림을 걸고,
// drawMg가 끝에 풀면서 그 판의 이름표도 같이 옮긴다(label의 lblT). 누른 자리를 보는 riteClick·eyeClick은 같은 배율로 거꾸로 센다
const mgK=()=>clamp(Math.min((view.w-16)/200,(view.h-24)/175),1,1.7);
const ritePad=()=>{const K=mgK(),py=(ry(P)+.9)*T,ex=100*K+4,ey=60*K+16;
  return{cx:clamp((rx(P)+.5)*T,cam.x+ex,Math.max(cam.x+ex,cam.x+view.w-ex)),cy:clamp(py-44-ey,cam.y+ey,Math.max(cam.y+ey,cam.y+view.h-ey))}};
let padT=null;
function padAt(c,x,y){const K=mgK();padT={cx:x,cy:y,K};c.save();c.translate(x,y);c.scale(K,K);c.translate(-x,-y)}
function mgPad(c){const p=ritePad();padAt(c,p.cx,p.cy);return p}
function drawMg(c,labels){
  padT=null;const n=labels.length;drawMgIn(c,labels);
  if(!padT)return;
  c.restore();const t=padT;padT=null;
  for(let i=n;i<labels.length;i++){const f=labels[i];labels[i]=()=>{lblT=t;f();lblT=null}}
}
function ritePress(d){
  const m=mg;if(!m||m.kind!=='rite'||m.fin||m.phase!=='input'||d<0||d>3)return;
  m.flash=.2;m.lit=d;m.t=0;
  if(d===m.seq[m.i]){
    sfx('n'+d);m.i++;if(m.i<m.seq.length)return;
    m.r++;
    if(m.r>=m.rounds.length){m.fin=true;m.ok=true;m.end=.7;m.note='흐트러짐 없이 해냈어요!';return}
    riteRound(m);m.note='좋아요! 다음 차례';m.nt=.8;
  }else{
    sfx('err');m.miss++;
    if(m.miss>m.maxMiss){m.fin=true;m.ok=false;m.end=.7;m.note='예법이 흐트러졌어요';return}
    m.phase='show';m.t=-.9;m.k=-1;m.i=0;m.note='틀렸어요. 다시 잘 보세요';m.nt=.9;
  }
}
function riteClick(wx,wy){
  const p=ritePad(),K=mgK();
  for(let d=0;d<4;d++)if(Math.hypot(wx-(p.cx+DIRS[d][0]*32*K),wy-(p.cy+DIRS[d][1]*32*K))<=19*K){ritePress(d);return}
}
function updRite(m,dt){
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  if(m.flash>0)m.flash-=dt;
  if(m.nt>0){m.nt-=dt;if(m.nt<=0)m.note=''}
  m.t+=dt;
  if(m.phase==='show'){
    // 한 동작에 0.6초(켜짐 0.42초). 다 보여 주고 나면 따라 할 차례가 된다
    const k=Math.floor(m.t/.6);
    if(m.t>=0&&k!==m.k&&k<m.seq.length){m.k=k;sfx('n'+m.seq[k])}
    if(m.t>=m.seq.length*.6+.15){m.phase='input';m.i=0;m.t=0}
  }else if(m.t>10){m.fin=true;m.ok=false;m.end=.5;m.note='머뭇거리다 흐트러졌어요'}
}

let cop=null,jailNight=false;
const COP_LOOK={skin:'#e8c09a',hair:'#2e2a2a',shirt:'#2e4a8a',bot:'#3a3a40',rib:'#c8392f',sex:'m',hat:'jeonrip'};
function callCop(){
  if(cop||scene!=='town'||(S.wanted|0)<1)return;
  const road=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(TOWN.tile[y][x]===1&&canStep(x,y)){const d=Math.abs(x-P.x)+Math.abs(y-P.y);if(d>=8&&d<=14)road.push([x,y])}
  if(!road.length)return;const q=pick(road);
  cop={x:q[0],y:q[1],fx:q[0],fy:q[1],t:1,dir:[0,1],life:14+S.wanted*2};
  setTimeout(()=>{if(cop)toast('"게 섰거라!" 포졸이 달려와요. 잡히기 전에 달아나요 (집 안이나 마을 밖으로 숨어요)')},1000);

function updCop(dt){
  if(!cop)return;
  if(scene!=='town'){cop=null;toast('포졸을 따돌렸어요. 수배는 하루에 하나씩 풀려요');return}
  cop.life-=dt;if(cop.life<=0){cop=null;toast('포졸이 씩씩거리며 돌아갔어요');return}
  if(cop.t<1){cop.t=Math.min(1,cop.t+dt*3.5);if(cop.t>=1){cop.fx=cop.x;cop.fy=cop.y}return}
  if(Math.abs(cop.x-P.x)+Math.abs(cop.y-P.y)<=1){copCatch();return}
  const p=findPath(cop.x,cop.y,(a,b)=>Math.abs(a-P.x)+Math.abs(b-P.y)<=1,false);
  if(p&&p.length){const [nx,ny]=p[0];if(walkable(nx,ny)&&!(nx===P.x&&ny===P.y)){cop.dir=[Math.sign(nx-cop.x),Math.sign(ny-cop.y)];cop.fx=cop.x;cop.fy=cop.y;cop.x=nx;cop.y=ny;cop.t=0}}
}

function reach(block){

function syncKids(){
  kidsIn=[];if(!S)return;
  if(scene==='home'&&!decoMode&&!S.inQ){ /* 아이들은 집에 있다. 궁궐 처소에는 오지 않는다 */
    const e=roomEntry(),taken=new Set();if(mate)taken.add(mate.x+','+mate.y);
    S.kids.forEach((k,i)=>{
      if(k.gift&&!kidsInside())return;
      let best=null,bd=1e9;const tx=k.gift?3:1,ty=2;
      for(const key of roomSet()){
        const q=key.split(','),x=+q[0],y=+q[1];
        if((x===0&&y<2)||(x===1&&y===1)||(x===e[0]&&y===e[1])||(x===P.x&&y===P.y)||furnAt(x,y)||taken.has(key))continue;
        const dd=Math.abs(x-tx)+Math.abs(y-ty)+i*.1;if(dd<bd){bd=dd;best={i,x,y}}
      }
      if(best){kidsIn.push(best);taken.add(best.x+','+best.y)}
    });
  }
  const out=scene==='town'&&!kidsInside();
  kidsOut=kidsOut.filter(a=>out&&S.kids[a.i]&&S.kids[a.i].gift);
  if(out)S.kids.forEach((k,i)=>{
    if(!k.gift||kidsOut.some(a=>a.i===i))return;
    const d=BLD[0].door,opts=[];
    for(let y=d[1];y<=d[1]+4;y++)for(let x=d[0]-4;x<=d[0]+4;x++)
      if(kidYard(x,y)&&!(x===P.x&&y===P.y)&&!kidOn(x,y)&&!herdOn(x,y)&&!npcOn(x,y)&&!beastOn(x,y)&&!S.pickups.some(q=>q.x===x&&q.y===y))opts.push([x,y]);
    if(!opts.length)return;
    const [x,y]=pick(opts);kidsOut.push({i,x,y,fx:x,fy:y,t:1,dir:[0,1],wait:rnd(.5,2),hold:0});
  });
}
function updKids(dt){
  const key=scene+'|'+(decoMode?1:0)+(kidsInside()?1:0)+(mate?1:0)+'|'+S.kids.map(k=>k.gift?1:0).join('');
  if(key!==kidKey){kidKey=key;syncKids()}
  if(scene!=='town')return;
  for(const a of kidsOut){
    if(a.t<1){a.t=Math.min(1,a.t+dt*3.2);if(a.t>=1){a.fx=a.x;a.fy=a.y}continue}
    if(a.hold>0){a.hold-=dt;continue}

    const [dx,dy]=pick(DIRS),nx=a.x+dx,ny=a.y+dy;

}

const PLANE_N=60;
function startJoin(id){
  const F=FURN[id],K=F&&F.mk;if(scene!=='town'||!K||!S.plans[id]||S.coins<K.cost||!hasNeed(K.need)||!useEn(5))return;

// 널판 한 장: 옹이를 칸칸이 하나씩 놓는다(서로 붙지 않게). 장이 넘어갈수록 옹이가 늘고 대패가 빨라진다
function planeBoard(m){
  const g=FURN[m.id].mk.g,n=Math.min(5,2+g+m.pass),s=.82/n;
  m.knots=[];for(let i=0;i<n;i++){const w=rnd(.05,.08),a=.12+i*s+rnd(.03,Math.max(.03,s-w-.04));m.knots.push([a,a+w,0])}
  m.x=-.2;m.sp=.27+g*.035+m.pass*.03;m.hit=0;m.cells=new Array(PLANE_N).fill(0);m.snd=0;m.jolt=0;m.down=false;
}
const planeKnot=(m,x,pad)=>m.knots.find(k=>x>=k[0]+pad&&x<=k[1]-pad);
function updPlane(m,dt){
  if(m.nt>0){m.nt-=dt;if(m.nt<=0)m.note=''}
  if(m.jolt>0)m.jolt-=dt;
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  const x0=m.x;m.x+=m.sp*dt;m.down=holding();
  if(m.down&&m.x>0&&x0<1){
    const kn=planeKnot(m,m.x,.012); /* 옹이 가장자리는 조금 봐준다 */
    if(kn){if(!kn[2]){kn[2]=1;m.hit++;m.note='옹이에 걸렸어요!';m.nt=.6;m.jolt=.3;sfx('err')}}
    else{
      for(let i=Math.max(0,Math.floor(x0*PLANE_N));i<=Math.min(PLANE_N-1,Math.floor(m.x*PLANE_N));i++)if(!planeKnot(m,(i+.5)/PLANE_N,0))m.cells[i]=1;
      m.snd-=dt;if(m.snd<=0){m.snd=.2;sfx('chop')}
    }
  }
  if(m.x>=1.06){
    // 한 장의 점수: 옹이 아닌 곳을 얼마나 깎았는가, 옹이에 걸릴 때마다 0.2씩 깎임
    let clean=0,cut=0;for(let i=0;i<PLANE_N;i++)if(!planeKnot(m,(i+.5)/PLANE_N,0)){clean++;cut+=m.cells[i]}
    const q=clamp(cut/clean-m.hit*.2,0,1);m.q.push(q);m.pass++;
    if(m.pass>=m.n){m.fin=true;m.end=.8;m.down=false;m.note='다 밀었어요!';m.nt=9}
    else{m.note=q>=.85?'결이 곱게 나왔어요! 다음 널판':q>=.6?'됐어요. 다음 널판':'거칠어요… 다음 널판';m.nt=1.2;planeBoard(m)}
  }
}

// S.tut=지금 걸음(0~4), -1이면 끝났거나 건너뜀. 이미 하던 마을(이틀째 이후나 레벨 2 이상)은 -1로 시작한다(fixState). 설정에서 다시 볼 수 있다.
// tutM=이번 걸음에서 한 일(저장하지 않는다). 걷기는 updTut이 칸 수를 세고, 나머지는 그 일을 하는 곳에서 tutMark로 알린다(행동=나무, 가방=openBag, 이웃=말 걸기)
const TUT=[
  {t:'걷기',d:()=>touchDev?'가고 싶은 곳을 눌러서 걸어 봐요.':'방향키(또는 W·A·S·D)로 걸어 봐요. 가고 싶은 곳을 눌러도 돼요.',ok:m=>m.walk>=5},
  {t:'행동',d:()=>'과일나무(붉은 화살표) 앞에 서서 '+(touchDev?'오른쪽 아래 "행동" 단추를':'스페이스 키를')+' 눌러 흔들어 봐요. 떨어진 열매는 그 위를 지나가면 주워요.',ok:m=>m.act},
  {t:'가방',d:()=>'아래 "가방"을 눌러 주운 것을 봐요. 먹을 것은 가방에서 먹어 기력을 채워요.',ok:m=>m.bag},
  {t:'이웃',d:()=>npcOut()?'이웃(붉은 화살표)에게 다가가 행동을 눌러 말을 걸어 봐요. 선물을 주고 부탁을 들어주면 가까워져요.':'이웃들은 아침 6시 반에 집에서 나와요. 나오면 다가가 행동을 눌러 말을 걸어 봐요. 밤 10시에는 다시 들어가요.',ok:m=>m.talk},
  {t:'하루',d:()=>'해가 지면 '+(S.camp?'짚자리':'집의 이부자리')+'에서 행동을 눌러 자요. 자면 하루가 넘어가고 기력이 차요. 이제 마음대로 살아 봐요!',ok:m=>m.fin,btn:'알겠어요'}
];
const tutEl=$('tut');let tutM=null;
tutEl.style.cssText='display:none;position:absolute;left:8px;bottom:8px;z-index:3;max-width:min(470px,calc(100% - 96px));background:rgba(251,245,230,.97);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.45;color:#33261c;box-shadow:0 2px 8px rgba(0,0,0,.2);gap:8px;align-items:center';
function tutMark(k){if(tutM&&S&&S.tut>=0)tutM[k]=1}
function tutSync(){
  const on=!!S&&started&&S.tut>=0&&S.tut<TUT.length;
  tutEl.style.display=on?'flex':'none';if(!on){tutM=null;return}
  const q=TUT[S.tut];if(!tutM)tutM={walk:0,px:P.x,py:P.y};
  tutEl.textContent='';
  const tx=el('div',null,'');tx.style.flex='1';tx.appendChild(el('b',null,'길라잡이 '+(S.tut+1)+'/'+TUT.length+' · '+q.t+' '));tx.appendChild(document.createTextNode(q.d()));tutEl.appendChild(tx);
  const b=el('button','btn'+(q.btn?' pri':''),q.btn||'건너뛰기');b.type='button';b.style.flex='none';
  b.onclick=()=>{if(q.btn)tutMark('fin');else tutEnd(true);cv.focus({preventScroll:true})};tutEl.appendChild(b);
}
function tutEnd(skip){
  S.tut=-1;tutM=null;tutSync();touch();
  toast(skip?'길라잡이를 건너뛰었어요. "설정"에서 다시 볼 수 있어요':'길라잡이 끝! 아래 "기록"의 "길잡이"에 레벨마다 할 수 있는 일이 적혀 있어요');
}
function updTut(){
  if(!S||!started||!(S.tut>=0)){if(tutEl.style.display!=='none')tutEl.style.display='none';return}
  if(!tutM||tutEl.style.display==='none'){tutSync();return}
  if(P.x!==tutM.px||P.y!==tutM.py){tutM.walk++;tutM.px=P.x;tutM.py=P.y}
  if(S.tut===3){const o=npcOut();if(tutM.out!==o){tutM.out=o;tutSync()}} /* 이웃이 집에서 나오고 들어감에 따라 글을 바꾼다 */
  if(!TUT[S.tut].ok(tutM)||mg)return; /* 하던 놀이(나무 흔들기)가 끝난 뒤에 넘어간다 */
  S.tut++;tutM=null;sfx('pick');touch();
  if(S.tut>=TUT.length)tutEnd(false);else tutSync();
}
/* 길라잡이의 화살표: 행동 걸음에는 가장 가까운 열매 달린 과일나무, 이웃 걸음에는 가장 가까운 이웃 위에 */
function drawTut(c){
  if(!S||!(S.tut===1||S.tut===3)||scene!=='town'||mg)return;
  let t=null,best=1e9;
  if(S.tut===1){for(const o of TREES){if(o.k==='pine'||!S.trees[o.i]||S.trees[o.i].d>S.day)continue;const d=Math.abs(o.x-P.x)+Math.abs(o.y-P.y);if(d<best){best=d;t=[o.x,o.y,-52]}}}
  else if(npcOut())for(const id of TOWN_IDS){if(!npcHere(id))continue;const n=N[id],d=Math.abs(n.x-P.x)+Math.abs(n.y-P.y);if(d<best){best=d;t=[rx(n),ry(n),-40]}}
  if(!t)return;
  const x=(t[0]+.5)*T,y=t[1]*T+t[2]+Math.sin(now*6)*4;
  poly(c,[x-10,y-13,x+10,y-13,x,y+3],'#fffbe8');poly(c,[x-7,y-11,x+7,y-11,x,y],'#d9412e');
}
function closeModal(){if($('modal').hidden)return;$('modal').hidden=true;cv.focus({preventScroll:true})}
function row(body,ic,name,sub,acts){
  const r=el('div','row');r.appendChild(ic);
  const g=el('div','grow');g.appendChild(el('b',null,name));for(const s of [].concat(sub))g.appendChild(el('small',null,s));r.appendChild(g);
  if(acts&&acts.length){const a=el('div','acts');for(const [l,fn,dis] of acts){const b=el('button','btn',l);b.type='button';b.disabled=!!dis;b.onclick=fn;a.appendChild(b)}r.appendChild(a)}
  body.appendChild(r);return r;
}
function cellOf(kind,k,sub,tag){const c=el(tag||'div','cell');if(tag)c.type='button';c.appendChild(icon(kind,k));c.appendChild(el('b',null,(kind==='item'?ITEMS:FURN)[k].n));c.appendChild(el('small',null,sub));return c}

    const ids=Object.keys(S.inv);
    if(!ids.length)body.appendChild(el('p',null,'가방이 비어 있어요. 나무를 흔들거나 떨어진 것을 주워 보세요.'));
    body.appendChild(el('p','note','기력 '+Math.round(S.en)+'/'+maxEn()+' · 먹을 수 있는 것은 눌러서 먹으면 기력이 차요.'));

function openShop(tab){

    for(const [k,l] of [['buy','사기'],['wear','옷'],['stock','가축'],['sell','팔기']]){const b=el('button','btn'+(k===tab?' on':''),l);b.type='button';b.onclick=()=>{$('mBody').scrollTop=0;openShop(k)};tabs.appendChild(b)}
    body.appendChild(tabs);
    body.appendChild(el('p','note','가진 돈 '+won(S.coins)+(perk('eunha')?' · 단골 우대로 10% 더 쳐 줘요':'')));
    if(tab==='buy'){
      for(const k of Object.keys(ITEMS).filter(k=>ITEMS[k].buy).sort((a,b)=>ITEMS[a].lv-ITEMS[b].lv)){
        const it=ITEMS[k],lock=S.level<it.lv;
        row(body,icon('item',k),it.n,lock?'레벨 '+it.lv+'부터 살 수 있어요':seasonNames(CROPS[it.seed].s)+'에 심어요 · '+CROPS[it.seed].days+'일 뒤 수확 · '+ITEMS[it.seed].p+'냥에 팔려요 · 가진 것 '+have(k)+'개',[[it.buy+'냥',()=>buy(it.buy,()=>gain(k,1)),lock||S.coins<it.buy]]);
      }
      body.appendChild(el('p','note','오늘의 가구 · 날마다 바뀌어요'));
      for(const k of S.shopFurn){const f=FURN[k];row(body,icon('furn',k),f.n,'아늑함 +'+f.c+' · 보관 '+(S.furn[k]||0)+'개',[[f.buy+'냥',()=>buy(f.buy,()=>{S.furn[k]=(S.furn[k]||0)+1}),S.coins<f.buy]])}

      }

      body.appendChild(el('p','note','닭장과 외양간은 목수 모루가 지어 줘요. 날마다 먹이를 주고 쓰다듬어 주면 잘 따라요.'));
      row(body,icon('item','feed'),'먹이','닭·소 한 마리가 하루에 하나씩 먹어요 · 가진 것 '+have('feed')+'개',
        [[FEED_PRICE+'냥',()=>buyFeed(1),S.coins<FEED_PRICE],['10개 '+FEED_PRICE*10+'냥',()=>buyFeed(10),S.coins<FEED_PRICE*10]]);
      for(const k in STOCK){
        const d=STOCK[k],pn=PENS[d.pen],pen=S.pens[d.pen],n=S.stock.filter(a=>a.k===k).length,ready=pen&&pen.done;
        const sub=!ready?jo(pn.n,'을','를')+' 먼저 지어야 해요 (목수 모루)':n>=pn.cap?jo(pn.n,'이','가')+' 꽉 찼어요 ('+n+'/'+pn.cap+')':n+'/'+pn.cap+'마리 · '+d.grow+'일 뒤 다 자라요 · '+(k==='hen'?'날마다 달걀을 낳아요':'젖을 짜고 밭 갈기를 도와요');
        row(body,icon('stock',k+'!'),d.baby,sub,[[d.buy+'냥',()=>buyStock(k),!ready||n>=pn.cap||S.coins<d.buy]]);
      }
    }else{

    }
  });
}

// 이 마을을 글자 코드로 내보내고(packSave), 다른 기기나 브라우저에서 그 코드를 가져온다(unpackSave → applySave). 코드는 저장 내용을 눌러 담은 것(DV1.)이거나 그대로(DV0.)다.
// 바깥으로 보내는 것은 없다: 사용자가 코드를 직접 복사해 옮긴다. 가져오면 이 기기의 마을이 바뀌므로, 바꾸기 전 것을 BACKUP_KEY에 한 벌 남겨 한 번은 되돌릴 수 있다.

const BACKUP_KEY='doran-village-save-backup';let moving=false;

const unb64=t=>{const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};

async function packSave(){
  saveLocal();const raw=new TextEncoder().encode(JSON.stringify(S));

}
async function unpackSave(code){
  const m=/^DV([01])\.([A-Za-z0-9+/=]+)$/.exec(String(code||'').replace(/\s+/g,''));if(!m)throw new Error('form');

// 받은 저장의 모양을 살핀다: 이 게임의 저장이 아니면 버리고, 이 판이 모르는 물건·가구는 덜어 낸다(다른 판에서 내보낸 코드일 수 있다)
function cleanSave(o){

  const keep=(a,T)=>{const r={};if(a&&typeof a==='object'&&!Array.isArray(a))for(const k of Object.keys(a))if(own(T,k)&&typeof a[k]==='number'&&a[k]>0)r[k]=Math.floor(a[k]);return r};
  const furn=a=>Array.isArray(a)?a.filter(f=>f&&typeof f==='object'&&own(FURN,f.id)):[];

  return o;
}

function openMove(){

    body.appendChild(el('p','sub','내보내기'));
    const out=el('textarea'),info=el('p','note',''),mk=el('button','btn pri','코드 만들기');mk.type='button';
    out.readOnly=true;out.hidden=true;out.onfocus=()=>out.select();out.onkeydown=e=>e.stopPropagation();
    out.style.cssText='font:12px/1.4 monospace;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;display:block;margin:8px 0;height:72px;box-sizing:border-box';
    const copy=()=>{const done=()=>toast('코드를 복사했어요. 옮길 기기로 보내 주세요'),fall=()=>{out.focus();out.select();toast('코드를 골라 두었어요. 복사해 주세요')};try{navigator.clipboard.writeText(out.value).then(done,fall)}catch(e){fall()}};
    mk.onclick=async()=>{mk.disabled=true;out.value=await packSave();out.hidden=false;mk.disabled=false;mk.textContent='코드 복사';mk.onclick=copy;
      info.textContent='코드를 만들었어요(글자 '+out.value.length.toLocaleString()+'자). 복사해서 옮길 기기로 보내세요. 메신저의 "나에게 보내기"나 메모 앱을 쓰면 편해요. 그 뒤에 여기서 더 키운 것은 코드에 들어 있지 않아요.'};
    body.appendChild(mk);body.appendChild(out);body.appendChild(info);
    const h=el('p','sub','가져오기');h.style.marginTop='12px';body.appendChild(h);
    moveImport(body,openMove);
    let bk=null;try{bk=localStorage.getItem(BACKUP_KEY)}catch(e){}
    if(bk){let o=null;try{o=cleanSave(JSON.parse(bk))}catch(e){}
      if(o){const h2=el('p','sub','되돌리기');h2.style.marginTop='12px';body.appendChild(h2);body.appendChild(el('p','note','가져오기 전에 있던 마을: '+saveSummary(o)));
        const b=el('button','btn','이 마을로 되돌리기');b.type='button';b.onclick=()=>applySave(o);body.appendChild(b)}}
  });
}

      (S.lore.qtr||quarterTier())&&'내 처소: 수라간 상궁(숙수)·세자빈(부마)·내금위 군관·정승이 되면 궁궐 큰길 서쪽의 전각이 내 처소가 돼요. 자리가 더 오르면 방이 넓어져요. 집처럼 꾸미기로 가구를 놓을 수 있고(가구는 집과 함께 써요), 이부자리에서 자면 다음 날 처소에서 눈을 떠요. 왕실의 배필은 밤과 아침에 처소에 함께 있어요.',

      '동굴: 사냥터 북동쪽에 동굴 입구가 있어요. 바위 앞에서 행동하면 깨고, 알갱이가 박힌 광맥은 고리를 맞춰 캐요. 내려가는 사다리는 어느 바위 밑에 숨어 있어요. 깊을수록 쇳돌 → 은덩이 → 옥돌 → 금덩이가 나와요(스무 층까지). 다섯 층마다 다음에 바로 갈 수 있는 길이 열리고, 바위는 하루가 지나면 다시 차요. 기력이 많이 드니 음식을 챙겨 가요.',
      '명절: 계절마다 하루씩 잔치가 열려요. 설날(봄 1일)은 윷놀이, 단오(여름 4일)는 그네, 추석(가을 4일)은 햇과일 받기, 동지(겨울 4일)는 새알심 건지기예요. 그날 만물상 동쪽 마당의 잔치 장대 앞에서 행동하면 돼요. 이기면 200냥과 명절 음식을 받고 마을 이웃 모두와 가까워져요. 상은 하루에 한 번이에요.',
      '아궁이: 모루에게 "짓기·고치기"에서 아궁이를 부탁해 집 안에 놓으면, 그 앞에서 행동해 집에서도 음식을 지을 수 있어요. 군밤·삶은 달걀·달걀찜·생선구이·된장찌개는 누구나 지어요.',
      '장독대: 모루에게 장독대를 부탁해 내 땅에 놓아요. 독에 재료를 담글 때 행동으로 소금을 한 줌씩 넣어 초록 띠에 맞추고 손을 떼요. 며칠 뒤 다 익으면 꺼내요. 간이 딱 맞으면 두 개가 나와요. 된장은 콩으로 담가요(콩 씨앗은 만물상, 여름·가을).',
      S.mil&&'무예 수련: 날마다 무진에게서 활쏘기를 해요. 행동 한 번에 좌우, 또 한 번에 높이를 정해 과녁 한가운데를 맞혀요. 더 높은 자리로 가는 길은 무진에게 물어봐요.',
      S.civ&&'글공부: 날마다 훈장에게서 같은 글자끼리 짝을 지어요. 글자를 누르거나 방향키로 옮겨 행동으로 뒤집어요. 더 높은 자리로 가는 길은 훈장에게 물어봐요.',
      S.merch&&'장사 일: 날마다 은하와 안목 겨루기(두 물건 가운데 더 비싼 쪽을 왼쪽·오른쪽 방향키나 눌러서 고르기)를 하고, 주문받은 물건을 모아 납품하면 가게 값보다 후하게 받아요. 더 높은 자리로 가는 길은 은하에게 물어봐요.',
      '밭일은 서 있는 칸부터: 내 땅의 빈 풀밭에 서서 행동하면 그 칸을 갈고, 밭 위에 서서 행동하면 그 밭에 심고 물 주고 거둬요. 서 있는 칸에 할 일이 없으면 바라보는 칸에 해요. 흰 테두리가 행동이 걸릴 칸이고, 행동 버튼에 무엇을 할지 적혀 있어요. 서 있는 풀밭 칸을 눌러도 갈려요.',
      S.court&&'궁중 예법: 날마다 중전이 보여 주는 동작의 차례를 방향키나 화면의 화살표로 따라 해요. 더 높은 자리로 가는 길은 중전에게 물어봐요.',
      S.job&&'수라간: 수라간 문 앞에서 음식을 짓고(행동으로 부채질해 바늘을 초록 띠 안에 두기), 연 상궁에게 수라상을 올리면 하사금을 받아요. 더 높은 자리로 가는 길은 연 상궁에게 물어봐요.',
      '대장간: 모루네 집 옆 화덕 앞에서 행동하거나 모루에게 말을 걸어 연장을 벼려요. 쇳덩이가 초록 칸에 닿는 박자에 맞춰 두드려요. 쇳돌은 바위를 잘 맞혀 캐면 섞여 나와요.',
      '가축: 모루에게 닭장·외양간을 부탁하고, 내 땅에서 자리를 골라 못질로 마무리해요. 은하 만물상의 가축 칸에서 병아리·송아지와 먹이를 사요. 우리 앞에서 행동하면 먹이를 주고, 가축을 바라보고 행동하면 쓰다듬어요. 닭은 달걀을 낳고, 소는 젖을 짜고 밭 갈기를 도와요.',
      '기력: 밭 갈기·나무 베기·낚시 같은 일을 하면 줄어요. 가방에서 음식을 먹거나 이부자리에서 자면 다시 차요.','이웃: 하루에 한 번 인사와 선물로 ♥가 올라요. 머리 위 물음표는 부탁이 있다는 뜻이에요. ♥2에 선물, ♥3에 혜택을 받아요.',
      '방 고치기: 집 안에서 꾸미기를 누르면 바닥을 한 칸씩 넓히거나 떼서 방 모양을 마음대로 만들고, 벽지와 바닥 무늬도 바꿀 수 있어요. 집을 키우면 쓸 수 있는 칸이 늘어요.',
      '집: 목수 모루에게 집 고치기를 맡기면 다음 날 완성돼요. 집 안에서 꾸미기로 가구를 놓고, 이부자리에서 자면 다음 날이 돼요.','모은 물건은 은하 잡화점에서 팔아요. 진행은 자동으로 저장돼요.',
      '소식: 판이 바뀌면 달라진 점을 적은 창이 들어올 때 한 번 떠요. 아래 "설정"의 "소식"에서 지난 소식까지 다시 볼 수 있어요.'])if(t)ul.appendChild(el('li',null,t));
    body.appendChild(ul);
  });
}

function renderDeco(){
  const box=$('decoList');box.textContent='';const ids=Object.keys(S.furn).filter(k=>S.furn[k]>0);
  if(decoSel&&decoSel!=='+floor'&&decoSel!=='-floor'&&!ids.includes(decoSel))decoSel=null;
  // 방 고치기 도구: 바닥을 한 칸씩 넓히거나 떼고, 벽지와 바닥 무늬를 바꾼다
  const mk=(id,label)=>{const b=el('button','btn'+(decoSel===id?' on':''),label);b.type='button';b.onclick=()=>{decoSel=decoSel===id?null:id;renderDeco()};box.appendChild(b)};
  mk('+floor','바닥 넓히기 · 남은 '+(roomBudget()-roomSet().size)+'칸');mk('-floor','바닥 떼기');
  const cyc=(label,key,n)=>{const b=el('button','btn',label);b.type='button';b.onclick=()=>{S[key]=((S[key]||0)+1)%n;touch();sfx('pick')};box.appendChild(b)};
  cyc('벽지 바꾸기','wallS',WALLS.length);cyc('바닥 무늬 바꾸기','floorS',FLOORS.length);
  if(!S.inQ){const b=el('button','btn','세트 '+setsDone().length+'/'+Object.keys(SETS).length);b.type='button';b.onclick=openSets;box.appendChild(b)}
  /* 두 칸짜리를 골랐을 때만: 가로로 놓을지 세로로 놓을지 */
  if(decoSel&&furnTurns(decoSel)){const b=el('button','btn'+(decoRot?' on':''),decoRot?'세로로 놓는 중 (누르면 가로)':'가로로 놓는 중 (누르면 세로)');b.type='button';b.onclick=()=>{decoRot=!decoRot;sfx('pick');renderDeco()};box.appendChild(b)}
  $('decoHint').textContent=(ids.length?'가구를 고르고 바닥을 누르면 놓여요. 겹쳐 놓을 수도 있어요: [깔개]는 가구 밑에, [올림]은 [받침] 가구 위에, [매달기]는 가구 위 천장에, [벽걸이]는 벽 바로 아래 칸을 눌러 벽에. [2칸]·[4칸]은 누른 칸부터 오른쪽(과 아래)으로 그만큼 차지하고, [2칸]은 고르면 나오는 단추로 세로로 돌려 놓을 수 있어요. 놓인 것을 누르면 맨 위부터 다시 넣어요.':'보관 중인 가구가 없어요. 잡화점에서 사거나, 모루와 함께 짜거나, 이웃과 친해지면 받을 수 있어요.')+' · 아늑함 '+comfort();
  for(const k of ids){const b=el('button','btn'+(k===decoSel?' on':''));b.type='button';b.appendChild(icon('furn',k));b.appendChild(el('span',null,FURN[k].n+(FURN[k].size?' ['+FURN[k].size[0]*FURN[k].size[1]+'칸]':'')+(FURN[k].wall?' [벽걸이]':FURN[k].walk?' [깔개]':FURN[k].hang?' [매달기]':FURN[k].surf?' [받침]':FURN[k].top?' [올림]':'')+' ×'+S.furn[k]));b.onclick=()=>{decoSel=decoSel===k?null:k;renderDeco()};box.appendChild(b)}
}
function setDeco(on){
  decoMode=!!on&&scene==='home';$('deco').hidden=!decoMode;$('bDeco').classList.toggle('on',decoMode);$('bDeco').textContent=decoMode?'꾸미기 끝':'꾸미기';
  if(decoMode){P.path=[];P.after=null;renderDeco()}else decoSel=null;
  placeFam(); // 방을 고치는 동안에는 배필과 아이들이 자리를 비켜 준다
}
function freezeRoom(){if(!S.room){S.entry=roomEntry();S.room=[...roomSet()]}}
function decoClick(x,y){
  const set=roomSet(),e=roomEntry(),k=x+','+y,inRoom=set.has(k),dxr=e[0],rh=e[1]+1;
  if(decoSel==='+floor'){
    if(inRoom)return;
    if(x<0||y<0||x>=GRID_W||y>=GRID_H||(x===e[0]&&y===e[1]+1)){toast('여기까지는 넓힐 수 없어요');return}
    if(set.size>=roomBudget()){toast('지금 집으로는 더 넓힐 수 없어요. 집을 키우면 칸이 늘어요');sfx('err');return}
    if(!DIRS.some(([dx,dy])=>set.has((x+dx)+','+(y+dy)))){toast('지금 방에 붙은 자리만 넓힐 수 있어요');return}
    if(S.placed.some(f=>f.x===x&&f.y===y+1&&furnSlot(f)==='w')){toast('바로 아래 벽에 걸린 것이 있어요. 먼저 거둬요');sfx('err');return}
    freezeRoom();S.room=S.room.concat(k);sfx('chop');touch();renderDeco();return;
  }
  if(decoSel==='-floor'){
    if(!inRoom)return;
    if((x===0&&y<2)||(x===e[0]&&y===e[1])||(x===P.x&&y===P.y)||furnAt(x,y)){toast('이 칸은 뗄 수 없어요');sfx('err');return}
    freezeRoom();const old=S.room;S.room=old.filter(q=>q!==k);
    // 떼고 나서도 모든 칸이 문에서 이어져 있어야 한다
    const now2=roomSet(),seen=new Set([e.join()]),q=[e];
    while(q.length){const [a,b]=q.pop();for(const [dx,dy] of DIRS){const n=(a+dx)+','+(b+dy);if(now2.has(n)&&!seen.has(n)){seen.add(n);q.push([a+dx,b+dy])}}}
    if(seen.size!==S.room.length){S.room=old;toast('방이 둘로 나뉘어서 뗄 수 없어요');sfx('err');return}
    sfx('chop');touch();renderDeco();return;

// 행동 단추의 글자: 지금 누르면 무엇을 하는지 보여 준다. 할 것이 없으면 "행동"이라 쓰인 채 흐려진다
const ACT_TXT={npc:'말 걸기',rock:'캐기',beast:'사냥',peer:'인사',hboard:'사냥 방',sgate:'작은 문',spring:'약수',yard:'살피기',cave:'들어\n가기',crock:'깨기',ladder:'사다리',deco:'살피기',board:'알림판',soil:'밭일',till:'밭 갈기',stock:'돌보기',kid:'돌보기',
  pen:'우리',forge:'대장간',stall:'장터',fest:'잔치',shoal:'낚시',bed:'잠자기'};
function actLabel(){
  if(mg)return mg.kind==='hunt'?(mg.mel?'받아\n치기':'쏘기'):mg.kind==='forge'||mg.kind==='build'?'두드\n리기':mg.kind==='kindle'?'연타!':mg.kind==='pee'?'쉬…':mg.kind==='plane'?'밀기':mg.kind==='pour'?'따르기':mg.kind==='pound'?'치기':mg.kind==='haul'?'당기기':mg.kind==='jegi'?'차기':mg.kind==='tuho'?'던지기':mg.kind==='rope'?'버티기':mg.kind==='dance'?'얼쑤!':mg.kind==='ssi'?(mg.ph?'버티기':'밀기!'):mg.kind==='boat'?'노 젓기':mg.kind==='drill'?'치기':'지금!';
  if(fishing)return fishing.phase==='bite'?'채기':fishing.phase==='reel'?(fishing.thr===2?'멈춰!':'당기기'):'기다림';
  if(P.t<1)return null; /* 걷는 동안에는 바꾸지 않는다 */
  if(garden&&scene==='town')return yardAt(P.x+P.dir[0],P.y+P.dir[1])?'거두기':yardOK(P.x+P.dir[0],P.y+P.dir[1])?'놓기':'';
  if(glintHere()>=0)return '파기';
  const f=faceTarget();if(!f)return nearNpc()?'말 걸기':nearBeast()?'사냥':'';
  const tg=f.tg;
  if(tg.t==='beast'&&Math.abs(tg.b.x-P.x)+Math.abs(tg.b.y-P.y)<=meleeReach())return '맞붙기';
  if(tg.t==='tree')return tg.k==='pine'?'베기':'흔들기';
  if(tg.t==='drill')return tg.k==='target'?'활쏘기':tg.k==='dummy'?'수련':'살피기';
  if(tg.t==='water')return scene==='palace'?'':scene==='resort'?'뱃놀이':S.kit>0&&!tg.sea&&bridgeSpan()?'다리\n놓기':'낚시';
  if(tg.t==='bld')return tg.b.id==='home'?(S.camp?'눕기':'들어\n가기'):tg.b.id==='shop'?'가게':tg.b.pal?(tg.b.id==='hall'?'진상':tg.b.id==='kitchen'?'수라간':tg.b.id==='pav'?'쉬기':tg.b.id==='jail'?'옥사':tg.b.id==='mine'&&quarterTier()?'들어\n가기':'살피기'):'똑똑';
  if(tg.t==='work')return workDone(tg.k)?(tg.k==='boat'?'배 타기':'쓰기'):'짓기';
  if(tg.t==='furn')return tg.f.id==='agungi'?'요리':furnUses().length?'쓰기':PARTY_AT[tg.f.id]&&!S.inQ?'집들이':'살피기';
  if(tg.t==='soil'){const p=S.farm[tg.x+','+tg.y];if(p)return !p.c?'심기':p.g>=CROPS[p.c].days?'거두기':soilTodo(tg.x,tg.y)?'물 주기':'살피기'}
  return ACT_TXT[tg.t]||'행동';
}
let actT=0,actLast=null;
function updAct(dt){
  actT-=dt;if(actT>0)return;actT=mg||fishing?0:.12; /* 놀이 중에는 곧바로 따라간다 */
  {const u=undoWhat(),b=$('undoBtn');if(b.hidden===!!u)b.hidden=!u;if(u&&b.textContent!==u.txt)b.textContent=u.txt} /* 밭 되돌리기 단추 */
  const t=busy()?'':actLabel();if(t===null||t===actLast)return;
  actLast=t;const b=$('actBtn');b.textContent=t||'행동';b.classList.toggle('idle',!t);
}
// 잘못 눌린 터치 거르기. guardUntil: 놀이·낚시가 막 시작됐거나 막 끝난 직후에는 잠깐 입력을 받지 않는다(연달아 눌린 터치가 첫 박자를 헛치거나 엉뚱한 곳으로 걸어가지 않게).
// cvPtr: 화면에 손가락 하나가 닿아 있는 동안 다른 손가락은 받지 않는다. lastTap: 같은 자리를 0.2초 안에 또 누른 것은 한 번으로 친다
let guardUntil=0,wasPlay=false,cvPtr=null,cvPtrAt=0,lastTap={t:0,x:0,y:0};
const cvUp=e=>{if(e.pointerId===cvPtr)cvPtr=null};
cv.addEventListener('pointerup',cvUp);cv.addEventListener('pointercancel',cvUp);cv.addEventListener('pointerleave',cvUp);
cv.addEventListener('pointerdown',e=>{
  const t=performance.now();
  if(cvPtr!==null&&e.pointerId!==cvPtr&&t-cvPtrAt<1500)return;
  cvPtr=e.pointerId;cvPtrAt=t;
  if(busy()||t<guardUntil)return;
  if(!mg&&!fishing){if(t-lastTap.t<200&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<24)return;lastTap={t,x:e.clientX,y:e.clientY}}
  const r=cv.getBoundingClientRect(),wx=(e.clientX-r.left)/zoom+cam.x,wy=(e.clientY-r.top)/zoom+cam.y;
  if(decoMode){decoClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(relo&&scene==='town'){moveClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(placing&&scene==='town'){placeClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(garden&&scene==='town'&&!mg&&!fishing){gardenClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(mg&&mg.kind==='rite'){riteClick(wx,wy);return}
  if(mg&&mg.kind==='eye'){eyeClick(wx,wy);return}
  if(mg&&mg.kind==='study'){studyClick(wx,wy);return}
  if(mg&&mg.kind==='catch'){catchClick(wx,wy);return}
  if(mg&&mg.kind==='scoop'){scoopClick(wx,wy);return}
  if((civ())&&npcOut())for(const id of NPC_IDS){
    if(!npcHere(id))continue;
    const n=N[id],cx=(rx(n)+.5)*T,fy=(ry(n)+.9)*T;
    if(Math.abs(wx-cx)<13&&wy<fy+4&&wy>fy-46){clickTile(n.x,n.y);return}
  }
  clickTile(Math.floor(wx/T),Math.floor(wy/T),wy/T-Math.floor(wy/T)>.35);
});
$('dlgText').addEventListener('click',skipType);
$('actBtn').onclick=()=>{interact();cv.focus({preventScroll:true})};
// 행동을 누르고 있는가 (대패질처럼 누르고 있어야 하는 놀이가 본다). 1 글쇠, 2 행동 단추. 화면을 누르고 있는 것은 cvPtr로 안다
let actHold=0;
const holding=()=>!!actHold||cvPtr!==null,isGo=e=>e.code==='Space'||e.code==='KeyE'||e.code==='Enter';
window.addEventListener('keydown',e=>{if(isGo(e)&&!(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')))actHold|=1});
window.addEventListener('keyup',e=>{if(isGo(e))actHold&=~1});
window.addEventListener('blur',()=>{actHold=0});
{const ab=$('actBtn'),up=()=>{actHold&=~2};ab.addEventListener('pointerdown',()=>{actHold|=2});for(const ev of ['pointerup','pointercancel','pointerleave'])ab.addEventListener(ev,up)}
$('undoBtn').onclick=()=>{undoTill();cv.focus({preventScroll:true})};
const tool=(id,fn)=>{$(id).onclick=()=>{if(!started||sleeping)return;if(!$('dlg').hidden)closeDlg();fn()}};
tool('bBag',openBag);tool('bSay',openSay);tool('bMe',()=>openGroup('me'));tool('bLog',()=>openGroup('log'));tool('bSet',()=>openGroup('set'));tool('bAsk',()=>openAsk());
tool('bDeco',()=>{setDeco(!decoMode);cv.focus({preventScroll:true})});
tool('bYard',()=>{if(garden){garden=null;syncPlace()}else if(!busy()&&scene==='town')openYard();cv.focus({preventScroll:true})});
tool('bGate',()=>{gateHome();cv.focus({preventScroll:true})});
tool('bBomb',()=>{bombPlace();cv.focus({preventScroll:true})});
tool('bPlace',()=>{if(relo){relo=null;syncPlace();toast('옮기기를 그만뒀어요');cv.focus({preventScroll:true});return}if(placing)stopPlacing();else{placing=true;syncPlace();toast('집 둘레 내 땅(밝게 표시된 풀밭)에서 지을 자리를 눌러요')}cv.focus({preventScroll:true})});
$('mClose').onclick=closeModal;
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&started){keys.length=0;saveLocal();if(cloudDirty)pushCloud()}});

// ───────── 돌리기 ─────────
let last=0,lastTen=-1,saveT=0,cloudT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000||0));last=ts;now+=dt;
  bgmTick();
  if(started&&S){
    if(!busy()){updTime(dt);updPlayer(dt);updNpcs(dt);updBeasts(dt);updCop(dt);updHerd(dt);updKids(dt);updFishing(dt);updMg(dt)}
    else if(P.t<1){P.t=Math.min(1,P.t+dt*WALK);if(P.t>=1){P.fx=P.x;P.fy=P.y}}
    for(const o of TREES)if(o.sh>0)o.sh-=dt;
    for(const o of ROCKS)if(o.sh>0)o.sh-=dt;
    {const pl=!!(mg||fishing);if(pl!==wasPlay){wasPlay=pl;guardUntil=performance.now()+(pl?450:500)}}
    updMini(dt);updAct(dt);
    updPlay(dt);syncPresence();for(const k in PV){const v=PV[k];if(v.t<1)v.t=Math.min(1,v.t+dt*WALK)}
    if(floats.length){for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.3);if(hurtT>0)hurtT=Math.max(0,hurtT-dt)}
    const ten=Math.floor(S.min/10);if(ten!==lastTen){lastTen=ten;hud()}
    saveT+=dt;if(saveT>8){saveT=0;if(dirty)saveLocal()}
    cloudT+=dt;if(cloudT>90){cloudT=0;if(cloudDirty){saveLocal();pushCloud()}}
  }
  render();
}
function start(hot){
  buildGround();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));else window.addEventListener('resize',resize);
  requestAnimationFrame(frame);
  if(hot&&hot.S){begin(hot.S);return}
  S=newState('',COLORS[0]);S.min=600; // 시작 화면 뒤에 비치는 마을 풍경용. 시작하면 실제 상태로 바뀐다
  const local=loadLocal();let shown=false;
  const show=()=>{if(shown)return;shown=true;let best=local;if(cloudSaved&&(!best||(cloudSaved.ts||0)>(best.ts||0)))best=cloudSaved;showTitle(best)};
  if(window.claude&&window.claude.use){initCloud().then(show,show);setTimeout(show,3500)}else show();
}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({S:started?S:null}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
