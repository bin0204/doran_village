<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>도란도란 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 위 HUD 띠, 가운데 마을 캔버스, 아래 도구 막대. 창은 캔버스 위에 뜬다. */
:root{
  --bg:#e6efd8; --surface:#fbfdf5; --ink:#243524; --muted:#5d7260; --line:#c6d6b4;
  --accent:#dd6a1c; --accent-ink:#fffaf2; --leaf:#3a8749; --water:#2b7fb5; --heart:#d94a74;
  --shade:rgba(24,44,24,.5);
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131c17; --surface:#1d2a23; --ink:#e3eedc; --muted:#9bb29b; --line:#33483a;
  --accent:#f08b3d; --accent-ink:#1c1208; --leaf:#72c480; --water:#70bbe8; --heart:#f47f9f;
  --shade:rgba(0,0,0,.62); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131c17; --surface:#1d2a23; --ink:#e3eedc; --muted:#9bb29b; --line:#33483a;
  --accent:#f08b3d; --accent-ink:#1c1208; --leaf:#72c480; --water:#70bbe8; --heart:#f47f9f;
  --shade:rgba(0,0,0,.62); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;overflow-x:hidden}
*{box-sizing:border-box}
#app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.brand{font-family:var(--display);font-size:22px;color:var(--leaf);letter-spacing:.02em;margin-right:auto}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:2px 11px;white-space:nowrap}
.chip.coin{color:var(--accent)}
.lv{display:flex;align-items:center;gap:6px}
.bar{display:block;width:74px;height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:9px;transition:width .3s}
.bar.en i{background:var(--accent)}
#stage{position:relative;flex:1;min-height:320px;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#16261c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#cv:focus{outline:none}
#cv:focus-visible{outline:3px solid var(--water);outline-offset:-3px}
#fade{position:absolute;inset:0;background:#0b1410;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
#toasts{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:5px 14px;
  font-family:var(--display);font-size:15px;max-width:100%;animation:pop .25s ease-out;box-shadow:0 3px 0 var(--shade)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#actBtn{position:absolute;right:12px;bottom:12px;width:66px;height:66px;border-radius:50%;border:3px solid var(--accent-ink);
  background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--shade)}
#actBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
#dlg{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;
  padding:12px 14px;box-shadow:0 4px 0 var(--shade);display:flex;flex-direction:column;gap:8px}
#dlgWho{font-family:var(--display);font-size:17px;color:var(--accent);display:flex;align-items:center;gap:8px}
#dlgWho small{font-family:var(--body);font-size:12px;color:var(--muted)}
#dlgText{min-height:3em;font-size:16px;white-space:pre-wrap;cursor:pointer}
#dlgChoices{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.btn{font-family:var(--display);font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;padding:6px 13px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--leaf)}
.btn:focus-visible,#actBtn:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--leaf);color:var(--surface);border-color:var(--leaf)}
.btn:disabled{opacity:.45;cursor:default}
#bar{display:flex;flex-wrap:wrap;gap:6px}
#bar .sp{margin-left:auto}
#deco{background:var(--surface);border:2px solid var(--line);border-radius:16px;
  padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:30%;overflow:auto;flex:none}
#deco p{margin:0;font-size:13px;color:var(--muted)}
#decoList{display:flex;flex-wrap:wrap;gap:6px}
#decoList .btn{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 4px}
#modal{position:absolute;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.sheet{background:var(--surface);border:2px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1.5px solid var(--line)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;margin-right:auto;color:var(--leaf)}
#mBody{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cell{border:1.5px solid var(--line);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:13px;text-align:center;background:transparent;color:var(--ink);font-family:var(--body);min-width:0}
button.cell{cursor:pointer}
button.cell:hover{border-color:var(--leaf)}
.cell b{font-family:var(--display);font-weight:400;font-size:14px}
.cell small{color:var(--muted)}
.cell.unk img{filter:brightness(0);opacity:.28}
.sub{font-family:var(--display);font-size:16px;margin:4px 0 0;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0}
.row .grow{flex:1;min-width:0}
.row b{font-family:var(--display);font-weight:400;font-size:16px}
.row small{display:block;color:var(--muted);font-size:13px}
.row .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.hearts{color:var(--heart);letter-spacing:1px;font-size:15px}
.hearts i{color:var(--line);font-style:normal}
.note{color:var(--muted);font-size:13px;margin:0}
.ic{width:36px;height:36px;flex:none;image-rendering:pixelated}
.ic.big{width:48px;height:48px}
.badge{width:36px;height:36px;flex:none;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);color:var(--leaf);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px}
#title{position:absolute;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:14px;z-index:6}
#title .sheet{padding:20px 20px 16px;gap:12px;overflow:auto}
#title h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--leaf);text-wrap:balance}
#title p{margin:0}
#titleBody{display:flex;flex-direction:column;gap:12px}
#title label{font-family:var(--display);font-size:15px;display:flex;flex-direction:column;gap:4px}
#title input[type=text]{font:inherit;font-family:var(--body);padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.swatches{display:flex;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
kbd{font-family:var(--display);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px}
ul.help{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
@media (max-width:520px){ .brand{font-size:19px} .stats{font-size:13px} .bar{width:48px} #dlgText{font-size:15px} .btn{padding:6px 10px} }
@media (prefers-reduced-motion:reduce){ .toast{animation:none} #fade{transition:none} }
</style>
</head>
<body>

<div id="app">
  <header id="hud">
    <div class="brand">도란도란 마을</div>

      <span class="chip" id="hPeers" hidden>함께 2명</span>

        <div id="mBody"></div>

        <div id="titleBody"></div>

  <nav id="bar" aria-label="도구">

    <button class="btn" id="bJob" type="button">신분</button>
    <button class="btn" id="bFriends" type="button">이웃</button>
    <button class="btn" id="bQuests" type="button">부탁</button>
    <button class="btn" id="bDex" type="button">도감</button>
    <button class="btn" id="bWear" type="button">옷장</button>
    <button class="btn" id="bSay" type="button">같이 하기</button>
    <button class="btn" id="bDeco" type="button" hidden>꾸미기</button>
    <button class="btn" id="bPlace" type="button" hidden>우리 놓기</button>
    <button class="btn sp" id="bSave" type="button">저장</button>
    <button class="btn" id="bSound" type="button">소리 켬</button>
    <button class="btn" id="bHelp" type="button">도움말</button>
  </nav>
</div>

  if((k==='grace'&&perk('queen'))||(k==='lore'&&perk('princess')))n*=2;
  S.stx[k]+=n;
  while(S.stx[k]>=10&&S.stats[k]<STAT_MAX){S.stx[k]-=10;S.stats[k]++;toast(jo(STATS[k].n,'이','가')+' 올랐어요 → '+S.stats[k]);sfx('heart')}
  touch();
}
// 왕실의 자리 이름: 처음에는 모습에 따라 궁녀·별감, 간택 뒤에는 배필이 세자냐 공주냐에 따라 정해진다
const courtTitle=()=>{const C=S.court;return C.rank===0?(S.sex==='f'?'궁녀':'별감'):C.mate==='princess'?(C.rank===1?'부마':'국서'):(C.rank===1?'세자빈':'왕비')};
// 내세우는 호칭: 간택된 뒤에는 왕실의 자리, 아니면 수라간의 자리, 그도 아니면 마을에서의 이름
// 길마다의 자리 이름. 내세울 호칭은 신분 창에서 고르고, 고르지 않았으면 왕실(간택 뒤) → 수라간 → 상인 → 궁녀·별감 → 마을 이름 순서로 정한다
const trackTitle=k=>k==='court'?(S.court?courtTitle():null):k==='cook'?(S.job?JOBS.cook.ranks[S.sex==='f'?'f':'m'][S.job.rank]:null):k==='merch'?(S.merch?TRADE.ranks[S.merch.rank]:null):null;
const rankName=()=>trackTitle(S.title)||(S.court&&S.court.rank>=1?courtTitle():null)||trackTitle('cook')||trackTitle('merch')||trackTitle('court')||TITLES[Math.min(S.level,TITLES.length)-1];
// 파는 값: 은하와 친하면 10%, 수완 1마다 2%, 상인의 자리가 오를 때마다 5% 더 받는다
const sellPrice=id=>Math.ceil(ITEMS[id].p*(perk('eunha')?1.1:1)*(1+sv('trade')*.02)*(1+(S.merch?S.merch.rank*.05:0)));
const comfort=()=>S.placed.reduce((a,f)=>a+FURN[f.id].c,0);
// 기력: 일을 하면 줄고, 음식을 먹거나 자면 찬다
const maxEn=()=>Math.min(200,Math.min(160,100+(S.level-1)*6)+sv('arms')*2);

  if(S.en<n){toast('기력이 모자라요. 가방에서 음식을 먹거나 침대에서 자요');sfx('err');return false}

}

function addXp(n){
  S.xp+=Math.round(n*(1+sv('lore')*.03));
  while(S.xp>=needXp(S.level)){
    S.xp-=needXp(S.level);S.level++;sfx('level');
    const pts=2+(perk('prince')?1:0);S.sp+=pts;
    toast('레벨 '+S.level+'! 스탯 점수 +'+pts+' · 아래 "신분"에서 올려요');
    const seed=Object.keys(ITEMS).find(k=>ITEMS[k].lv===S.level);
    if(seed)toast('잡화점에 '+jo(ITEMS[seed].n,'이','가')+' 들어왔어요');
  }
  touch();hud();
}
function addCoins(n){S.coins+=n;touch();hud()}
function addFriend(id,n){
  if(n>0)n=Math.round(n*(1+sv('grace')*.04));

  if(hearts(id)>b)toast(jo(NPCS[id].name,'과','와')+' 한층 가까워졌어요 ♥'+hearts(id));
  touch();
}

  bite:[[1040,.07],[1040,.07]],talk:[[520,.05],[620,.05]],level:[[523,.09],[659,.09],[784,.09],[1047,.18]],err:[[200,.12]],heart:[[784,.08],[1175,.14]]};
function sfx(k){
  if(!S||!S.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    let t=actx.currentTime;
    for(const [f,d] of SFX[k]||[[440,.08]]){const o=actx.createOscillator(),g=actx.createGain();o.type=k==='chop'?'square':'triangle';o.frequency.value=f;
      g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d}
  }catch(e){}
}
function toast(msg){
  const box=$('toasts'),t=el('div','toast',msg);box.appendChild(t);
  while(box.children.length>4)box.firstChild.remove();
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),450)},2800);
}
function float(txt,x,y){floats.push({txt:jz(txt),x:x!=null?x:(P.x+.5)*T,y:y!=null?y:P.y*T-20,t:0})}
function hud(){
  if(!S)return;
  $('hDay').textContent=SEASONS[season()]+' '+((S.day-1)%7+1)+'일 · '+(S.weather==='rain'?(season()===3?'눈':'비'):'맑음')+(isMarket()?' · 장날':'');
  const m=Math.floor(S.min);$('hTime').textContent=String(Math.floor(m/60)).padStart(2,'0')+':'+String(Math.floor(m%60/10)*10).padStart(2,'0');
  $('hCoin').textContent=S.coins.toLocaleString('ko-KR')+'냥';
  $('hLv').textContent='Lv.'+S.level;$('hXp').style.width=Math.round(S.xp/needXp(S.level)*100)+'%';
  $('hEn').style.width=Math.round(clamp(S.en/maxEn(),0,1)*100)+'%';
}

// ───────── 걷기·길 찾기 ─────────
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
let sleeping=false;
const busy=()=>!started||sleeping||!$('dlg').hidden||!$('modal').hidden;
const furnAt=(x,y)=>S.placed.find(f=>f.x===x&&f.y===y);
const isDoor=(x,y)=>(scene==='palace'?PBLD:BLD).some(b=>b.door[0]===x&&b.door[1]===y);
// 이웃은 마을에, 왕실 사람들은 궁궐에 있다
const npcHere=id=>(NPCS[id].at||'town')===scene;
function walkable(x,y){
  if(scene!=='home'){if(x<0||y<0||x>=W||y>=H)return false;const t=tile[y][x];return(t<=2||t===5||t===7)&&!objAt[y][x]}
  const e=roomEntry();
  if(x===e[0]&&y===e[1]+1)return true;
  if(!roomSet().has(x+','+y))return false;
  if(x===0&&y<2)return false;
  const f=furnAt(x,y);return !f||!!FURN[f.id].walk;
}
function npcOn(x,y){if((scene!=='town'&&scene!=='palace')||!npcOut())return null;for(const id of NPC_IDS){if(!npcHere(id))continue;const n=N[id];if(n.x===x&&n.y===y)return n}return null}
const canStep=(x,y)=>walkable(x,y)&&!npcOn(x,y)&&!beastOn(x,y)&&!herdOn(x,y);
function findPath(sx,sy,goal,avoid){
  const key=(x,y)=>(y+2)*64+x+2,prev=new Map(),q=[[sx,sy]];prev.set(key(sx,sy),null);let hit=null;
  for(let i=0;i<q.length&&i<3000;i++){
    const [x,y]=q[i];if(goal(x,y)){hit=[x,y];break}
    for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=key(nx,ny);if(prev.has(k)||!walkable(nx,ny)||(avoid&&(npcOn(nx,ny)||beastOn(nx,ny)||herdOn(nx,ny))))continue;prev.set(k,[x,y]);q.push([nx,ny])}
  }
  if(!hit)return null;
  const out=[];let cur=hit;while(cur&&!(cur[0]===sx&&cur[1]===sy)){out.push(cur);cur=prev.get(key(cur[0],cur[1]))}
  return out.reverse();
}
function warp(x,y,dir){P.x=P.fx=x;P.y=P.fy=y;P.t=1;P.path=[];P.after=null;if(dir)P.dir=dir}
function stepTo(nx,ny){P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.t=0}
function arrive(){
  if(scene!=='home'){
    let i;while((i=S.pickups.findIndex(p=>p.x===P.x&&p.y===P.y))>=0)grab(i);
    // 지도 끝의 길목을 밟으면 마을과 사냥터를 오간다
    if(scene==='town'&&P.x===W-1&&P.y===11)enterWild();else if(scene==='wild'&&P.x===0)leaveWild();
    else if(scene==='town'&&P.y===0)enterPalace();else if(scene==='palace'&&P.y===H-1)leavePalace();
  }else{const e=roomEntry();if(P.x===e[0]&&P.y===e[1]+1)leaveHome()}
}
function grab(i){const p=S.pickups.splice(i,1)[0],id=p.id==='branch'?'wood':p.id;gain(id,1);addXp(2);float('+1 '+ITEMS[id].n);sfx('pick')}
const keys=[];
const KEYDIR={ArrowUp:[0,-1],KeyW:[0,-1],ArrowRight:[1,0],KeyD:[1,0],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0]};
function updPlayer(dt){
  if(P.t<1){P.t=Math.min(1,P.t+dt*5.6);if(P.t<1)return;P.fx=P.x;P.fy=P.y;arrive();if(busy())return}
  if(fishing||mg)return;
  const d=keys.length?KEYDIR[keys[keys.length-1]]:null;
  if(d){P.path=[];P.after=null;P.dir=d;if(canStep(P.x+d[0],P.y+d[1]))stepTo(P.x+d[0],P.y+d[1]);return}
  if(P.path.length){
    const [nx,ny]=P.path[0];P.dir=[Math.sign(nx-P.x),Math.sign(ny-P.y)];
    if(canStep(nx,ny)){P.path.shift();stepTo(nx,ny);P.wait=0}
    else{
      // 이웃이 길을 막고 있으면 잠깐 기다렸다가 돌아가는 길을 다시 찾는다
      P.wait=(P.wait||0)+dt;
      if(P.wait>.3){const p=P.goal&&findPath(P.x,P.y,P.goal,true);if(p&&p.length){P.path=p;P.wait=0}else if(P.wait>1.6){P.path=[];P.after=null;P.wait=0}}
    }
    return;
  }
  if(P.after){const a=P.after;P.after=null;a()}
}
function updNpcs(dt){
  if((scene!=='town'&&scene!=='palace')||!npcOut())return;
  for(const id of NPC_IDS){
    if(!npcHere(id))continue;
    const n=N[id];
    if(n.emo){n.emo.t-=dt;if(n.emo.t<=0)n.emo=null}
    if(n.t<1){n.t=Math.min(1,n.t+dt*2.4);if(n.t>=1){n.fx=n.x;n.fy=n.y}continue}
    if(n.hold>0){n.hold-=dt;continue}
    n.wait-=dt;if(n.wait>0)continue;n.wait=rnd(1.2,4.5);
    const [dx,dy]=pick(DIRS),nx=n.x+dx,ny=n.y+dy,a=NPCS[id].anchor,rm=NPCS[id].roam||3;
    if(Math.abs(nx-a[0])>rm||Math.abs(ny-a[1])>rm)continue;
    if(!walkable(nx,ny)||npcOn(nx,ny)||beastOn(nx,ny)||herdOn(nx,ny)||(nx===P.x&&ny===P.y)||(scene==='town'&&S.farm[nx+','+ny])||isDoor(nx,ny))continue;
    n.dir=[dx,dy];n.fx=n.x;n.fy=n.y;n.x=nx;n.y=ny;n.t=0;
  }
}

// ───────── 무엇을 누르고 있나 ─────────
const plotCount=()=>HOUSES[S.house-1].plots;
function targetAt(x,y){
  if(scene!=='home'){
    const n=npcOn(x,y);if(n)return{t:'npc',id:n.id};
    const an=herdOn(x,y);if(an)return{t:'stock',a:an};
    const bs=beastOn(x,y);if(bs)return{t:'beast',b:bs};
    const pr=peerAt(x,y);if(pr)return{t:'peer',p:pr};
    if(x<0||y<0||x>=W||y>=H)return null;
    const o=objAt[y][x];if(o)return o;
    const t=tile[y][x];if(t===3||t===4)return{t:'water',sea:t===4};
    if(scene==='town'&&S.farm[x+','+y])return{t:'soil',x,y};
    return null;
  }
  if(x===0&&(y===0||y===1))return{t:'bed'};
  const f=furnAt(x,y);if(f&&!FURN[f.id].walk)return{t:'furn',f};
  return null;
}
function faceTarget(){
  const fx=P.x+P.dir[0],fy=P.y+P.dir[1];let tg=targetAt(fx,fy);
  if(tg&&tg.t==='bld'){const b=tg.b;if(!(P.x===b.door[0]&&P.y===b.door[1]&&P.dir[1]===-1))tg=null}
  // 일직선 앞쪽 네 칸 안에 들짐승이 있으면 물가보다 사냥이 먼저다
  if(!tg||tg.t==='water'){const b=beastInLine();if(b)return{x:b.x,y:b.y,tg:{t:'beast',b}}}
  // 밭 한가운데 남은 빈칸(둘레 세 곳 이상이 밭)에 서 있으면, 옆 밭보다 발밑 빈칸을 먼저 간다
  if(scene==='town'&&(!tg||tg.t==='soil')&&tillable(P.x,P.y)&&soilSides(P.x,P.y)>=3)return{x:P.x,y:P.y,tg:{t:'till',x:P.x,y:P.y}};
  if(tg)return{x:fx,y:fy,tg};
  if(scene==='town'){
    // 바라보는 칸이 내 땅의 빈 풀밭이면 그 칸을 간다. 밭 위에 서 있어도 마찬가지다 (예전에는 발밑 밭이 먼저라, 밭에 둘러싸인 빈칸을 갈 수 없었다)
    if(tillable(fx,fy))return{x:fx,y:fy,tg:{t:'till',x:fx,y:fy}};
    if(S.farm[P.x+','+P.y])return{x:P.x,y:P.y,tg:{t:'soil',x:P.x,y:P.y}};
  }
  return null;
}
// 갈 수 있는 칸: 내 땅의 빈 풀밭이고, 아직 밭이 아니며, 누가 서 있거나 주울 것이 놓여 있지 않다
const tillable=(x,y)=>inFarm(x,y)&&!S.farm[x+','+y]&&!npcOn(x,y)&&!herdOn(x,y)&&!S.pickups.some(p=>p.x===x&&p.y===y);
const soilSides=(x,y)=>DIRS.reduce((a,d)=>a+(S.farm[(x+d[0])+','+(y+d[1])]?1:0),0);
function act(tg,x,y){
  switch(tg.t){
  case 'npc':talk(tg.id);break;
  case 'tree':if(tg.k==='pine')startChop(tg);else startShake(tg);break;
  case 'rock':startMine(tg);break;
  case 'beast':startHunt(tg.b);break;
  case 'peer':peerMenu(tg.p);break;
  case 'deco':toast(tg.k==='rock'?'이끼 낀 큰 바위예요':'깊은 숲의 나무예요. 여기서는 사냥과 약초 찾기에 마음을 써요');break;
  case 'bld':if(tg.b.pal){palAct(tg.b);break}
    if(tg.b.id==='home'){
      if(S.diy)dialog({who:'내 집',text:'내 손으로 짓는 중이에요. ('+S.diy.step+'/3 단계)',choices:[['이어서 짓기',startBuild],['들어가기',()=>enterHome()],['그만',null]]});
      else enterHome();
    }else if(tg.b.id==='shop')openShop('buy');else toast(npcOut()?jo(NPCS[tg.b.id].name,'은','는')+' 밖에 나가 있어요':'쿨쿨… '+jo(NPCS[tg.b.id].name,'은','는')+' 자고 있어요');break;
  case 'board':openQuests();break;
  case 'water':startFishing(x,y,tg.sea);break;
  case 'soil':soilAct(tg.x,tg.y);break;
  case 'till':till(tg.x,tg.y);break;
  case 'stock':stockAct(tg.a);break;
  case 'pen':penAct(tg.k);break;
  case 'forge':openForge();break;
  case 'stall':if(tg.k==='peddler')openPeddler();else openBroker();break;
  case 'bed':askSleep();break;
  case 'furn':toast(FURN[tg.f.id].n+' · 아늑함 +'+FURN[tg.f.id].c);break;
  }
}
function interact(){
  if(busy())return;
  if(mg){mgPress();return}
  if(fishing){reel();return}
  if(P.t<1)return;
  const f=faceTarget();if(f)act(f.tg,f.x,f.y);
}
function setPath(goal,after){
  const p=findPath(P.x,P.y,goal,true)||findPath(P.x,P.y,goal,false);if(!p)return false;
  P.path=p;P.goal=goal;P.after=after;P.wait=0;return true;
}
const walkThen=(x,y,fn)=>setPath((a,b)=>a===x&&b===y,fn);
const approach=(x,y)=>setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1&&!npcOn(a,b),
  ()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)!==1)return;P.dir=[x-P.x,y-P.y];const t2=targetAt(x,y);if(t2)act(t2,x,y)});
function clickTile(x,y,low){
  if(mg){mgPress();return}
  if(fishing){reel();return}
  P.after=null;P.path=[];
  let tg=targetAt(x,y);
  // 지붕이나 나무 윗부분을 눌렀으면 그 건물·나무를 누른 것으로 본다 (주울 것이 놓인 칸은 제외)
  if(!tg&&(scene==='town'||scene==='palace')&&low&&!S.pickups.some(p=>p.x===x&&p.y===y)){const t2=targetAt(x,y+1);if(t2&&(t2.t==='tree'||t2.t==='bld'||t2.t==='pen'||t2.t==='stall')){tg=t2;y++}}
  if(!tg&&scene==='town'&&tillable(x,y)&&soilSides(x,y)>=3){
    // 밭 한가운데 남은 빈칸을 누르면: 그 위나 바로 옆이면 곧바로 갈고, 멀면 옆까지 걸어가서 간다
    const d=Math.abs(x-P.x)+Math.abs(y-P.y),go=()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)===1){P.dir=[x-P.x,y-P.y];till(x,y)}};
    if(d===0)till(x,y);else if(d===1)go();else setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1,go);
    return;
  }
  if(!tg){if(walkable(x,y))walkThen(x,y,null);return}
  if(tg.t==='beast'){huntClick(tg.b);return}
  if(tg.t==='bld'){const b=tg.b;walkThen(b.door[0],b.door[1],()=>{P.dir=[0,-1];act(tg)});return}
  if(tg.t==='soil'){if(Math.abs(x-P.x)+Math.abs(y-P.y)<=1&&(x!==P.x||y!==P.y)){P.dir=[x-P.x,y-P.y];act(tg,x,y)}else walkThen(x,y,()=>act(tg,x,y));return}
  if(tg.t==='npc')N[tg.id].hold=7;
  if(tg.t==='stock')tg.a.hold=7;
  if(approach(x,y))return;
  if(tg.t==='water'){
    // 먼 물을 눌렀으면 가장 가까운 물가로 간다
    let best=null,bd=1e9;
    for(let ty=1;ty<H-1;ty++)for(let tx=1;tx<W-1;tx++){
      if(!walkable(tx,ty))continue;
      for(const [dx,dy] of DIRS){const q=tile[ty+dy][tx+dx];if(q===3||q===4){const d=(tx+dx-x)**2+(ty+dy-y)**2;if(d<bd){bd=d;best=[tx,ty,dx,dy]}}}
    }
    if(best)walkThen(best[0],best[1],()=>{P.dir=[best[2],best[3]];const wx=P.x+best[2],wy=P.y+best[3];startFishing(wx,wy,tile[wy][wx]===4)});
  }
}
// ───────── 채집·농사·낚시 ─────────
// 수집은 종류마다 손맛이 다르다: 소나무=타이밍 막대, 바위=줄어드는 고리, 과일나무=연타로 흔들기
let mg=null,drops=[];
function tip(k,msg){if(S.tips[k])return;S.tips[k]=1;toast(msg);touch()}
function startChop(o){
  if(S.trees[o.i].h>=1){o.sh=.2;toast('오늘은 이미 벤 나무예요. 내일 다시 와요');return}
  if(!useEn(tl('axe')>=2?3:4))return;
  mg={kind:'chop',o,i:0,n:3,pos:0,dir:1,zc:rnd(.3,.7),got:0,cool:0,idle:0,note:''};P.path=[];P.after=null;
}
function startMine(o){
  if(S.rocks[o.i].h>=1){o.sh=.2;toast('오늘은 이미 캔 바위예요. 내일 다시 와요');return}
  if(!useEn(4))return;
  mg={kind:'mine',o,i:0,n:3,r:36,got:0,cool:0,idle:0,note:''};P.path=[];P.after=null;
}
function startShake(o){
  const st=S.trees[o.i];
  if(season()===3){o.sh=.35;toast('겨울에는 열매가 열리지 않아요. 봄을 기다려요');return}
  if(st.d>S.day){o.sh=.35;toast('열매가 아직 안 익었어요. '+(st.d-S.day)+'일 뒤에 다시 와요');return}
  if(!useEn(2))return;
  mg={kind:'shake',o,p:0,t:0,dropped:0,cool:0,note:''};P.path=[];P.after=null;
}
function mgHit(g){
  const m=mg;m.got+=g;m.i++;m.cool=.42;m.idle=0;m.o.sh=.3;m.note=g===2?'완벽!':g===1?'좋아요':'빗나감';
  sfx(g?'chop':'err');if(g===2)sfx('pick');
  if(m.i>=m.n)m.fin=true;
}
function dropFruit(m){
  const o=m.o,opts=[];m.dropped++;
  for(let dy=0;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x=o.x+dx,y=o.y+dy;
    if((dx||dy)&&walkable(x,y)&&!(x===P.x&&y===P.y)&&!S.pickups.some(p=>p.x===x&&p.y===y)&&!drops.some(d=>d.x===x&&d.y===y))opts.push([x,y]);
  }
  if(!opts.length){gain(o.k,1);float('+1 '+ITEMS[o.k].n);return}
  const [x,y]=pick(opts);drops.push({id:o.k,x,y,sx:o.x*T+16+rnd(-9,9),sy:o.y*T-6,t:0});sfx('pick');
}
function mgPress(){
  const m=mg;if(!m)return;
  if(m.kind==='forge'){forgeHit(m);return}
  if(m.kind==='milk'){milkPress(m);return}
  if(m.kind==='cook'){cookPress(m);return}
  if(m.kind==='rite'||m.kind==='eye')return; // 예법 따라 하기와 안목 겨루기는 방향키나 화면을 눌러서 한다
  if(m.kind==='haggle'){hagglePress(m);return}
  if(m.cool>0)return;
  if(m.kind==='hunt'){shoot(m);return}
  if(m.kind==='build'){
    const d=Math.abs(Math.cos(m.ph));m.cool=.35;
    if(d<=.17){m.i++;m.note=d<=.06?'쾅! 완벽':'쾅!';sfx('chop');if(d<=.06)sfx('pick');if(m.i>=m.n)m.fin=true}else{m.note='삐끗';sfx('err')}
    return;
  }
  // 도끼·곡괭이를 벼릴수록 맞는 폭이 넓어진다. 바위를 잘 맞히면 쇳돌이 섞여 나온다
  if(m.kind==='chop'){const d=Math.abs(m.pos-m.zc),z=1+tl('axe')*.17;mgHit(d<=.055*z?2:d<=.17*z?1:0)}
  else if(m.kind==='mine'){
    const d=Math.abs(m.r-15),lv=tl('pick'),z=1+lv*.17,g=d<=2.5*z?2:d<=7*z?1:0;
    if(g&&Math.random()<(g===2?[.4,.55,.7,.85]:[.1,.15,.2,.3])[lv])m.ore=(m.ore||0)+1;
    mgHit(g);
  }
  else{
    m.p=Math.min(1,m.p+.17);m.o.sh=.3;sfx('chop');
    const want=m.p>=1?3:m.p>=.66?2:m.p>=.33?1:0;
    while(m.dropped<want)dropFruit(m);
    if(m.p>=1){if(m.t<1.7){dropFruit(m);toast('힘차게 흔들어서 하나 더 떨어졌어요!')}mgEnd()}
  }
}
function mgEnd(){
  const m=mg;if(!m)return;mg=null;
  if(m.kind==='hunt')return;
  if(m.kind==='forge'){

function updMg(dt){
  if(drops.length){
    for(const d of drops)d.t+=dt*1.7;
    for(const d of drops)if(d.t>=1){S.pickups.push({x:d.x,y:d.y,id:d.id});if(P.x===d.x&&P.y===d.y&&P.t>=1)grab(S.pickups.length-1)}
    drops=drops.filter(d=>d.t<1);
  }
  const m=mg;if(!m)return;
  if(m.kind==='forge'){updForge(m,dt);return}
  if(m.kind==='milk'){updMilk(m,dt);return}
  if(m.kind==='cook'){updCook(m,dt);return}
  if(m.kind==='rite'){updRite(m,dt);return}
  if(m.kind==='haggle'){updHaggle(m,dt);return}
  if(m.kind==='eye'){updEye(m,dt);return}
  if(m.cool>0){
    m.cool-=dt;
    if(m.cool<=0){m.note='';if(m.fin)mgEnd();else if(m.kind==='mine')m.r=36;else if(m.kind==='chop'){m.zc=rnd(.3,.7);m.pos=Math.random()<.5?0:1;m.dir=m.pos?-1:1}}
    return;
  }
  if(m.kind==='hunt'){
    m.ph+=dt*(2.6+m.i*.9);m.t+=dt;
    if(m.t>4.5){m.b.flee=3;mg=null;toast('머뭇거리는 사이 눈치채고 달아났어요')}
  }else if(m.kind==='build')m.ph+=dt*(2.3+m.i*.4);
  else if(m.kind==='chop'){
    m.pos+=m.dir*(1.25+m.i*.45)*dt;if(m.pos>=1){m.pos=1;m.dir=-1}else if(m.pos<=0){m.pos=0;m.dir=1}
    m.idle+=dt;if(m.idle>6)mgHit(0);
  }else if(m.kind==='mine'){m.r-=(26+m.i*9)*dt;if(m.r<5)mgHit(0)}
  else{m.t+=dt;m.p=Math.max(0,m.p-.22*dt);if(m.t>7)mgEnd()}
}

function plant(k,seed){

function till(x,y){

  // 괭이를 벼릴수록 바라보는 쪽으로 여러 칸을 한 번에 간다. 다 자란 소가 있으면 기력이 덜 든다

  if(ox)tip('ox','소가 쟁기를 끌어 줘서 밭 갈기가 한결 수월해요 (기력 1)');

function startFishing(x,y){

// 낚시: 기다림 → 입질(느낌표에 맞춰 챔) → 줄 당기기(잔잔할 때 연타, 물이 튀면 멈춤)
function fishTable(sea){const t=FISH[sea?'sea':'fresh'].slice(),sf=SFISH[season()];if(sf[1]===!!sea)t.push([sf[0],20,sf[2]]);return t}
function updFishing(dt){
  const f=fishing;if(!f)return;
  if(f.phase==='reel'){
    f.idle+=dt;if(f.idle>4.5){fishing=null;toast('머뭇거리는 사이 물고기가 달아났어요');return}
    f.t-=dt;if(f.t>0)return;
    if(f.thr===0){f.thr=1;f.t=.34}
    else if(f.thr===1){f.thr=2;f.t=rnd(.7,1.2)+f.hard*.15;sfx('bite')}
    else{f.thr=0;f.t=Math.max(.7,rnd(1.1,2)-f.hard*.2);f.tension=Math.max(0,f.tension-1)}
    return;
  }
  f.t-=dt;if(f.t>0)return;
  if(f.phase==='cast'){f.phase='wait';f.t=rnd(1.6,4.8)*(S.weather==='rain'?.6:1);sfx('water')}
  else if(f.phase==='wait'){f.phase='bite';f.t=.9;sfx('bite')}
  else{fishing=null;toast('앗, 놓쳤어요…')}
}
function reel(){
  const f=fishing;if(!f||f.phase==='cast')return;
  if(f.phase==='wait'){fishing=null;toast('너무 빨리 당겼어요. 느낌표가 뜰 때 당겨요');return}
  if(f.phase==='bite'){
    const tb=fishTable(f.sea);let tot=0;
    const w=tb.map(e=>{const v=e[1]*(e[2]>=15&&perk('parang')?2:1);tot+=v;return v});
    let r=Math.random()*tot,k=0;while(k<tb.length-1&&r>w[k]){r-=w[k];k++}
    const hard=tb[k][2]>=15?2:tb[k][2]>=8?1:0;
    Object.assign(f,{phase:'reel',fish:tb[k],hard,prog:0,need:Math.max(4,[6,9,13][hard]-tl('rod')),tension:0,thr:0,t:rnd(1,1.8),idle:0});
    sfx('pick');tip('reel','물이 잔잔할 때 연타로 당기고, 물이 튀면 멈춰요');return;
  }
  f.idle=0;
  if(f.thr===2){f.tension++;sfx('err');if(f.tension>=(tl('rod')>=3?3:2)){fishing=null;toast('줄이 끊어졌어요… 물이 튈 땐 멈춰야 해요')}return}
  f.prog++;sfx('cast');
  if(f.prog>=f.need){
    const it=f.fish;gain(it[0],1);addXp(it[2]);float('+1 '+ITEMS[it[0]].n);sfx(f.hard===2?'level':'pick');
    if(f.hard===2)toast('대물이다! '+jo(ITEMS[it[0]].n,'을','를')+' 낚았어요');
    fishing=null;
  }
}

  mg={kind:'rite',o:{x:P.x,y:P.y,sh:0},rounds:COURT.rounds[ex],maxMiss:ex?1:2,exam:ex,mate,r:0,seq:[],i:0,t:0,k:-1,miss:0,flash:0,lit:-1,nt:0,note:'',cool:0,fin:false,ok:false,end:0};
  riteRound(mg);P.path=[];P.after=null;keys.length=0;N.queen.hold=90;
  tip('rite','동작의 차례를 잘 본 뒤, 방향키나 화면의 화살표로 그대로 따라 해요. 그만두려면 Esc');
}
function riteRound(m){
  m.seq=[];
  for(let i=0;i<m.rounds[m.r];i++){let d=Math.floor(Math.random()*4);if(i&&d===m.seq[i-1]&&Math.random()<.7)d=(d+1+Math.floor(Math.random()*3))%4;m.seq.push(d)}
  m.phase='show';m.t=-.8;m.k=-1;m.i=0;
}
const ritePad=()=>{const py=(ry(P)+.9)*T;let cy=py-116;if(cy-74<cam.y)cy=py+78;return{cx:(rx(P)+.5)*T,cy}};
function ritePress(d){
  const m=mg;if(!m||m.kind!=='rite'||m.fin||m.phase!=='input'||d<0||d>3)return;
  m.flash=.2;m.lit=d;m.t=0;
  if(d===m.seq[m.i]){
    sfx('n'+d);m.i++;if(m.i<m.seq.length)return;
    m.r++;
    if(m.r>=m.rounds.length){m.fin=true;m.ok=true;m.end=.7;m.note='흐트러짐 없이 해냈어요!';return}
    riteRound(m);m.note='좋아요! 다음 차례';m.nt=.8;
  }else{
    sfx('err');m.miss++;
    if(m.miss>m.maxMiss){m.fin=true;m.ok=false;m.end=.7;m.note='예법이 흐트러졌어요';return}
    m.phase='show';m.t=-.9;m.k=-1;m.i=0;m.note='틀렸어요. 다시 잘 보세요';m.nt=.9;
  }
}
function riteClick(wx,wy){
  const p=ritePad();
  for(let d=0;d<4;d++)if(Math.hypot(wx-(p.cx+DIRS[d][0]*32),wy-(p.cy+DIRS[d][1]*32))<=19){ritePress(d);return}
}
function updRite(m,dt){
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  if(m.flash>0)m.flash-=dt;
  if(m.nt>0){m.nt-=dt;if(m.nt<=0)m.note=''}
  m.t+=dt;
  if(m.phase==='show'){
    // 한 동작에 0.6초(켜짐 0.42초). 다 보여 주고 나면 따라 할 차례가 된다
    const k=Math.floor(m.t/.6);
    if(m.t>=0&&k!==m.k&&k<m.seq.length){m.k=k;sfx('n'+m.seq[k])}
    if(m.t>=m.seq.length*.6+.15){m.phase='input';m.i=0;m.t=0}
  }else if(m.t>10){m.fin=true;m.ok=false;m.end=.5;m.note='머뭇거리다 흐트러졌어요'}
}

function updBeasts(dt){
  if(scene==='home')return;
  for(const b of beasts){
    const tiger=b.k==='tiger';
    if(b.t<1){b.t=Math.min(1,b.t+dt*(b.flee>0?4.2:tiger?2.7:1.6));if(b.t>=1){b.fx=b.x;b.fy=b.y}continue}
    if(b.stun>0){b.stun-=dt;continue}
    if(mg&&mg.kind==='hunt'&&mg.b===b)continue;
    if(b.flee>0)b.flee-=dt;if(b.calm>0)b.calm-=dt;
    const dist=Math.abs(b.x-P.x)+Math.abs(b.y-P.y);
    // 범은 달아나지 않고 다가와 덮친다. 다른 짐승은 두 칸 안으로 다가가면 달아난다
    if(tiger){if(b.bite>0)b.bite-=dt;if(dist===1&&b.bite<=0&&b.flee<=0){b.bite=2.5;S.en=Math.max(0,S.en-18);hud();sfx('err');toast('범이 덮쳤어요! 기력이 18 줄었어요')}}
    else if(dist<=2)b.flee=Math.max(b.flee,1.2);
    const chase=tiger&&b.flee<=0&&dist>1&&dist<=6;
    if(b.flee<=0&&!chase){b.wait-=dt;if(b.wait>0||b.calm>0)continue;b.wait=rnd(1.5,5)}
    // 길과 다리는 넘지 않는다
    const opts=DIRS.filter(([dx,dy])=>{const x=b.x+dx,y=b.y+dy;return walkable(x,y)&&tile[y][x]!==1&&tile[y][x]!==5&&!npcOn(x,y)&&!beastOn(x,y)&&!herdOn(x,y)&&!(x===P.x&&y===P.y)});
    if(!opts.length)continue;
    const far=([dx,dy])=>Math.abs(b.x+dx-P.x)+Math.abs(b.y+dy-P.y);
    const [dx,dy]=b.flee>0?opts.reduce((a,o)=>far(o)>far(a)?o:a):chase?opts.reduce((a,o)=>far(o)<far(a)?o:a):pick(opts);
    b.dir=[dx,dy];b.fx=b.x;b.fy=b.y;b.x+=dx;b.y+=dy;b.t=0;
  }
}
function beastInLine(){
  if(scene==='home')return null;
  for(let i=1;i<=4+tl('bow');i++){
    const x=P.x+P.dir[0]*i,y=P.y+P.dir[1]*i;if(x<0||y<0||x>=W||y>=H)return null;
    const b=beastOn(x,y);if(b)return b;
    if(objAt[y][x]||tile[y][x]===6||npcOn(x,y)||herdOn(x,y))return null;
  }
  return null;
}
// 과녁 크기: 활을 벼리거나 무예가 높거나 무진과 친하면 커진다
const aimR=()=>8.5+tl('bow')*1.2+sv('arms')*.15+(perk('mujin')?1.5:0);
function startHunt(b){
  if(!useEn(2))return;
  mg={kind:'hunt',b,o:b,ph:rnd(0,6),t:0,i:0,cool:0,note:''};P.path=[];P.after=null;
  tip('aim','흔들리는 과녁이 짐승에 겹칠 때 행동! 빗나가면 달아나요');
}
function shoot(m){
  const b=m.b;sfx('cast');
  if(Math.hypot(Math.sin(m.ph)*22,Math.sin(m.ph*1.7)*7)>aimR()){b.flee=3;mg=null;sfx('err');toast('빗나갔어요! '+jo(BEASTS[b.k].n,'이','가')+' 달아나요');return}
  b.hp--;sfx('chop');
  if(b.hp>0){b.stun=2.4;m.i++;m.t=0;m.cool=.45;m.note='명중! 한 번 더!';return}
  beasts.splice(beasts.indexOf(b),1);mg=null;
  if(scene==='wild')S.wildN=Math.max(0,S.wildN-1);else S.wild=Math.max(0,S.wild-1);
  float(BEASTS[b.k].n+' 사냥 성공!',b.x*T+16,b.y*T-10);addXp(b.k==='tiger'?40:b.k==='deer'?20:b.k==='boar'?14:8);sfx('level');
  if(b.k==='tiger')toast('범을 잡았어요! 마을에 소문이 자자하겠어요');
  train('arms',b.k==='tiger'?6:2);
  const spots=[[b.x,b.y]];
  for(const [dx,dy] of DIRS){const x=b.x+dx,y=b.y+dy;if(walkable(x,y)&&!(x===P.x&&y===P.y)&&!S.pickups.some(p=>p.x===x&&p.y===y))spots.push([x,y])}
  BEASTS[b.k].loot.forEach((id,j)=>{const s=spots[j%spots.length];drops.push({id,x:s[0],y:s[1],sx:b.x*T+16,sy:b.y*T+4,t:0})});
  tip('loot','떨어진 전리품은 그 위를 지나가면 주워요');touch();
}
function huntClick(b){
  b.calm=8;
  const spot=(a,r)=>{
    if(a!==b.x&&r!==b.y)return false;
    const d=Math.abs(a-b.x)+Math.abs(r-b.y);if(d<3||d>4+tl('bow'))return false;
    const sx=Math.sign(b.x-a),sy=Math.sign(b.y-r);
    for(let i=1;i<d;i++){const x=a+sx*i,y=r+sy*i;if(objAt[y][x]||tile[y][x]===6)return false}
    return true;
  };
  if(!setPath(spot,()=>{P.dir=[Math.sign(b.x-P.x),Math.sign(b.y-P.y)];if(beastInLine()===b)startHunt(b);else toast('짐승이 자리를 옮겼어요. 다시 겨눠 봐요')}))toast('쏠 자리가 없어요. 서너 칸 떨어진 일직선 자리가 필요해요');
}

    if(grazeOk(x,y)&&!(scene==='town'&&x===P.x&&y===P.y)&&!herd.some(a=>a.x===x&&a.y===y)&&!townBeasts.concat(scene==='town'?beasts:[]).some(b=>b.x===x&&b.y===y)&&!S.pickups.some(q=>q.x===x&&q.y===y))opts.push([x,y]);
  if(!opts.length)return;

function updHerd(dt){

function reach(block){

  while(q.length){const [x,y]=q.pop();for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(seen.has(k)||!walkable(nx,ny)||(block&&block.has(k)))continue;seen.add(k);q.push([nx,ny])}}
  return seen;
}

function dayStock(msgs){

    const d=STOCK[a.k],pen=S.pens[d.pen],fed=!!(pen&&pen.fed);

  }
  for(const k in S.pens)S.pens[k].fed=false;
  if(eggs&&S.pens.coop){
    const p=S.pens.coop,spots=[];let n=eggs;
    for(let y=p.y-1;y<=p.y+2;y++)for(let x=p.x-1;x<=p.x+2;x++)if(grazeOk(x,y)&&!S.pickups.some(q=>q.x===x&&q.y===y))spots.push([x,y]);

function freezeRoom(){if(!S.room){S.entry=roomEntry();S.room=[...roomSet()]}}
function decoClick(x,y){
  const set=roomSet(),e=roomEntry(),k=x+','+y,inRoom=set.has(k),dxr=e[0],rh=e[1]+1;
  if(decoSel==='+floor'){
    if(inRoom)return;
    if(x<0||y<0||x>=GRID_W||y>=GRID_H||(x===e[0]&&y===e[1]+1)){toast('여기까지는 넓힐 수 없어요');return}
    if(set.size>=roomBudget()){toast('지금 집으로는 더 넓힐 수 없어요. 집을 키우면 칸이 늘어요');sfx('err');return}
    if(!DIRS.some(([dx,dy])=>set.has((x+dx)+','+(y+dy)))){toast('지금 방에 붙은 자리만 넓힐 수 있어요');return}
    freezeRoom();S.room=S.room.concat(k);sfx('chop');touch();renderDeco();return;
  }
  if(decoSel==='-floor'){
    if(!inRoom)return;
    if((x===0&&y<2)||(x===e[0]&&y===e[1])||(x===P.x&&y===P.y)||furnAt(x,y)){toast('이 칸은 뗄 수 없어요');sfx('err');return}
    freezeRoom();const old=S.room;S.room=old.filter(q=>q!==k);
    // 떼고 나서도 모든 칸이 문에서 이어져 있어야 한다
    const now2=roomSet(),seen=new Set([e.join()]),q=[e];
    while(q.length){const [a,b]=q.pop();for(const [dx,dy] of DIRS){const n=(a+dx)+','+(b+dy);if(now2.has(n)&&!seen.has(n)){seen.add(n);q.push([a+dx,b+dy])}}}
    if(seen.size!==S.room.length){S.room=old;toast('방이 둘로 나뉘어서 뗄 수 없어요');sfx('err');return}
    sfx('chop');touch();renderDeco();return;
  }
  if(!inRoom)return;
  const f=furnAt(x,y);
  if(f){S.placed.splice(S.placed.indexOf(f),1);S.furn[f.id]=(S.furn[f.id]||0)+1;sfx('pick');touch();renderDeco();return}
  if(!decoSel){toast('먼저 아래에서 가구를 골라요');return}
  if((x===0&&y<2)||(x===dxr&&y===rh-1)||(x===P.x&&y===P.y)){toast('여기에는 놓을 수 없어요');sfx('err');return}
  S.placed.push({id:decoSel,x,y});
  if(!FURN[decoSel].walk){
    const okBed=findPath(dxr,rh-1,(a,b)=>(a===1&&b<2)||(a===0&&b===2)),okMe=findPath(dxr,rh-1,(a,b)=>a===P.x&&b===P.y);
    if(!okBed||!okMe){S.placed.pop();toast('길이 막혀서 놓을 수 없어요');sfx('err');return}
  }
  S.furn[decoSel]--;sfx('pick');touch();renderDeco();
}
// ───────── 시작 화면 ─────────
const COLORS=['#dd6a1c','#3f8fc4','#3a8749','#d94a74','#8a63c9'];
function showTitle(saved){
  const body=$('titleBody');body.textContent='';
  if(!saved){showNew(null);return}
  $('titleMsg').textContent=saved.name+'의 마을 · '+saved.day+'일째 · 레벨 '+saved.level+' · '+HOUSES[(saved.house||1)-1].n;
  const r=el('div','tabs'),go=el('button','btn pri','이어서 하기'),nw=el('button','btn','새로 시작');
  go.type=nw.type='button';go.onclick=()=>begin(saved);nw.onclick=()=>showNew(saved);r.appendChild(go);r.appendChild(nw);body.appendChild(r);go.focus({preventScroll:true});
}
function showNew(saved){
  const body=$('titleBody');body.textContent='';
  $('titleMsg').textContent=saved?'새로 시작하면 지금 저장된 마을은 지워져요.':'작은 텐트 하나로 시작해요. 열매를 따고, 낚시하고, 이웃과 친해지면서 집을 키워 보세요.';
  const lab=el('label',null,'주민 이름'),inp=el('input');inp.type='text';inp.id='nameInput';inp.maxLength=8;inp.value='새싹';inp.autocomplete='off';lab.appendChild(inp);body.appendChild(lab);
  let color=COLORS[0];const sw=el('div','swatches');sw.setAttribute('role','group');sw.setAttribute('aria-label','옷 색');
  COLORS.forEach((c,i)=>{const b=el('button','sw'+(i?'':' on'));b.type='button';b.style.background=c;b.setAttribute('aria-label','옷 색 '+(i+1));b.onclick=()=>{color=c;for(const x of sw.children)x.classList.toggle('on',x===b)};sw.appendChild(b)});
  let sex='m';const sx=el('div','tabs');
  for(const [k,l] of [['m','남자'],['f','여자']]){const b=el('button','btn'+(k===sex?' on':''),l);b.type='button';b.onclick=()=>{sex=k;for(const x of sx.children)x.classList.toggle('on',x===b)};sx.appendChild(b)}
  const l3=el('label',null,'모습 (옷장에서 언제든 바꿀 수 있어요)');l3.appendChild(sx);body.appendChild(l3);
  const l2=el('label',null,'집 깃발 색');l2.appendChild(sw);body.appendChild(l2);
  const r=el('div','tabs'),go=el('button','btn pri','마을로 들어가기');go.type='button';
  const enter=()=>{const st=newState((inp.value||'').trim()||'새싹',color);st.sex=sex;begin(st)};
  go.onclick=enter;inp.onkeydown=e=>{if(e.key==='Enter')enter()};r.appendChild(go);
  if(saved){const bk=el('button','btn','돌아가기');bk.type='button';bk.onclick=()=>showTitle(saved);r.appendChild(bk)}
  body.appendChild(r);
}
function begin(st){
  S=fixState(st);started=true;$('title').hidden=true;scene='town';
  // 사냥터에서 저장된 채 끝났더라도 마을에서 다시 시작한다
  useMap(TOWN);wildBeasts=null;if(S.pickTown){if(S.pickups.length)S.wpick=S.pickups;S.pickups=S.pickTown;delete S.pickTown}$('bDeco').hidden=true;warp(SPAWN[0],SPAWN[1],[0,1]);
  // 가축 우리를 지도에 얹고, 새로 생긴 화덕·우리 자리에 남아 있던 주울 것은 치운다
  crownNames();applyPens();applyMarket();S.pickups=S.pickups.filter(p=>!(TOWN.objAt[p.y]&&TOWN.objAt[p.y][p.x]));spawnHerd();placing=false;syncPlace();
  if(groundSeason!==season())buildGround();
  // 예전 저장에는 모습 정보가 없다: 한 번 옷장을 열어 고르게 한다
  if(!S.sex){S.sex='m';setTimeout(()=>{if(S&&!busy())openWardrobe()},1500)}
  initRoom();
  setTimeout(()=>{if(S&&!busy())tip('north','마을 북쪽(만물상 옆) 길 끝으로 가면 한양 궁궐에 들어갈 수 있어요. 아래 "신분"에서 스탯도 올려 보세요')},9000);
  spawnBeasts();setTimeout(()=>{if(S&&beasts.length)tip('hunt','마을 바깥쪽에 들짐승이 보여요. 서너 칸 떨어져 일직선에 서서 행동하면 사냥할 수 있어요')},3500);
  $('bSound').textContent=S.sound?'소리 켬':'소리 끔';hud();saveAll();cv.focus({preventScroll:true});
  toast(S.day===1&&S.xp===0?'환영해요, '+S.name+' 님! 나무 앞에서 행동 버튼을 눌러 보세요':'다시 오셨네요, '+S.name+' 님');
}
// ───────── 같이 하기 ─────────
// 같은 페이지를 열어 둔 친구가 내 마을에 캐릭터로 나타난다. 각자 자기 마을을 키우고, 위치·말풍선은 presence로, 선물은 gift 토픽으로 주고받는다.
// 남이 보낸 값은 믿지 않는다: 글자는 걸러서 캔버스에만 쓰고, 색과 아이템은 형식을 확인한다
let net=null,myPeer=null,peers=[],mySay='',mySayT=0,mySayAt=-99,lastPres='';
const PV={};
const cleanText=s=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f​-‏‪-‮⁠-⁯﻿]/g,'').slice(0,40);
const safeColor=c=>/^#[0-9a-fA-F]{6}$/.test(c)?c:'#888888';
const peerName=p=>cleanText(p.presence.n).slice(0,8)||'친구';
// 같은 곳(마을 0 / 집 1 / 사냥터 2)에 있는 친구만 보인다. 집 안은 각자의 집이라 서로 보이지 않는다
const SCENE_NO={town:0,home:1,wild:2,palace:3};
const peerHere=p=>scene!=='home'&&p.presence.s===SCENE_NO[scene];
const peerAt=(x,y)=>peers.find(p=>{const v=PV[p.peer];return v&&peerHere(p)&&v.x===x&&v.y===y});
const peerLook=q=>({skin:'#f3cfb0',hair:'#2e2a2a',shirt:safeColor(q.c),bot:safeColor(q.k),rib:safeColor(q.r),sex:q.g==='f'?'f':'m',hat:['bun','none','gat','cap','straw','gache','ikseon'].includes(q.h)?q.h:'none'});
function syncPresence(){
  if(!net||!started||!S)return;
  const d=DIRS.findIndex(q=>q[0]===P.dir[0]&&q[1]===P.dir[1]),k=[P.x,P.y,d,scene,mySayT,S.name,S.outfit,S.sex].join();
  if(k===lastPres)return;lastPres=k;
  const L=playerLook();
  net.presence({n:S.name,c:L.shirt,k:L.bot,r:L.rib,g:L.sex,h:L.hat,x:P.x,y:P.y,d,s:SCENE_NO[scene]||0,say:mySay,st:mySayT}).catch(()=>{});
}
function onPeers(ch){
  peers=ch.peers.filter(p=>!p.isMe&&p.kind==='viewer'&&p.presence&&typeof p.presence.n==='string');
  const me=ch.peers.find(p=>p.sameTab);if(me)myPeer=me.peer;
  for(const p of peers){
    const q=p.presence,x=q.x|0,y=q.y|0;let v=PV[p.peer];
    if(!v)v=PV[p.peer]={x,y,fx:x,fy:y,t:1,say:'',sayAt:-99,st:0};
    if(v.x!==x||v.y!==y){const cx=lerp(v.fx,v.x,v.t),cy=lerp(v.fy,v.y,v.t),far=Math.abs(cx-x)+Math.abs(cy-y)>3;v.fx=far?x:cx;v.fy=far?y:cy;v.x=x;v.y=y;v.t=far?1:0}
    if(q.st&&q.st!==v.st){v.st=q.st;v.say=cleanText(q.say).slice(0,30);v.sayAt=now}
  }
  for(const k in PV)if(!peers.some(p=>p.peer===k))delete PV[k];
  $('hPeers').hidden=!peers.length;$('hPeers').textContent='함께 '+(peers.length+1)+'명';
}
async function initRoom(){
  try{
    if(net||!window.claude||!window.claude.use)return;
    const r=await window.claude.use('room');if(!r)return;
    net=r;lastPres='';
    r.onPeers(onPeers,()=>{net=null;peers=[];$('hPeers').hidden=true});
    r.on('gift',m=>{
      const d=m.data;if(!d||m.isMe||!S||d.to!==myPeer||typeof d.item!=='string'||!ITEMS[d.item]||ITEMS[d.item].seed)return;
      const from=peers.find(p=>p.peer===m.peer);gain(d.item,1);sfx('heart');
      toast((from?peerName(from):'친구')+' 님이 '+jo(ITEMS[d.item].n,'을','를')+' 선물했어요');
    },()=>{});
  }catch(e){net=null}
}
function speak(t){mySay=cleanText(t).slice(0,30);if(!mySay)return;mySayT=Date.now();mySayAt=now}
function peerMenu(p){
  const nm=peerName(p);
  dialog({who:nm,role:'같이 노는 친구',text:'무엇을 할까요?',choices:[['인사하기',()=>speak('안녕, '+nm+'!')],['선물하기',()=>peerGift(p,nm)],['그만',null]]});
}
function peerGift(p,nm){
  const ids=Object.keys(S.inv).filter(k=>!ITEMS[k].seed);
  if(!ids.length){toast('건넬 물건이 없어요');return}
  openModal(nm+'에게 선물',body=>{
    body.appendChild(el('p','note','고른 물건 하나를 친구 가방으로 보내요.'));
    const g=el('div','grid');
    for(const k of ids){
      const b=cellOf('item',k,'×'+have(k),'button');
      b.onclick=()=>{
        closeModal();if(!net||!net.connected()){toast('지금은 연결이 끊겨 있어요');return}
        gain(k,-1);
        net.emit('gift',{to:p.peer,item:k}).then(()=>{toast(nm+' 님에게 '+jo(ITEMS[k].n,'을','를')+' 건넸어요');speak('선물이야!')},
          ()=>{gain(k,1);toast('선물을 보내지 못했어요. 공유할 때 기여자 이상 권한을 받은 사람만 보낼 수 있어요')});
      };
      g.appendChild(b);
    }
    body.appendChild(g);
  });
}
function openSay(){
  openModal('같이 하기',body=>{
    body.appendChild(el('p','note',!window.claude?'이 주소에서는 혼자 하기만 돼요. 친구가 마을에 나타나는 같이 하기는 claude.ai 아티팩트로 열었을 때 쓸 수 있어요. 아래 말은 내 머리 위에만 떠요.':!net?'지금은 혼자 하는 중이에요. 이 페이지의 공유 메뉴에서 친구를 초대하면, 친구가 페이지를 열었을 때 내 마을에 캐릭터로 나타나요.'
      :peers.length?'지금 함께: '+peers.map(peerName).join(', ')+' · 친구 캐릭터를 누르면 인사하거나 선물할 수 있어요.':'아직 들어온 친구가 없어요. 공유 메뉴에서 초대한 친구가 페이지를 열면 마을에 나타나요.'));
    const g=el('div','tabs');g.style.flexWrap='wrap';
    for(const t of ['안녕!','같이 낚시하자','이리 와 봐','고마워!','잘 가~']){const b=el('button','btn',t);b.type='button';b.onclick=()=>{speak(t);closeModal()};g.appendChild(b)}
    body.appendChild(g);
    const lab=el('label','sub','하고 싶은 말'),inp=el('input');inp.type='text';inp.id='sayInput';inp.maxLength=30;inp.autocomplete='off';
    inp.style.cssText='font:inherit;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;display:block;margin-top:4px';
    const send=()=>{if(inp.value.trim()){speak(inp.value);closeModal()}};
    inp.onkeydown=e=>{if(e.key==='Enter')send()};lab.appendChild(inp);body.appendChild(lab);
    const b=el('button','btn pri','말하기');b.type='button';b.onclick=send;body.appendChild(b);
  });
}

// ───────── 조작 ─────────
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Escape'){if(!$('modal').hidden)closeModal();else if(decoMode)setDeco(false);else if(placing)stopPlacing();else if(mg&&(mg.kind==='rite'||mg.kind==='eye')){mgEnd();toast('그만뒀어요')}return}
  if(!started||sleeping)return;
  const go=e.code==='Space'||e.code==='KeyE'||e.code==='Enter';
  if(!$('dlg').hidden){
    if(go&&(e.repeat||(dlgState&&dlgState.i<dlgState.txt.length))){e.preventDefault();if(!e.repeat)skipType()}
    return;
  }
  if(!$('modal').hidden)return;
  // 예법 따라 하기 중에는 방향키가 걷기가 아니라 동작 입력이다
  if(mg&&mg.kind==='rite'&&KEYDIR[e.code]){e.preventDefault();if(!e.repeat){const q=KEYDIR[e.code];ritePress(DIRS.findIndex(v=>v[0]===q[0]&&v[1]===q[1]))}return}
  if(mg&&mg.kind==='eye'&&KEYDIR[e.code]){e.preventDefault();if(!e.repeat&&KEYDIR[e.code][0])eyePick(KEYDIR[e.code][0]<0?0:1);return}
  if(KEYDIR[e.code]){e.preventDefault();if(!keys.includes(e.code))keys.push(e.code);if(fishing){fishing=null;toast('낚시를 그만뒀어요')}if(mg)mgEnd();return}
  if(go){if(e.target&&e.target.tagName==='BUTTON'&&e.code!=='KeyE')return;e.preventDefault();if(!e.repeat)interact();return}
  if(e.code==='KeyB')openBag();
});
window.addEventListener('keyup',e=>{const i=keys.indexOf(e.code);if(i>=0)keys.splice(i,1)});
window.addEventListener('blur',()=>{keys.length=0});
cv.addEventListener('pointerdown',e=>{
  if(busy())return;
  const r=cv.getBoundingClientRect(),wx=(e.clientX-r.left)/zoom+cam.x,wy=(e.clientY-r.top)/zoom+cam.y;
  if(decoMode){decoClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(placing&&scene==='town'){placeClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(mg&&mg.kind==='rite'){riteClick(wx,wy);return}
  if(mg&&mg.kind==='eye'){eyeClick(wx,wy);return}
  if((scene==='town'||scene==='palace')&&npcOut())for(const id of NPC_IDS){
    if(!npcHere(id))continue;
    const n=N[id],cx=(rx(n)+.5)*T,fy=(ry(n)+.9)*T;
    if(Math.abs(wx-cx)<13&&wy<fy+4&&wy>fy-46){clickTile(n.x,n.y);return}
  }
  clickTile(Math.floor(wx/T),Math.floor(wy/T),wy/T-Math.floor(wy/T)>.35);
});
$('dlgText').addEventListener('click',skipType);
$('actBtn').onclick=()=>{interact();cv.focus({preventScroll:true})};
const tool=(id,fn)=>{$(id).onclick=()=>{if(!started||sleeping)return;if(!$('dlg').hidden)closeDlg();fn()}};
tool('bBag',openBag);tool('bJob',openStatus);tool('bFriends',openFriends);tool('bQuests',openQuests);tool('bHelp',openHelp);tool('bDex',openDex);tool('bSay',openSay);tool('bWear',openWardrobe);
tool('bDeco',()=>{setDeco(!decoMode);cv.focus({preventScroll:true})});
tool('bPlace',()=>{if(placing)stopPlacing();else{placing=true;syncPlace();toast('집 둘레 내 땅(밝게 표시된 풀밭)에서 지을 자리를 눌러요')}cv.focus({preventScroll:true})});
tool('bSave',()=>{saveAll();toast(cloudDoc?'저장했어요 · 계정에도 올려서 다른 기기에서 이어 할 수 있어요':'저장했어요 · 이 브라우저에 보관돼요');cv.focus({preventScroll:true})});
tool('bSound',()=>{S.sound=!S.sound;$('bSound').textContent=S.sound?'소리 켬':'소리 끔';touch();sfx('pick');cv.focus({preventScroll:true})});
$('mClose').onclick=closeModal;
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&started){keys.length=0;saveLocal();if(cloudDirty)pushCloud()}});

// ───────── 돌리기 ─────────
let last=0,lastTen=-1,saveT=0,cloudT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000||0));last=ts;now+=dt;
  if(started&&S){
    if(!busy()){updTime(dt);updPlayer(dt);updNpcs(dt);updBeasts(dt);updHerd(dt);updFishing(dt);updMg(dt)}
    else if(P.t<1){P.t=Math.min(1,P.t+dt*5.6);if(P.t>=1){P.fx=P.x;P.fy=P.y}}
    for(const o of TREES)if(o.sh>0)o.sh-=dt;
    for(const o of ROCKS)if(o.sh>0)o.sh-=dt;
    syncPresence();for(const k in PV){const v=PV[k];if(v.t<1)v.t=Math.min(1,v.t+dt*5.6)}
    if(floats.length){for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.3)}
    const ten=Math.floor(S.min/10);if(ten!==lastTen){lastTen=ten;hud()}
    saveT+=dt;if(saveT>8){saveT=0;if(dirty)saveLocal()}
    cloudT+=dt;if(cloudT>90){cloudT=0;if(cloudDirty){saveLocal();pushCloud()}}
  }
  render();
}
function start(hot){
  buildGround();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));else window.addEventListener('resize',resize);
  requestAnimationFrame(frame);
  if(hot&&hot.S){begin(hot.S);return}
  S=newState('',COLORS[0]);S.min=600; // 시작 화면 뒤에 비치는 마을 풍경용. 시작하면 실제 상태로 바뀐다
  const local=loadLocal();let shown=false;
  const show=()=>{if(shown)return;shown=true;let best=local;if(cloudSaved&&(!best||(cloudSaved.ts||0)>(best.ts||0)))best=cloudSaved;showTitle(best)};
  if(window.claude&&window.claude.use){initCloud().then(show,show);setTimeout(show,3500)}else show();
}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({S:started?S:null}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
