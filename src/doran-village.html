<title>도란도란 마을</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 한 화면 앱. 위 HUD 띠, 가운데 마을 캔버스, 아래 도구 막대. 창은 캔버스 위에 뜬다. */
:root{
  --bg:#e6efd8; --surface:#fbfdf5; --ink:#243524; --muted:#5d7260; --line:#c6d6b4;
  --accent:#dd6a1c; --accent-ink:#fffaf2; --leaf:#3a8749; --water:#2b7fb5; --heart:#d94a74;
  --shade:rgba(24,44,24,.5);

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#131c17; --surface:#1d2a23; --ink:#e3eedc; --muted:#9bb29b; --line:#33483a;
  --accent:#f08b3d; --accent-ink:#1c1208; --leaf:#72c480; --water:#70bbe8; --heart:#f47f9f;
  --shade:rgba(0,0,0,.62); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#131c17; --surface:#1d2a23; --ink:#e3eedc; --muted:#9bb29b; --line:#33483a;
  --accent:#f08b3d; --accent-ink:#1c1208; --leaf:#72c480; --water:#70bbe8; --heart:#f47f9f;

/* 화면 높이: 휴대폰은 주소창이 들락날락해서 100%만으로는 아래가 잘릴 수 있다. 지금 보이는 높이(dvh)에 맞추고, 화면 자체는 굴러가지 않게 한다 */
html,body{height:100%}
@supports (height:100dvh){ html,body{height:100dvh} }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(10px,env(safe-area-inset-bottom,0px));
  box-sizing:border-box;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
#app{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-width:0}
.brand{font-family:var(--display);font-size:22px;color:var(--leaf);letter-spacing:.02em;margin-right:auto}
.stats{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.stats{min-width:0;max-width:100%}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:2px 11px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.coin{color:var(--accent)}
.lv{display:flex;align-items:center;gap:6px}
.bar{display:block;width:74px;height:9px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);border-radius:9px;transition:width .3s}
.bar.en i{background:var(--accent)}
#stage{position:relative;flex:1;min-height:320px;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#16261c}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#cv:focus{outline:none}
#cv:focus-visible{outline:3px solid var(--water);outline-offset:-3px}
#fade{position:absolute;inset:0;background:#0b1410;opacity:0;pointer-events:none;transition:opacity .5s}
#fade.on{opacity:1}
#toasts{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:5px 14px;
  font-family:var(--display);font-size:15px;max-width:100%;animation:pop .25s ease-out;box-shadow:0 3px 0 var(--shade)}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#actBtn{position:absolute;right:12px;bottom:12px;width:66px;height:66px;border-radius:50%;border:3px solid var(--accent-ink);
  background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--shade)}
#actBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shade)}
#stage,#bar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.btn,#actBtn{touch-action:manipulation}
#dlg{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;
  padding:12px 14px;box-shadow:0 4px 0 var(--shade);display:flex;flex-direction:column;gap:8px}
#dlgWho{font-family:var(--display);font-size:17px;color:var(--accent);display:flex;align-items:center;gap:8px}
#dlgWho small{font-family:var(--body);font-size:12px;color:var(--muted)}
#dlgText{min-height:3em;font-size:16px;white-space:pre-wrap;cursor:pointer}
#dlgChoices{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.btn{font-family:var(--display);font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;padding:6px 13px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--leaf)}
.btn:focus-visible,#actBtn:focus-visible,input:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.on{background:var(--leaf);color:var(--surface);border-color:var(--leaf)}
.btn:disabled{opacity:.45;cursor:default}
#bar{display:flex;flex-wrap:wrap;gap:6px}
#bar .sp{margin-left:auto}
#deco{background:var(--surface);border:2px solid var(--line);border-radius:16px;
  padding:8px 10px;display:flex;flex-direction:column;gap:6px;max-height:30%;overflow:auto;flex:none}
#deco p{margin:0;font-size:13px;color:var(--muted)}
#decoList{display:flex;flex-wrap:wrap;gap:6px}
#decoList .btn{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 4px}
#modal{position:absolute;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.sheet{background:var(--surface);border:2px solid var(--line);border-radius:18px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.sheet>header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1.5px solid var(--line)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;margin-right:auto;color:var(--leaf)}
#mBody{padding:12px 14px;overflow:auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cell{border:1.5px solid var(--line);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:13px;text-align:center;background:transparent;color:var(--ink);font-family:var(--body);min-width:0}
button.cell{cursor:pointer}
button.cell:hover{border-color:var(--leaf)}
.cell b{font-family:var(--display);font-weight:400;font-size:14px}
.cell small{color:var(--muted)}
.cell.unk img{filter:brightness(0);opacity:.28}
.sub{font-family:var(--display);font-size:16px;margin:4px 0 0;color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;min-width:0}
.row .grow{flex:1;min-width:0}
.row b{font-family:var(--display);font-weight:400;font-size:16px}
.row small{display:block;color:var(--muted);font-size:13px}
.row .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.hearts{color:var(--heart);letter-spacing:1px;font-size:15px}
.hearts i{color:var(--line);font-style:normal}
.note{color:var(--muted);font-size:13px;margin:0}
.ic{width:36px;height:36px;flex:none;image-rendering:pixelated}
.ic.big{width:48px;height:48px}
.badge{width:36px;height:36px;flex:none;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);color:var(--leaf);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px}
#title{position:absolute;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:14px;z-index:6}
#title .sheet{padding:20px 20px 16px;gap:12px;overflow:auto}
#title h1{font-family:var(--display);font-weight:400;font-size:34px;margin:0;color:var(--leaf);text-wrap:balance}
#title p{margin:0}
#titleBody{display:flex;flex-direction:column;gap:12px}
#title label{font-family:var(--display);font-size:15px;display:flex;flex-direction:column;gap:4px}
#title input[type=text]{font:inherit;font-family:var(--body);padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.swatches{display:flex;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
kbd{font-family:var(--display);border:1.5px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px}
ul.help{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
/* 휴대폰 세로: 마을 화면이 넓게 보이도록 위아래 띠를 얇게 한다. 제목은 숨기고, 숫자 칩과 도구 단추를 작게 줄여 두 줄 안에 담는다 */
@media (max-width:520px){
  body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
    padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
  #app{gap:6px} .brand{display:none} #hud{gap:4px}
  .stats{font-size:12.5px;gap:4px} .chip{padding:1px 8px} .bar{width:42px;height:8px}
  #stage{min-height:200px;border-radius:14px}
  #bar{gap:4px} #bar .btn{font-size:13px;padding:5px 8px;border-radius:10px} #bar .sp{margin-left:0}
  #dlgText{font-size:15px} .btn{padding:6px 10px}
  #modal,#title{padding:8px} #title .sheet{padding:14px 14px 12px}
}
/* 휴대폰 가로: 높이가 모자라니 위아래 띠를 한 줄씩으로 줄이고, 도구 단추는 옆으로 밀어 본다 */
@media (max-height:460px) and (orientation:landscape){
  body{padding-top:max(4px,env(safe-area-inset-top,0px));padding-bottom:max(4px,env(safe-area-inset-bottom,0px))}
  #app{gap:4px} .brand{display:none} #hud{flex-wrap:nowrap} .stats{flex-wrap:nowrap;overflow:hidden;font-size:12.5px;gap:4px} .chip{padding:1px 8px;flex:none}
  #stage{min-height:120px;border-radius:12px}
  #bar{flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none} #bar::-webkit-scrollbar{display:none}
  #bar .btn{flex:none;font-size:13px;padding:4px 9px;border-radius:10px} #bar .sp{margin-left:0}
  #actBtn{width:58px;height:58px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){ .toast{animation:none} #fade{transition:none} }
</style>

  s.plots=s.plots||[];s.npcs=s.npcs||{};s.known=s.known||{};s.quests=s.quests||[];s.shopFurn=s.shopFurn||[];
  // 마을 씨앗(seed): 0이면 처음 만든 모양의 마을(예전 저장), 아니면 그 씨앗으로 지은 마을. gen은 생성기 판 번호. 이 함수는 그 마을이 지어진 뒤(buildTown)에 불러야 한다
  s.seed=s.seed>>>0;s.gen=s.seed?(s.gen|0)||1:0;
  for(let i=0;i<TOWN.TREES.length;i++)if(!s.trees[i])s.trees[i]={d:1,h:0};
  for(let i=0;i<TOWN.ROCKS.length;i++)if(!s.rocks[i])s.rocks[i]={h:0};
  for(let i=0;i<PLOTS.length;i++)if(!s.plots[i])s.plots[i]={c:null,g:0,w:false};
  for(const id of NPC_IDS){s.npcs[id]=Object.assign({pts:0,talk:false,gift:false,m2:false,m3:false,m5:false},s.npcs[id]||{});s.known[id]=s.known[id]||{}}
  if(!s.pickups)spawnPickups(s);
  if(!s.shopFurn.length)rollShop(s);
  if(!s.quests.length)rollQuests(s);
  if(s.sound==null)s.sound=true;
  s.tips=s.tips||{};
  if(s.wild==null)s.wild=4;
  if(s.wildN==null)s.wildN=8;
  // 밭은 정해진 칸이 아니라 내 땅 어디든 갈 수 있다. farm["x,y"]={c 작물,g 자란 날,w 물,e 빈 채로 지난 날}. 예전 저장의 밭은 그대로 옮긴다
  if(!s.farm){
    s.farm={};const n=HOUSES[(s.house||1)-1].plots;
    s.plots.forEach((p,i)=>{if(i<n)s.farm[PLOTS[i].join()]={c:p.c||null,g:p.g||0,w:!!p.w,e:0}});
  }
  if(s.en==null)s.en=100;
  if(!OUTFITS[s.outfit])s.outfit='plain';
  if(!Array.isArray(s.owned))s.owned=['plain'];
  // 연장 단계, 가축 우리(pens[k]={x,y,fed 오늘 먹이,done 다 지음}), 가축(stock), 자리를 고르는 중인 우리(place)
  s.tools=s.tools||{};for(const k of TOOL_IDS)s.tools[k]=s.tools[k]|0;
  s.pens=s.pens||{};s.stock=Array.isArray(s.stock)?s.stock:[];
  if(!PENS[s.place])s.place=null;
  // 스탯(stats)과 저절로 오르는 중인 몫(stx), 남은 점수(sp), 직업(job={k,rank,served 올린 수라상,day 마지막으로 올린 날})
  if(!s.stats){s.stats={};s.sp=Math.max(0,((s.level||1)-1)*2)}
  s.stx=s.stx||{};
  for(const k in STATS){s.stats[k]=s.stats[k]|0;s.stx[k]=+s.stx[k]||0}
  s.sp=s.sp|0;if(!s.job||!JOBS[s.job.k])s.job=null;
  // 왕실의 길(court={rank,done 수련한 횟수,day 마지막 수련한 날,mate 배필 'prince'|'princess'})은 수라간과 따로 간다
  if(!s.court||typeof s.court!=='object')s.court=null;
  // 장날 물건(mkt={day,furn 파는 가구,want 인기 품목,left 남은 개수}). 장날마다 새로 정한다
  if(!s.mkt||typeof s.mkt!=='object')s.mkt=null;
  // 상인의 길(merch={rank,done 안목 겨루기,sold 납품,day,order 오늘 주문})과 내세울 호칭(title: 어느 길의 이름을 쓸지)
  if(!s.merch||typeof s.merch!=='object')s.merch=null;
  if(!['court','cook','merch','mil','civ'].includes(s.title))s.title=null;
  // 무관·문관의 길(mil·civ={rank,done 수련 횟수,day})과 사냥 기록(kills 잡은 짐승, tigers 잡은 범)
  for(const k in TRACKS)if(!s[k]||typeof s[k]!=='object')s[k]=null;
  // 장독대의 독 셋(jars[i]=null 또는 {id 담근 것,d 익기까지 남은 날,good 간이 맞았나})
  if(!Array.isArray(s.jars))s.jars=[];for(let i=0;i<PENS.jang.cap;i++)if(!s.jars[i]||!JARS[s.jars[i].id])s.jars[i]=null;
  s.kills=s.kills|0;s.tigers=s.tigers|0;
  s.festDay=s.festDay|0; // 명절 상을 마지막으로 받은 날
  s.playDay=s.playDay|0;s.playXp=s.playXp|0; // 친구와 놀이로 오늘 얻은 경험치(하루 60까지)
  // 아이·가족: kids[i]={n 이름,sex,born 태어난 날,love 정,gift 돌잡이로 잡은 것(없으면 아직 아기),care·fed 마지막으로 돌본·먹인 날}, baby={due 삼신할머니께 빈 아이가 오는 날}
  s.kids=(Array.isArray(s.kids)?s.kids:[]).filter(k=>k&&typeof k==='object').slice(0,2);
  for(const k of s.kids){k.n=typeof k.n==='string'?k.n.slice(0,6):'';k.sex=k.sex==='f'?'f':'m';k.born=k.born|0;k.love=k.love|0;k.gift=DOL_IDS.includes(k.gift)?k.gift:null;k.care=k.care|0;k.fed=k.fed|0}
  s.baby=s.baby&&typeof s.baby==='object'?{due:s.baby.due|0}:null;
  if(!s.cave||typeof s.cave!=='object')s.cave={max:0};s.cave.max=s.cave.max|0; // 동굴에서 가장 깊이 내려간 층
  // 마을 복구(works[k]={got 넣은 재료,coins 넣은 돈,done})와 내일 날씨(wNext: 솟대가 알려 준다)
  // 혼인: spouse=배필이 된 이웃(혼인할 수 있는 이웃은 NPCS에 wed가 있는 어른들뿐), wedDay=혼례 올린 날
  if(!s.spouse||!NPCS[s.spouse]||!NPCS[s.spouse].wed)s.spouse=null;
  s.works=s.works||{};for(const k in WORKS){const w=s.works[k]=s.works[k]||{};w.got=w.got||{};w.coins=w.coins|0;w.done=w.done?1:0}
  if(s.wNext!=='rain'&&s.wNext!=='sun')s.wNext=Math.random()<.25?'rain':'sun';
  // 날씨 사건(wx: 'rainbow' 무지개·'drought' 가뭄·'wind' 바람), 맑은 날이 이어진 날수(dry), 오늘 밭에 내려앉은 까마귀(crows: [x,y] 목록)
  if(!['rainbow','drought','wind'].includes(s.wx))s.wx=null;s.dry=s.dry|0;if(!Array.isArray(s.crows))s.crows=[];
  // 보물(relics: 찾은 것), 곳마다 파 본 횟수(digs), 오늘의 반짝이는 곳(glints: 날이 바뀌면 rollGlints가 새로 정한다), 오늘 판 동굴 층(caveDug)
  if(!s.relics||typeof s.relics!=='object')s.relics={};for(const k in s.relics)if(!RELICS[k])delete s.relics[k];
  if(!s.digs||typeof s.digs!=='object')s.digs={};
  if(!s.glints||typeof s.glints!=='object'||!Array.isArray(s.glints.town)||!Array.isArray(s.glints.wild)||!Array.isArray(s.glints.sea))s.glints=null;
  if(!s.caveDug||typeof s.caveDug!=='object'||!Array.isArray(s.caveDug.f))s.caveDug=null;
  // 들은 이야기(lore): 예전 저장은 이미 다 보아 온 것이므로 모두 들은 것으로 친다. 새 마을은 빈 채로 시작해 이웃에게 듣는다
  if(!s.lore||typeof s.lore!=='object'){
    const old=(s.day|0)>1||(s.xp|0)>0;s.lore={};
    if(old){s.lore.pal=1;s.lore.gl=1;for(const k of ['cook','court','merch','mil','civ']){s.lore[k]=1;const a=k==='cook'?s.job:k==='court'?s.court:k==='merch'?s.merch:s[k];if(a)s.lore['n'+k]=(a.rank|0)+1}}
  }
  s.dexDone=s.dexDone||{};
  if(!s.dex){s.dex={};for(const k in s.inv)if(!ITEMS[k].seed)s.dex[k]=s.inv[k]}
  return s;
}
// 새 마을. seed가 있으면 그 씨앗으로 마을을 먼저 짓고(처음 밭·나무 수가 마을마다 다르다) 그 위에 상태를 만든다

// 계정 저장: 열어 본 사람만 읽고 쓰는 자기 칸(data/users/<id>/save)에 하루가 끝날 때 등 굵직한 순간에만 쓴다
let cloudDoc=null,cloudBusy=false,cloudAgain=false,cloudSaved=null;
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const doc=db.doc('data/users/'+uid+'/save');
    const snap=await doc.get();
    if(snap.exists){const d=snap.data();if(d&&typeof d.json==='string')cloudSaved=JSON.parse(d.json)}
    cloudDoc=doc;
  }catch(e){cloudDoc=null}
}
async function pushCloud(){
  if(!cloudDoc||!S)return;
  if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;cloudDirty=false;
  try{await cloudDoc.set({json:JSON.stringify(S),ts:S.ts||Date.now(),day:S.day})}
  catch(e){if(!e||e.code!=='unavailable')cloudDoc=null}
  cloudBusy=false;
  if(cloudAgain){cloudAgain=false;pushCloud()}
}
const touch=()=>{dirty=true;cloudDirty=true};
function saveAll(){saveLocal();pushCloud()}

    if(scene==='town'&&S.farm[x+','+y])return{t:'soil',x,y};

  }
  if(mate&&x===mate.x&&y===mate.y)return{t:'npc',id:S.spouse};
  {const kd=kidsIn.find(a=>a.x===x&&a.y===y);if(kd)return{t:'kid',i:kd.i}}

function faceTarget(){
  const fx=P.x+P.dir[0],fy=P.y+P.dir[1];let tg=targetAt(fx,fy);

  // 일직선 앞쪽 네 칸 안에 들짐승이 있으면 물가보다 사냥이 먼저다
  if(!tg||tg.t==='water'){const b=beastInLine();if(b)return{x:b.x,y:b.y,tg:{t:'beast',b}}}
  // 밭 한가운데 남은 빈칸(둘레 세 곳 이상이 밭)에 서 있으면, 옆 밭보다 발밑 빈칸을 먼저 간다
  if(scene==='town'&&(!tg||tg.t==='soil')&&tillable(P.x,P.y)&&soilSides(P.x,P.y)>=3)return{x:P.x,y:P.y,tg:{t:'till',x:P.x,y:P.y}};
  if(tg)return{x:fx,y:fy,tg};

    if(tillable(fx,fy))return{x:fx,y:fy,tg:{t:'till',x:fx,y:fy}};
    if(S.farm[P.x+','+P.y])return{x:P.x,y:P.y,tg:{t:'soil',x:P.x,y:P.y}};
  }

}
// 갈 수 있는 칸: 내 땅의 빈 풀밭이고, 아직 밭이 아니며, 누가 서 있거나 주울 것이 놓여 있지 않다
const tillable=(x,y)=>inFarm(x,y)&&!S.farm[x+','+y]&&!npcOn(x,y)&&!herdOn(x,y)&&!kidOn(x,y)&&!S.pickups.some(p=>p.x===x&&p.y===y);
const soilSides=(x,y)=>DIRS.reduce((a,d)=>a+(S.farm[(x+d[0])+','+(y+d[1])]?1:0),0);

  case 'stock':stockAct(tg.a);break;
  case 'kid':kidMenu(tg.i);break;
  case 'pen':penAct(tg.k);break;
  case 'forge':openForge();break;
  case 'stall':if(tg.k==='peddler')openPeddler();else openBroker();break;
  case 'fest':festTalk();break;
  case 'work':if(workDone(tg.k))workUse(tg.k);else openWork(tg.k);break;
  case 'shoal':startFishing(x,y);if(fishing)fishing.deep=tg;break;
  case 'bed':askSleep();break;
  case 'furn':if(tg.f.id==='agungi'){openCook(true);break}toast(FURN[tg.f.id].n+' · 아늑함 +'+FURN[tg.f.id].c);break;

function interact(){
  if(busy())return;
  if((mg||fishing)&&performance.now()<guardUntil)return; /* 막 시작한 놀이에 연달아 눌린 입력이 들어가지 않게 */
  if(mg){mgPress();return}
  if(fishing){reel();return}
  if(P.t<1)return;
  if(glintHere()>=0){digPress();return} /* 반짝이는 곳 위에 서 있으면 파는 것이 먼저 */
  const f=faceTarget();if(f)act(f.tg,f.x,f.y);
}
function setPath(goal,after){
  const p=findPath(P.x,P.y,goal,true)||findPath(P.x,P.y,goal,false);if(!p)return false;
  P.path=p;P.goal=goal;P.after=after;P.wait=0;return true;
}
const walkThen=(x,y,fn)=>setPath((a,b)=>a===x&&b===y,fn);
const approach=(x,y)=>setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1&&!npcOn(a,b),
  ()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)!==1)return;P.dir=[x-P.x,y-P.y];const t2=targetAt(x,y);if(t2)act(t2,x,y)});
function clickTile(x,y,low){
  if(mg){mgPress();return}
  if(fishing){reel();return}
  if(x===P.x&&y===P.y&&P.t>=1&&glintHere()>=0){digPress();return} /* 서 있는 자리의 반짝이는 곳을 누르면 판다 */
  P.after=null;P.path=[];
  let tg=targetAt(x,y);
  // 지붕이나 나무 윗부분을 눌렀으면 그 건물·나무를 누른 것으로 본다 (주울 것이 놓인 칸은 제외)
  if(!tg&&(scene==='town'||scene==='palace')&&low&&!S.pickups.some(p=>p.x===x&&p.y===y)){const t2=targetAt(x,y+1);if(t2&&(t2.t==='tree'||t2.t==='bld'||t2.t==='pen'||t2.t==='stall'||t2.t==='fest'||t2.t==='work')){tg=t2;y++}}
  if(!tg&&scene==='town'&&tillable(x,y)&&soilSides(x,y)>=3){
    // 밭 한가운데 남은 빈칸을 누르면: 그 위나 바로 옆이면 곧바로 갈고, 멀면 옆까지 걸어가서 간다
    const d=Math.abs(x-P.x)+Math.abs(y-P.y),go=()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)===1){P.dir=[x-P.x,y-P.y];till(x,y)}};
    if(d===0)till(x,y);else if(d===1)go();else setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1,go);
    return;
  }
  if(!tg){if(walkable(x,y))walkThen(x,y,null);return}
  if(tg.t==='beast'){huntClick(tg.b);return}
  if(tg.t==='bld'){const b=tg.b;walkThen(b.door[0],b.door[1],()=>{P.dir=[0,-1];act(tg)});return}
  if(tg.t==='soil'){if(Math.abs(x-P.x)+Math.abs(y-P.y)<=1&&(x!==P.x||y!==P.y)){P.dir=[x-P.x,y-P.y];act(tg,x,y)}else walkThen(x,y,()=>act(tg,x,y));return}
  if(tg.t==='npc')N[tg.id].hold=7;
  if(tg.t==='stock')tg.a.hold=7;
  if(tg.t==='water'&&scene!=='palace'){
    // 물은 한 번 눌러서는 낚싯대를 던지지 않는다(걷다가 물을 잘못 누르기 쉽다).
    // 처음 누르면 물가로 가서 물을 바라보기만 하고, 바라보는 물을 한 번 더 누르면(또는 행동 버튼을 누르면) 던진다
    const adj=Math.abs(x-P.x)+Math.abs(y-P.y)===1;
    if(adj&&P.t>=1&&P.dir[0]===x-P.x&&P.dir[1]===y-P.y){act(tg,x,y);return}
    const look=(wx,wy)=>{P.dir=[wx-P.x,wy-P.y];float('한 번 더 누르면 낚시',(wx+.5)*T,wy*T+6);tip('fish2','물가에서 바라보는 물을 한 번 더 누르거나 행동 버튼을 누르면 낚싯대를 던져요')};
    if(adj){if(P.t>=1)look(x,y);return}
    if(setPath((a,b)=>Math.abs(a-x)+Math.abs(b-y)===1&&!npcOn(a,b),()=>{if(Math.abs(x-P.x)+Math.abs(y-P.y)===1)look(x,y)}))return;
    // 먼 물을 눌렀으면 가장 가까운 물가로 간다

    for(let ty=1;ty<H-1;ty++)for(let tx=1;tx<W-1;tx++){
      if(!walkable(tx,ty))continue;
      for(const [dx,dy] of DIRS){const q=tile[ty+dy][tx+dx];if(q===3||q===4){const d=(tx+dx-x)**2+(ty+dy-y)**2;if(d<bd){bd=d;best=[tx,ty,dx,dy]}}}
    }
    if(best){if(best[0]===P.x&&best[1]===P.y)look(P.x+best[2],P.y+best[3]);else walkThen(best[0],best[1],()=>look(P.x+best[2],P.y+best[3]))}
    return;
  }
  if(approach(x,y))return;
  if(tg.t==='water'){
    // 먼 물을 눌렀으면 가장 가까운 물가로 간다
    let best=null,bd=1e9;
    for(let ty=1;ty<H-1;ty++)for(let tx=1;tx<W-1;tx++){
      if(!walkable(tx,ty))continue;
      for(const [dx,dy] of DIRS){const q=tile[ty+dy][tx+dx];if(q===3||q===4){const d=(tx+dx-x)**2+(ty+dy-y)**2;if(d<bd){bd=d;best=[tx,ty,dx,dy]}}}

  }
}

function updMg(dt){
  if(drops.length){
    for(const d of drops)d.t+=dt*1.7;
    for(const d of drops)if(d.t>=1){S.pickups.push({x:d.x,y:d.y,id:d.id});if(P.x===d.x&&P.y===d.y&&P.t>=1)grab(S.pickups.length-1)}
    drops=drops.filter(d=>d.t<1);
  }
  const m=mg;if(!m)return;
  if(m.kind==='forge'){updForge(m,dt);return}
  if(m.kind==='milk'){updMilk(m,dt);return}
  if(m.kind==='cook'){updCook(m,dt);return}
  if(m.kind==='rite'){updRite(m,dt);return}
  if(m.kind==='haggle'){updHaggle(m,dt);return}
  if(m.kind==='eye'){updEye(m,dt);return}
  if(m.kind==='bow'){updBow(m,dt);return}
  if(m.kind==='study'){updStudy(m,dt);return}
  if(m.kind==='salt'){updSalt(m,dt);return}
  if(m.kind==='dol'){updDol(m,dt);return}
  if(m.kind==='swing'){updSwing(m,dt);return}
  if(m.kind==='catch'){updCatch(m,dt);return}
  if(m.kind==='scoop'){updScoop(m,dt);return}
  if(m.kind==='yut'){updYut(m,dt);return}
  if(m.cool>0){
    m.cool-=dt;
    if(m.cool<=0){m.note='';if(m.fin)mgEnd();else if(m.kind==='mine')m.r=36;else if(m.kind==='chop'){m.zc=rnd(.3,.7);m.pos=Math.random()<.5?0:1;m.dir=m.pos?-1:1}}
    return;
  }
  if(m.kind==='hunt'){
    m.ph+=dt*(2.6+m.i*.9);m.t+=dt;
    if(m.t>4.5){m.b.flee=3;mg=null;toast('머뭇거리는 사이 눈치채고 달아났어요')}
  }else if(m.kind==='build')m.ph+=dt*(2.3+m.i*.4);
  else if(m.kind==='chop'){
    m.pos+=m.dir*(1.25+m.i*.45)*dt;if(m.pos>=1){m.pos=1;m.dir=-1}else if(m.pos<=0){m.pos=0;m.dir=1}
    m.idle+=dt;if(m.idle>6)mgHit(0);
  }else if(m.kind==='mine'){m.r-=(26+m.i*9)*dt;if(m.r<5)mgHit(0)}
  else{m.t+=dt;m.p=Math.max(0,m.p-.22*dt);if(m.t>7)mgEnd()}
}

function plant(k,seed){
  const p=S.farm[k],xy=k.split(',');if(!p||p.c)return;
  gain(seed,-1);p.c=ITEMS[seed].seed;p.g=0;p.e=0;p.w=S.weather==='rain';
  float(ITEMS[seed].n+' 심기',(+xy[0]+.5)*T,xy[1]*T);sfx('pick');touch();
}
function till(x,y){
  if(!inFarm(x,y)||S.farm[x+','+y])return;
  // 괭이를 벼릴수록 바라보는 쪽으로 여러 칸을 한 번에 간다. 다 자란 소가 있으면 기력이 덜 든다
  const dx=Math.sign(x-P.x),dy=Math.sign(y-P.y),n=[1,2,3,5][tl('hoe')],ox=hasOx();
  if(!useEn(ox?1:3))return;
  let made=0;
  for(let i=0;i<n;i++){
    const a=x+dx*i,b=y+dy*i,k=a+','+b;
    if(S.farm[k])continue;
    if(!inFarm(a,b)||npcOn(a,b)||herdOn(a,b)||S.pickups.some(p=>p.x===a&&p.y===b))break;
    S.farm[k]={c:null,g:0,w:S.weather==='rain',e:0};made++;
    if(!dx&&!dy)break;
  }
  float(made>1?'밭 '+made+'칸 갈기':'밭 갈기',(x+.5)*T,y*T);sfx('chop');addXp(Math.max(1,made));touch();
  tip('till','간 밭에 씨앗을 심어요. 나흘 동안 비워 두면 다시 풀밭이 돼요');
  if(ox)tip('ox','소가 쟁기를 끌어 줘서 밭 갈기가 한결 수월해요 (기력 1)');
}
function soilAct(x,y){
  const i=x+','+y,p=S.farm[i],fx=(x+.5)*T,fy=y*T;if(!p)return;
  if(!p.c){
    const all=Object.keys(S.inv).filter(k=>ITEMS[k].seed),seeds=all.filter(k=>CROPS[ITEMS[k].seed].s.includes(season()));
    if(!all.length){toast('씨앗이 없어요. 잡화점에서 살 수 있어요');return}
    if(!seeds.length){toast(season()===3?'겨울에는 밭이 얼어서 심을 수 없어요':'지금 계절에 심을 수 있는 씨앗이 없어요');return}
    if(seeds.length===1)plant(i,seeds[0]);else openSeeds(i,seeds);
    return;
  }
  const d=CROPS[p.c].days;
  if(p.g>=d){
    const n=perk('dami')&&Math.random()<.35?2:1;
    gain(p.c,n);addXp(CROPS[p.c].xp);float('+'+n+' '+ITEMS[p.c].n,fx,fy);sfx('pick');p.c=null;p.g=0;p.w=false;return;
  }
  if(!CROPS[p.c].s.includes(season())){toast('제철이 지나 자라지 않아요. '+seasonNames(CROPS[p.c].s)+'이 오면 다시 자라요');return}
  // 물뿌리개를 벼릴수록 둘레의 밭까지 한꺼번에 적신다 (1칸 → 십자 5칸 → 9칸 → 25칸)
  const lv=tl('can'),r=lv>=3?2:1,wet=[];
  for(let b=-r;b<=r;b++)for(let a=-r;a<=r;a++){
    if(lv===0&&(a||b))continue;if(lv===1&&a&&b)continue;
    const q=S.farm[(x+a)+','+(y+b)];if(q&&q.c&&!q.w)wet.push(q);
  }
  if(!wet.length){toast('오늘은 물을 충분히 줬어요. '+(d-p.g)+'일 뒤면 다 자라요');return}
  if(!useEn(workDone('well')?0:S.wx==='drought'?2:1))return; // 우물이 서면 물 긷는 품이 들지 않는다. 가뭄 든 날은 두 배로 든다
  for(const q of wet)q.w=true;touch();float(wet.length>1?'물 주기 ×'+wet.length:'물 주기',fx,fy);sfx('water');
}
function startFishing(x,y){
  // 찌는 바라보는 쪽으로 물이 이어지는 만큼, 최대 세 칸(낚싯대를 벼리면 여섯 칸까지) 멀리 날아간다
  if(scene==='palace'){toast('궁궐 연못에서는 낚시를 할 수 없어요. 잉어가 한가롭게 헤엄쳐요');return}
  const dx=Math.sign(x-P.x),dy=Math.sign(y-P.y);let bx=x,by=y;
  for(let i=0;i<2+tl('rod');i++){const nx=bx+dx,ny=by+dy;if(nx<0||ny<0||nx>=W||ny>=H)break;const q=tile[ny][nx];if(q!==3&&q!==4)break;bx=nx;by=ny}
  if(!useEn(2))return;
  fishing={bx,by,sea:tile[by][bx]===4,phase:'cast',t:.5};P.path=[];P.after=null;sfx('cast');
}
// 낚시: 기다림 → 입질(느낌표에 맞춰 챔) → 줄 당기기(잔잔할 때 연타, 물이 튀면 멈춤)
function fishTable(sea){const t=FISH[sea?'sea':'fresh'].slice(),sf=SFISH[season()];if(sf[1]===!!sea)t.push([sf[0],20,sf[2]]);return t}
function updFishing(dt){
  const f=fishing;if(!f)return;
  if(f.phase==='reel'){
    f.idle+=dt;if(f.idle>4.5){fishing=null;toast('머뭇거리는 사이 물고기가 달아났어요');return}
    f.t-=dt;if(f.t>0)return;
    if(f.thr===0){f.thr=1;f.t=.34}
    else if(f.thr===1){f.thr=2;f.t=rnd(.7,1.2)+f.hard*.15;sfx('bite')}
    else{f.thr=0;f.t=Math.max(.7,rnd(1.1,2)-f.hard*.2);f.tension=Math.max(0,f.tension-1)}
    return;
  }
  f.t-=dt;if(f.t>0)return;
  if(f.phase==='cast'){f.phase='wait';f.t=rnd(1.6,4.8)*(S.weather==='rain'?.6:1);sfx('water')}
  else if(f.phase==='wait'){f.phase='bite';f.t=.9;sfx('bite')}
  else{fishing=null;toast('앗, 놓쳤어요…')}
}
function reel(){
  const f=fishing;if(!f||f.phase==='cast')return;
  if(f.phase==='wait'){fishing=null;toast('너무 빨리 당겼어요. 느낌표가 뜰 때 당겨요');return}
  if(f.phase==='bite'){
    const tb=f.deep?DEEPFISH:fishTable(f.sea);let tot=0;
    const w=tb.map(e=>{const v=e[1]*(e[2]>=15&&perk('parang')?2:1);tot+=v;return v});
    let r=Math.random()*tot,k=0;while(k<tb.length-1&&r>w[k]){r-=w[k];k++}
    const hard=tb[k][2]>=15?2:tb[k][2]>=8?1:0;
    Object.assign(f,{phase:'reel',fish:tb[k],hard,prog:0,need:Math.max(4,[6,9,13][hard]-tl('rod')),tension:0,thr:0,t:rnd(1,1.8),idle:0});
    sfx('pick');tip('reel','물이 잔잔할 때 연타로 당기고, 물이 튀면 멈춰요');return;
  }
  f.idle=0;
  if(f.thr===2){f.tension++;sfx('err');if(f.tension>=(tl('rod')>=3?3:2)){fishing=null;toast('줄이 끊어졌어요… 물이 튈 땐 멈춰야 해요')}return}
  f.prog++;sfx('cast');
  if(f.prog>=f.need){
    const it=f.fish;gain(it[0],1);addXp(it[2]);float('+1 '+ITEMS[it[0]].n);sfx(f.hard===2?'level':'pick');
    if(f.deep&&--f.deep.left<=0){SEA.objAt[f.deep.y][f.deep.x]=null;toast('물고기 떼가 흩어졌어요')}
    if(f.hard===2)toast('대물이다! '+jo(ITEMS[it[0]].n,'을','를')+' 낚았어요');
    fishing=null;
  }
}

  for(let i=0,g=0;i<S.wild&&g<300;g++){

    const k=Math.random()<.14?'deer':pick(kinds);
    beasts.push({k,x,y,fx:x,fy:y,t:1,dir:[1,0],wait:rnd(1,4),hp:BEASTS[k].hp,flee:0,stun:0,calm:0});i++;

  const a=[],put=id=>{const [x,y]=pick(WILD.GRASS);if(x>4&&!a.some(p=>p.x===x&&p.y===y))a.push({x,y,id})};
  for(let i=0;i<4;i++)put('mushroom');for(let i=0;i<3;i++)put('branch');
  if(season()===2)for(let i=0;i<3;i++)put('chestnut');
  if(Math.random()<.6)put('ginseng');
  return a;
}
function spawnWild(){
  if(wildBeasts){beasts=wildBeasts;return}
  beasts=[];const sea=season(),kinds=['rabbit','rabbit','boar','boar','deer','pheasant'].filter(k=>k!=='pheasant'||sea>=2),far=GRASS.filter(q=>q[0]>9);
  for(let i=0,g=0;i<S.wildN&&g<400;g++){
    const [x,y]=pick(far);if(beasts.some(b=>b.x===x&&b.y===y))continue;
    const k=i===0&&S.wildN>=6?'tiger':pick(kinds);
    beasts.push({k,x,y,fx:x,fy:y,t:1,dir:[1,0],wait:rnd(1,4),hp:BEASTS[k].hp,flee:0,stun:0,calm:0,bite:0});i++;

function takeIngr(id){

  for(const k in need){
    if(k!=='fish'){gain(k,-need[k]);continue}
    // 물고기는 가장 값싼 것부터 쓴다
    for(let n=need[k];n>0;n--){const f=Object.keys(FISHLOOK).filter(q=>have(q)).sort((a,b)=>ITEMS[a].p-ITEMS[b].p)[0];if(f)gain(f,-1)}
  }

const hasNeed=need=>Object.keys(need).every(k=>(k==='fish'?fishCount():have(k))>=need[k]);

function startSalt(id,slot){

// 요리: 행동으로 부채질해 불을 키운다. 바늘이 알맞은 불(초록 띠) 안에 머무는 동안 익고, 띠 위로 넘기면 탄다
function startCook(id,exam){

  mg={kind:'cook',o:{x:P.x,y:P.y,sh:0},dish:id,exam:!!exam,heat:.25,ph:rnd(0,6),prog:0,burn:0,t:0,note:'',cool:0,fin:false,ok:false,end:0};P.path=[];P.after=null;N.yeon.hold=40;

}
const cookBand=m=>({c:.5+.2*Math.sin(m.ph+m.t*1.15),hw:(.12+sv('cook')*.004+(perk('yeon')?.03:0))*(m.exam?.8:1)});
function cookPress(m){if(m.fin)return;m.heat=Math.min(1,m.heat+.13);sfx('cast')}
function updCook(m,dt){
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  m.t+=dt;m.heat=Math.max(0,m.heat-dt*.3);
  const b=cookBand(m);
  if(Math.abs(m.heat-b.c)<=b.hw)m.prog+=dt/5;else if(m.heat>b.c+b.hw)m.burn+=dt/2.4;
  if(m.prog>=1){m.fin=true;m.ok=!m.exam||m.burn<.34;m.end=.5;m.note=m.ok?'다 됐어요!':'불이 자주 넘쳤어요'}
  else if(m.burn>=1){m.fin=true;m.ok=false;m.burnt=true;m.end=.6;m.note='탔어요…'}
  else if(m.t>30){m.fin=true;m.ok=false;m.end=.4;m.note='불이 약해 설익었어요'}
}

let cave=null;
function genCave(f){
  const rng=mulberry(S.day*131+f*977),tile=[],objAt=[],ROCKS=[],X0=9,X1=26,Y0=7,Y1=18;
  for(let y=0;y<H;y++){tile.push(new Array(W).fill(9));objAt.push(new Array(W).fill(null))}
  // 네모난 굴의 가장자리를 들쭉날쭉하게 깎는다 (모서리는 늘 벽)
  for(let y=Y0;y<=Y1;y++)for(let x=X0;x<=X1;x++){
    const ex=x===X0||x===X1,ey=y===Y0||y===Y1;
    if((ex&&ey)||((ex||ey)&&rng()<.45))continue;
    tile[y][x]=10;
  }
  // 들어온 자리: 왼쪽 벽에 올라가는 사다리가 걸려 있고, 그 앞은 늘 비어 있다
  const sy=Math.floor((Y0+Y1)/2),sp=[X0+1,sy],up=[X0,sy];
  tile[sy][X0]=9;objAt[sy][X0]={t:'ladder',x:X0,y:sy};
  for(let dy=-1;dy<=1;dy++)for(let dx=0;dx<=1;dx++)tile[sy+dy][X0+1+dx]=10;
  const cells=[];
  for(let y=Y0;y<=Y1;y++)for(let x=X0;x<=X1;x++)if(tile[y][x]===10&&!(x<=X0+2&&Math.abs(y-sy)<=1))cells.push([x,y]);
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  // 바닥의 42%쯤이 바위, 그 가운데 다섯에 하나쯤이 광맥
  const table=CAVE_ORE(f),n=Math.floor(cells.length*.42),veinP=.18+Math.floor((f-1)/5)*.03;
  for(let i=0;i<n;i++){
    const [x,y]=cells[i];let ore=null;
    if(rng()<veinP){const r=rng();ore=table.find(q=>r<q[1])[0]}
    const o={t:'crock',x,y,sh:0,ore};ROCKS.push(o);objAt[y][x]=o;
  }
  // 내려가는 사다리는 굴 안쪽(오른쪽) 맨바위 하나 밑에 숨긴다
  const far=ROCKS.filter(o=>!o.ore&&o.x>X0+7),h=(far.length?far:ROCKS)[Math.floor(rng()*(far.length||ROCKS.length))];
  cave={floor:f,map:{tile,objAt,TREES:[],ROCKS,GRASS:[],SAND:[]},sp,up,hid:[h.x,h.y],found:false};
  // 반짝이는 곳: 다섯 층에 두 층꼴로, 바위가 없는 바닥 한 칸. 깊을수록 보물이 묻혀 있기 쉽다. 오늘 이미 판 층에는 없다 (층 모양을 정하는 rng와는 따로 굴린다)
  const g2=mulberry(S.day*53+f*211+7),open=cells.slice(n);
  cave.glint=g2()<.4&&open.length&&!(S.caveDug&&S.caveDug.day===S.day&&S.caveDug.f.includes(f))?open[Math.floor(g2()*open.length)].slice():null;
}

function startRite(ex,mate){
  if(!useEn(3))return;
  mg={kind:'rite',o:{x:P.x,y:P.y,sh:0},rounds:COURT.rounds[ex],maxMiss:ex?1:2,exam:ex,mate,r:0,seq:[],i:0,t:0,k:-1,miss:0,flash:0,lit:-1,nt:0,note:'',cool:0,fin:false,ok:false,end:0};
  riteRound(mg);P.path=[];P.after=null;keys.length=0;N.queen.hold=90;
  tip('rite','동작의 차례를 잘 본 뒤, 방향키나 화면의 화살표로 그대로 따라 해요. 그만두려면 Esc');
}
function riteRound(m){
  m.seq=[];
  for(let i=0;i<m.rounds[m.r];i++){let d=Math.floor(Math.random()*4);if(i&&d===m.seq[i-1]&&Math.random()<.7)d=(d+1+Math.floor(Math.random()*3))%4;m.seq.push(d)}
  m.phase='show';m.t=-.8;m.k=-1;m.i=0;
}
const ritePad=()=>{const py=(ry(P)+.9)*T;let cy=py-116;if(cy-74<cam.y)cy=py+78;return{cx:(rx(P)+.5)*T,cy}};
function ritePress(d){
  const m=mg;if(!m||m.kind!=='rite'||m.fin||m.phase!=='input'||d<0||d>3)return;
  m.flash=.2;m.lit=d;m.t=0;
  if(d===m.seq[m.i]){
    sfx('n'+d);m.i++;if(m.i<m.seq.length)return;
    m.r++;
    if(m.r>=m.rounds.length){m.fin=true;m.ok=true;m.end=.7;m.note='흐트러짐 없이 해냈어요!';return}
    riteRound(m);m.note='좋아요! 다음 차례';m.nt=.8;
  }else{
    sfx('err');m.miss++;
    if(m.miss>m.maxMiss){m.fin=true;m.ok=false;m.end=.7;m.note='예법이 흐트러졌어요';return}
    m.phase='show';m.t=-.9;m.k=-1;m.i=0;m.note='틀렸어요. 다시 잘 보세요';m.nt=.9;
  }
}
function riteClick(wx,wy){
  const p=ritePad();
  for(let d=0;d<4;d++)if(Math.hypot(wx-(p.cx+DIRS[d][0]*32),wy-(p.cy+DIRS[d][1]*32))<=19){ritePress(d);return}
}
function updRite(m,dt){
  if(m.fin){m.end-=dt;if(m.end<=0)mgEnd();return}
  if(m.flash>0)m.flash-=dt;
  if(m.nt>0){m.nt-=dt;if(m.nt<=0)m.note=''}
  m.t+=dt;
  if(m.phase==='show'){
    // 한 동작에 0.6초(켜짐 0.42초). 다 보여 주고 나면 따라 할 차례가 된다
    const k=Math.floor(m.t/.6);
    if(m.t>=0&&k!==m.k&&k<m.seq.length){m.k=k;sfx('n'+m.seq[k])}
    if(m.t>=m.seq.length*.6+.15){m.phase='input';m.i=0;m.t=0}
  }else if(m.t>10){m.fin=true;m.ok=false;m.end=.5;m.note='머뭇거리다 흐트러졌어요'}
}

function updBeasts(dt){
  if(scene==='home')return;
  for(const b of beasts){
    const tiger=b.k==='tiger';
    if(b.t<1){b.t=Math.min(1,b.t+dt*(b.flee>0?4.2:tiger?2.7:1.6));if(b.t>=1){b.fx=b.x;b.fy=b.y}continue}
    if(b.stun>0){b.stun-=dt;continue}
    if(mg&&mg.kind==='hunt'&&mg.b===b)continue;
    if(b.flee>0)b.flee-=dt;if(b.calm>0)b.calm-=dt;
    const dist=Math.abs(b.x-P.x)+Math.abs(b.y-P.y);
    // 범은 달아나지 않고 다가와 덮친다. 다른 짐승은 두 칸 안으로 다가가면 달아난다
    if(tiger){if(b.bite>0)b.bite-=dt;if(dist===1&&b.bite<=0&&b.flee<=0){b.bite=2.5;const hurt=relic('c_claw')?9:18;S.en=Math.max(0,S.en-hurt);hud();sfx('err');toast('범이 덮쳤어요! 기력이 '+hurt+' 줄었어요')}}
    else if(dist<=(relic('c_bell')?1:2))b.flee=Math.max(b.flee,1.2);
    const chase=tiger&&b.flee<=0&&dist>1&&dist<=6;
    if(b.flee<=0&&!chase){b.wait-=dt;if(b.wait>0||b.calm>0)continue;b.wait=rnd(1.5,5)}
    // 길과 다리는 넘지 않는다
    const opts=DIRS.filter(([dx,dy])=>{const x=b.x+dx,y=b.y+dy;return walkable(x,y)&&tile[y][x]!==1&&tile[y][x]!==5&&!npcOn(x,y)&&!beastOn(x,y)&&!herdOn(x,y)&&!(x===P.x&&y===P.y)});
    if(!opts.length)continue;
    const far=([dx,dy])=>Math.abs(b.x+dx-P.x)+Math.abs(b.y+dy-P.y);
    const [dx,dy]=b.flee>0?opts.reduce((a,o)=>far(o)>far(a)?o:a):chase?opts.reduce((a,o)=>far(o)<far(a)?o:a):pick(opts);
    b.dir=[dx,dy];b.fx=b.x;b.fy=b.y;b.x+=dx;b.y+=dy;b.t=0;
  }
}

// 우리 자리 고르기: 내 땅의 빈 풀밭에 나란히 w칸. 지어서 길이 끊기는 자리는 안 된다
function reach(block){
  const seen=new Set([P.x+','+P.y]),q=[[P.x,P.y]];
  while(q.length){const [x,y]=q.pop();for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy,k=nx+','+ny;if(seen.has(k)||!walkable(nx,ny)||(block&&block.has(k)))continue;seen.add(k);q.push([nx,ny])}}
  return seen;
}

function placeClick(x,y){
  const k=S.place;if(!k||scene!=='town')return;
  const w=PENS[k].w,x0=x-(w>>1),old=S.pens[k],cells=[];
  if(old){delete S.pens[k];applyPens()}
  const back=msg=>{if(old){S.pens[k]=old;applyPens()}toast(msg);sfx('err')};
  for(let i=0;i<w;i++)cells.push([x0+i,y]);
  if(cells.some(([a,b])=>!inFarm(a,b)||S.farm[a+','+b]||npcOn(a,b)||(a===P.x&&b===P.y))){back('여기에는 지을 수 없어요. 내 땅의 빈 풀밭 '+w+'칸이 나란히 필요해요');return}
  if(!cells.some(([a,b])=>walkable(a,b+1))){back('우리 앞쪽(아래 칸)이 비어 있어야 해요');return}
  const base=reach(null),block=new Set(cells.map(q=>q.join())),after=reach(block);
  if(!cells.every(q=>base.has(q.join()))||after.size!==base.size-w){back('길이 막혀서 여기에는 지을 수 없어요');return}
  S.pens[k]=old?Object.assign(old,{x:x0,y}):{x:x0,y,fed:false,done:0};S.place=null;placing=false;applyPens();
  for(const [a,b] of cells){let i;while((i=S.pickups.findIndex(p=>p.x===a&&p.y===b))>=0)grab(i)}
  spawnHerd();sfx('chop');syncPlace();

// 집 안의 자리(요람·아이)와 마당의 아이를 지금 상황에 맞게 다시 놓는다
function syncKids(){
  kidsIn=[];if(!S)return;
  if(scene==='home'&&!decoMode){
    const e=roomEntry(),taken=new Set();if(mate)taken.add(mate.x+','+mate.y);
    S.kids.forEach((k,i)=>{
      if(k.gift&&!kidsInside())return;
      let best=null,bd=1e9;const tx=k.gift?3:1,ty=2;
      for(const key of roomSet()){
        const q=key.split(','),x=+q[0],y=+q[1];
        if((x===0&&y<2)||(x===1&&y===1)||(x===e[0]&&y===e[1])||(x===P.x&&y===P.y)||furnAt(x,y)||taken.has(key))continue;
        const dd=Math.abs(x-tx)+Math.abs(y-ty)+i*.1;if(dd<bd){bd=dd;best={i,x,y}}
      }
      if(best){kidsIn.push(best);taken.add(best.x+','+best.y)}
    });
  }
  const out=scene==='town'&&!kidsInside();
  kidsOut=kidsOut.filter(a=>out&&S.kids[a.i]&&S.kids[a.i].gift);
  if(out)S.kids.forEach((k,i)=>{
    if(!k.gift||kidsOut.some(a=>a.i===i))return;
    const d=BLD[0].door,opts=[];
    for(let y=d[1];y<=d[1]+4;y++)for(let x=d[0]-4;x<=d[0]+4;x++)
      if(kidYard(x,y)&&!(x===P.x&&y===P.y)&&!kidOn(x,y)&&!herdOn(x,y)&&!npcOn(x,y)&&!beastOn(x,y)&&!S.pickups.some(q=>q.x===x&&q.y===y))opts.push([x,y]);
    if(!opts.length)return;
    const [x,y]=pick(opts);kidsOut.push({i,x,y,fx:x,fy:y,t:1,dir:[0,1],wait:rnd(.5,2),hold:0});
  });
}
function updKids(dt){
  const key=scene+'|'+(decoMode?1:0)+(kidsInside()?1:0)+(mate?1:0)+'|'+S.kids.map(k=>k.gift?1:0).join('');
  if(key!==kidKey){kidKey=key;syncKids()}
  if(scene!=='town')return;
  for(const a of kidsOut){
    if(a.t<1){a.t=Math.min(1,a.t+dt*3.2);if(a.t>=1){a.fx=a.x;a.fy=a.y}continue}
    if(a.hold>0){a.hold-=dt;continue}
    a.wait-=dt;if(a.wait>0)continue;a.wait=rnd(.6,2.8);
    const [dx,dy]=pick(DIRS),nx=a.x+dx,ny=a.y+dy;
    if(!kidYard(nx,ny)||kidOn(nx,ny)||herdOn(nx,ny)||npcOn(nx,ny)||beastOn(nx,ny)||peerAt(nx,ny)||(nx===P.x&&ny===P.y)||S.pickups.some(q=>q.x===nx&&q.y===ny))continue;
    a.dir=[dx,dy];a.fx=a.x;a.fy=a.y;a.x=nx;a.y=ny;a.t=0;
  }
}

  if(S.kids.length>=2){say('두 아이만으로도 집이 꽉 찬 것 같아요. 잘 키워 봐요.');return}

    if(S.baby||have('miyeok')<2||S.coins<200)return;
    gain('miyeok',-2);addCoins(-200);S.baby={due:S.day+3};addFriend(id,10);sfx('heart');saveAll();
    say('(정화수를 떠 놓고 둘이 함께 빌었어요. 사흘 뒤 아침에 삼신할머니가 아이를 점지해 주실 거예요.)');

function kidsMorning(msgs){
  let born=-1;const pid=partner();
  if(S.baby&&S.day>=S.baby.due){
    S.baby=null;
    if(S.kids.length<2){
      S.kids.push({n:'',sex:Math.random()<.5?'f':'m',born:S.day,love:0,gift:null,care:0,fed:0});born=S.kids.length-1;sfx('level');
      msgs.push('삼신할머니가 아이를 점지해 주셨어요! 집에 아기가 왔어요'+(pid?' · '+jo(NPCS[pid].name,'이','가')+' 기뻐서 어쩔 줄 몰라요':''));
    }
  }
  for(const k of S.kids){
    const age=kidAge(k),h=kidHearts(k),nm=kidNm(k);
    if(!k.gift){if(age===7)msgs.push('오늘은 '+nm+'의 돌이에요. 집에서 아이에게 말을 걸어 돌잡이를 해요');continue}
    if(k.gift==='thread'||Math.random()>.3+h*.12)continue;
    if(k.gift==='brush'){const x=10+h*3;addXp(x);msgs.push(jo(nm,'이','가')+' 서당에서 배운 글을 들려줬어요 · 경험치 +'+x)}
    else if(k.gift==='coin'){const n=20+h*10;S.coins+=n;msgs.push(jo(nm,'이','가')+' 심부름으로 번 '+n+'냥을 내밀어요')}
    else{const it=pick(k.gift==='bow'?['meat','feather','chestnut','mushroom','wood']:['yeot','bread','h_bam','apple','persimmon']);gain(it,1);msgs.push(jo(nm,'이','가')+' '+jo(ITEMS[it].n,'을','를')+(k.gift==='bow'?' 주워 왔어요':' 얻어 왔어요'))}
  }
  return born;
}

// (계정 없이 쓰는 공개 숫자 세기 서비스). 이름이나 마을 내용은 보내지 않고 숫자만 오른다. 주소 끝에 #stats를 붙여 열면 그 숫자를 보여 준다
const CNT_URL='https://abacus.jasoncameron.dev',CNT_NS='dv-9c41e7a2b6',CNT_KEY='doran-village-seen';
const cntDay=off=>{const d=new Date(Date.now()-(off||0)*864e5);return 'd'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')};
const cntOn=()=>!(window.claude&&window.claude.use)&&/^https?:$/.test(location.protocol)&&!/^(localhost|127\.|\[::1\])/.test(location.hostname);
function countMe(){
  if(!cntOn())return;
  let seen={};try{seen=JSON.parse(localStorage.getItem(CNT_KEY)||'{}')||{}}catch(e){}
  const day=cntDay(),hit=k=>{try{fetch(CNT_URL+'/hit/'+CNT_NS+'/'+k,{credentials:'omit',cache:'no-store'}).catch(()=>{})}catch(e){}};
  if(!seen.all){seen.all=1;hit('all')}
  if(seen.day!==day){seen.day=day;hit(day)}
  try{localStorage.setItem(CNT_KEY,JSON.stringify(seen))}catch(e){}
}
function openStats(){
  const get=k=>fetch(CNT_URL+'/get/'+CNT_NS+'/'+k,{credentials:'omit',cache:'no-store'}).then(r=>r.ok?r.json():{value:0}).then(j=>(j&&j.value)|0).catch(()=>null);
  openModal('하는 사람 수',body=>{
    const p=el('p','note','세는 중이에요…');body.appendChild(p);
    const days=[0,1,2,3,4,5,6].map(cntDay);
    Promise.all([get('all')].concat(days.map(get))).then(v=>{
      if(v[0]===null){p.textContent='숫자를 가져오지 못했어요. 인터넷 연결을 확인하거나 잠시 뒤에 다시 열어 주세요.';return}
      p.textContent='지금까지 이 주소에서 게임을 시작한 브라우저는 '+v[0]+'곳이에요.';
      days.forEach((d,i)=>row(body,el('span','badge',String(v[i+1]|0)),(i?i+'일 전':'오늘')+' · '+(+d.slice(5,7))+'월 '+(+d.slice(7))+'일',['그날 게임을 켠 브라우저 '+(v[i+1]|0)+'곳'],[]));
      body.appendChild(el('p','note','사람이 아니라 브라우저를 세요. 같은 사람이 폰과 PC로 하면 둘로 세고, 시크릿 창은 열 때마다 새로 세요. 지금 같은 방에 있는 사람 수는 "같이 하기" 창에 나와요.'));
    });
  });
}
function talk(id){
  const d=NPCS[id],st=S.npcs[id],n=N[id];
  n.hold=1;n.dir=[Math.sign(P.x-n.x),Math.sign(P.y-n.y)];if(n.dir[0]&&n.dir[1])n.dir[1]=0;
  sfx('talk');
  if(!st.talk){st.talk=true;addFriend(id,8);addXp(2);train('grace',1)}
  const h=hearts(id);let text;
  if(h>=2&&!st.m2){
    st.m2=true;sfx('heart');
    if(FURN['g_'+id]){S.furn['g_'+id]=(S.furn['g_'+id]||0)+1;text=d.m2+'\n('+FURN['g_'+id].n+' 가구를 받았어요. 집 안에서 꾸미기로 놓을 수 있어요.)'}
    else{addCoins(200);text=d.m2+'\n(200냥을 받았어요.)'}
  }
  else if(h>=3&&!st.m3){st.m3=true;text=d.m3+'\n(친한 사이 혜택: '+d.perk+')';sfx('heart')}
  else if(h>=5&&!st.m5){st.m5=true;addCoins(500);text=d.m5+'\n(500냥을 받았어요.)';sfx('heart')}
  else if(rumorOf(id)){const ru=rumorOf(id);text=ru[3];hear(ru[0])} /* 때가 된 소문이 있으면 이번 말은 그 이야기 */
  else text=S.spouse===id&&Math.random()<.7?pick(d.wed.lines):S.weather==='rain'&&Math.random()<.35?d.rain:S.min>=1200&&Math.random()<.4?d.night:pick(d.lines[h>=4?2:h>=2?1:0]);
  touch();
  const ch=[],q=S.quests.find(q=>q.npc===id&&!q.done);
  if(q)ch.push(['부탁 듣기',()=>questTalk(id,q)]);
  ch.push(['선물하기',()=>openGift(id)]);
  if(id==='moru'){ch.push(['짓기·고치기',buildTalk]);ch.push(['연장 벼리기',openForge])}
  if(id==='yeon')ch.push(['수라간 일',kitchenTalk]);
  if(id==='queen')ch.push(['궁중 일',courtTalk]);
  if(id==='eunha')ch.push(['장사 일',tradeTalk]);
  if(id==='mujin')ch.push(['무예 일',()=>trackTalk('mil')]);
  if(id==='hun')ch.push(['글공부',()=>trackTalk('civ')]);
  // 혼인할 수 있는 이웃과 ♥4가 되면 청혼할 수 있다
  if(d.wed&&!S.spouse&&h>=4)ch.push(['청혼하기',()=>propose(id)]);
  if(id===partner()&&S.kids.length<2)ch.push(['아이 이야기',()=>kidTalk(id)]);
  ch.push(['또 봐요',null]);
  dialog({npc:id,who:d.name,role:(S.spouse===id?'내 배필 · ':'')+d.role+' · ♥'+h,text,choices:ch});
}
function questTalk(id,q){
  const d=NPCS[id],it=ITEMS[q.item],ask=d.ask.replace('{item}',it.n).replace('{n}',q.n);
  if(have(q.item)<q.n){dialog({npc:id,who:d.name,text:ask+'\n(가진 '+it.n+' '+have(q.item)+'/'+q.n+'개 · 사례 '+q.coin+'냥)'});return}
  dialog({npc:id,who:d.name,text:ask+'\n(가진 '+it.n+' '+have(q.item)+'개 · 사례 '+q.coin+'냥)',choices:[['건네주기',()=>{
    gain(q.item,-q.n);q.done=true;addCoins(q.coin);addXp(30);addFriend(id,25);N[id].emo={k:'♥',t:2.5};sfx('coin');
    dialog({npc:id,who:d.name,text:d.thanks+'\n('+q.coin+'냥을 받았어요.)'});
  }],['나중에요',null]]});
}

function give(id,k){
  const d=NPCS[id],st=S.npcs[id];
  // 정성껏 지은 음식은 누구나 반긴다
  const r=d.loves.includes(k)?'love':d.likes.includes(k)||ITEMS[k].dish||ITEMS[k].jar?'like':d.hates.includes(k)?'hate':'ok';
  gain(k,-1);st.gift=true;S.known[id][k]=r;if(r==='love'||r==='like')train('grace',r==='love'?2:1);
  addFriend(id,{love:30,like:15,ok:6,hate:-5}[r]);addXp(5);
  if(r!=='hate'){N[id].emo={k:'♥',t:2.5};sfx('heart')}else sfx('err');
  dialog({npc:id,who:d.name,text:d.gift[r]});
}
const won=n=>n.toLocaleString('ko-KR')+'냥';
const houseCost=L=>Math.round(HOUSES[L-1].cost*(perk('moru')?.85:1));
function houseTalk(){
  const d=NPCS.moru,say=(text,choices)=>dialog({npc:'moru',who:d.name,text,choices});
  if(S.build){say('지금 한창 짓는 중일세. 내일 아침이면 다 돼 있을 걸세.');return}
  if(S.diy){say('자네가 직접 짓는 중 아닌가. 집 문 앞에서 이어서 지으면 되네. ('+S.diy.step+'/3 단계)');return}
  if(S.house>=HOUSES.length){say('자네 집은 이미 이 마을에서 제일가는 집이야. 더 손댈 데가 없구먼.');return}
  const L=S.house+1,h=HOUSES[L-1],cost=houseCost(L);
  const need=h.n+' · '+won(cost)+', 나무 '+h.wood+'개'+(h.stone?', 돌 '+h.stone+'개':'');
  const mine='(가진 것: '+won(S.coins)+', 나무 '+have('wood')+'개, 돌 '+have('stone')+'개)';
  // 맡기면 제값에 다음 날 완성, 직접 지으면 반값에 내 손으로 세 단계
  const half=Math.round(cost/2),mats=have('wood')>=h.wood&&have('stone')>=h.stone;
  if(!mats||S.coins<half){say('다음 집은 이걸세.\n'+need+'\n자네가 직접 지으면 값은 절반('+won(half)+')만 받겠네. 다 모이면 다시 오게.\n'+mine);return}
  const pay=(c,fn)=>()=>{addCoins(-c);gain('wood',-h.wood);if(h.stone)gain('stone',-h.stone);addFriend('moru',10);sfx('coin');fn();saveAll()};
  const ch=[];
  if(S.coins>=cost)ch.push(['맡길게요',pay(cost,()=>{S.build=L;say('좋아, 맡겨 두게! 하룻밤 자고 나면 새 집이 서 있을 걸세.')})]);
  ch.push(['직접 지을게요',pay(half,()=>{S.diy={L,step:0};say('허허, 좋은 생각이야! 재료는 집 앞에 가져다 두겠네.\n집 문 앞에서 못질 세 단계를 마치면 완성일세.')})]);
  ch.push(['좀 더 생각해 볼게요',null]);
  say('다음 집은 이걸세.\n'+need+'\n맡기면 내일 아침에 완성이고, 직접 지으면 값이 절반('+won(half)+')일세.\n'+mine,ch);
}

function openModal(title,build){
  const b=$('mBody'),keep=!$('modal').hidden&&$('mTitle').textContent===title?b.scrollTop:0;
  $('mTitle').textContent=title;b.textContent='';build(b);$('modal').hidden=false;b.scrollTop=keep;
  if(!keep)$('mClose').focus({preventScroll:true});
}
function closeModal(){if($('modal').hidden)return;$('modal').hidden=true;cv.focus({preventScroll:true})}
function row(body,ic,name,sub,acts){
  const r=el('div','row');r.appendChild(ic);
  const g=el('div','grow');g.appendChild(el('b',null,name));for(const s of [].concat(sub))g.appendChild(el('small',null,s));r.appendChild(g);
  if(acts&&acts.length){const a=el('div','acts');for(const [l,fn,dis] of acts){const b=el('button','btn',l);b.type='button';b.disabled=!!dis;b.onclick=fn;a.appendChild(b)}r.appendChild(a)}

}

function setDeco(on){

function freezeRoom(){if(!S.room){S.entry=roomEntry();S.room=[...roomSet()]}}
function decoClick(x,y){
  const set=roomSet(),e=roomEntry(),k=x+','+y,inRoom=set.has(k),dxr=e[0],rh=e[1]+1;
  if(decoSel==='+floor'){
    if(inRoom)return;
    if(x<0||y<0||x>=GRID_W||y>=GRID_H||(x===e[0]&&y===e[1]+1)){toast('여기까지는 넓힐 수 없어요');return}
    if(set.size>=roomBudget()){toast('지금 집으로는 더 넓힐 수 없어요. 집을 키우면 칸이 늘어요');sfx('err');return}
    if(!DIRS.some(([dx,dy])=>set.has((x+dx)+','+(y+dy)))){toast('지금 방에 붙은 자리만 넓힐 수 있어요');return}
    freezeRoom();S.room=S.room.concat(k);sfx('chop');touch();renderDeco();return;
  }
  if(decoSel==='-floor'){
    if(!inRoom)return;
    if((x===0&&y<2)||(x===e[0]&&y===e[1])||(x===P.x&&y===P.y)||furnAt(x,y)){toast('이 칸은 뗄 수 없어요');sfx('err');return}
    freezeRoom();const old=S.room;S.room=old.filter(q=>q!==k);
    // 떼고 나서도 모든 칸이 문에서 이어져 있어야 한다
    const now2=roomSet(),seen=new Set([e.join()]),q=[e];
    while(q.length){const [a,b]=q.pop();for(const [dx,dy] of DIRS){const n=(a+dx)+','+(b+dy);if(now2.has(n)&&!seen.has(n)){seen.add(n);q.push([a+dx,b+dy])}}}
    if(seen.size!==S.room.length){S.room=old;toast('방이 둘로 나뉘어서 뗄 수 없어요');sfx('err');return}
    sfx('chop');touch();renderDeco();return;
  }
  if(!inRoom)return;
  const f=furnAt(x,y);
  if(f){S.placed.splice(S.placed.indexOf(f),1);S.furn[f.id]=(S.furn[f.id]||0)+1;sfx('pick');touch();renderDeco();return}
  if(!decoSel){toast('먼저 아래에서 가구를 골라요');return}
  if((x===0&&y<2)||(x===dxr&&y===rh-1)||(x===P.x&&y===P.y)){toast('여기에는 놓을 수 없어요');sfx('err');return}
  S.placed.push({id:decoSel,x,y});
  if(!FURN[decoSel].walk){
    const okBed=findPath(dxr,rh-1,(a,b)=>(a===1&&b<2)||(a===0&&b===2)),okMe=findPath(dxr,rh-1,(a,b)=>a===P.x&&b===P.y);
    if(!okBed||!okMe){S.placed.pop();toast('길이 막혀서 놓을 수 없어요');sfx('err');return}
  }
  S.furn[decoSel]--;sfx('pick');touch();renderDeco();
}

const MINI_COL={0:'#8ccf6b',1:'#e3c592',2:'#f2e3b3',3:'#62bfe8',4:'#4aa8dd',5:'#b98a5a',6:'#357a42',11:'#b98a5a'};
function drawMini(m,px,marks,me){
  m.width=W*px;m.height=H*px;const c=m.getContext('2d'),t=TOWN.tile,o=TOWN.objAt;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const q=o[y][x];c.fillStyle=MINI_COL[t[y][x]]||MINI_COL[0];c.fillRect(x*px,y*px,px,px);
    if(!q)continue;
    if(q.t==='bld'){c.fillStyle=q.b.id==='home'?'#dd6a1c':q.b.roof||'#8a5a3a';c.fillRect(x*px,y*px,px,px)}
    else if(q.t==='tree'||q.t==='rock'){c.fillStyle=q.t==='rock'?'#8a9399':q.k==='pine'?'#2f6e3b':'#e58aa6';c.beginPath();c.arc((x+.5)*px,(y+.5)*px,px*.42,0,7);c.fill()}
    else if(q.t!=='work'&&q.t!=='stall'&&q.t!=='fest'){c.fillStyle='#6b4a2a';c.fillRect(x*px+1,y*px+1,px-2,px-2)}
  }
  c.strokeStyle='#fff';c.lineWidth=Math.max(1,px/5);c.setLineDash([px*.7,px*.5]);c.strokeRect(FARM[0]*px+1,FARM[1]*px+1,(FARM[2]-FARM[0]+1)*px-2,(FARM[3]-FARM[1]+1)*px-2);c.setLineDash([]);
  if(me){c.fillStyle='#fff';c.beginPath();c.arc((me[0]+.5)*px,(me[1]+.5)*px,px*.62,0,7);c.fill();c.fillStyle='#d94a74';c.beginPath();c.arc((me[0]+.5)*px,(me[1]+.5)*px,px*.4,0,7);c.fill()}
  if(marks){c.font='bold '+Math.round(px*1.05)+'px sans-serif';c.textAlign='center';c.textBaseline='middle';
    marks.forEach((q,i)=>{const X=(q[0]+.5)*px,Y=(q[1]+.5)*px;c.fillStyle='#2e2a2a';c.beginPath();c.arc(X,Y,px*.82,0,7);c.fill();c.fillStyle='#fff';c.fillText(String(i+1),X,Y+.5)})}
}

// ───────── 친구와 놀이 ─────────
// 몸짓·가위바위보·술래잡기는 전부 presence로만 주고받는다(e·et 몸짓, m 가위바위보, tg 술래잡기). 남이 보낸 값은 형식을 확인하고 쓴다
const EMO=[null,['절하기','꾸벅'],['폴짝 뛰기','폴짝!'],['손 흔들기','안녕~'],['덩실덩실','덩실덩실']],EMO_T=2.4,NEAR=4;
const RPS=[null,'가위','바위','보'];
let myEmo=0,myEmoT=0,myEmoAt=-99,emoBond=-99,chipT=0;
let rps=null,rpsSeen=0; /* rps={w 상대,id,st:'ask' 청함·'no' 사양·'ok' 고르는 중·'pick' 냈음·'show' 펼침,me,you,t,done} */
let tag=null,tagAt=-99,tagStart=-99; /* tag={id 판 번호,q 바뀐 횟수,it 술래(빈 글자면 끝난 판)} */
// 같은 곳에서 네 칸 안에 있는 가장 가까운 친구. 곁에 친구가 있으면 경험치를 10% 더 받는다
function buddy(){
  if(!peers.length||scene==='home')return null;let best=null,bd=99;
  for(const p of peers){const v=PV[p.peer];if(!v||!peerHere(p))continue;const d=Math.abs(v.x-P.x)+Math.abs(v.y-P.y);if(d<=NEAR&&d<bd){bd=d;best=p}}
  return best;
}
// 놀이로 얻는 경험치는 하루 60까지만
function playXp(n){
  if(S.playDay!==S.day){S.playDay=S.day;S.playXp=0}
  const g=Math.min(n,60-S.playXp);if(g<=0)return;S.playXp+=g;addXp(g);float('+'+g+' 경험',null,P.y*T-96);
}
function peerChip(){
  const h=$('hPeers'),wait=!peers.length&&!!net&&!!net.p2p;h.hidden=!peers.length&&!wait;if(h.hidden)return;
  const t=wait?'방 ‘'+p2pName+'’ · 친구 기다리는 중':tagOn()?'술래잡기 · 술래: '+tagName():'함께 '+(peers.length+1)+'명'+(buddy()?' · 덤 10%':'');
  if(h.textContent!==t)h.textContent=t;
}
// 몸짓: 발끝(x,y)을 축으로 캐릭터 그림을 움직인다
function emoDraw(c,x,y,k,a,draw){
  if(!k||a<0||a>=EMO_T){draw(y);return}
  c.save();c.translate(x,y);
  if(k===1)c.scale(1,1-Math.sin(Math.min(1,a/1.8)*Math.PI)*.22);
  else if(k===2)c.translate(0,-Math.abs(Math.sin(a*8))*9);
  else if(k===3)c.rotate(Math.sin(a*11)*.1);
  else{c.translate(Math.sin(a*6)*4,-Math.abs(Math.sin(a*12))*3);c.rotate(Math.sin(a*6)*.09)}
  c.translate(-x,-y);draw(y);c.restore();
}
function badge(c,x,y,txt,col){c.font='12px '+FONT;c.textAlign='center';c.textBaseline='middle';const w=c.measureText(txt).width+12;rr(c,x-w/2,y-8,w,16,8,col||'#d9412e');c.fillStyle='#ffffff';c.fillText(txt,x,y+1)}
// 머리 위에 띄우는 것: 술래 표시 → 가위바위보 → 말 → 몸짓 순서로 위로 쌓는다
let headRects=[]; /* 이번 화면에 이미 놓은 머리 위 글자 자리. 나란히 선 친구와 겹치면 위로 올린다 */
function headPut(c,labels,x,y,txt,draw){
  c.font='12px '+FONT;const w=c.measureText(txt).width+14;let ly=y;
  for(let i=0;i<8&&headRects.some(r=>Math.abs(r[0]-x)<(r[2]+w)/2&&Math.abs(r[1]-ly)<17);i++)ly-=18;
  headRects.push([x,ly,w]);labels.push(()=>draw(c,x,ly,txt));return ly;
}
const handBadge=(c,x,y,t)=>badge(c,x,y,t,'#3b6fb5');
function headStack(c,labels,x,y,it,hand,say,emo){
  let ly=y-60;
  if(it)ly=headPut(c,labels,x,ly,'술래',badge)-18;
  if(hand)ly=headPut(c,labels,x,ly,hand,handBadge)-18;
  if(say)ly=headPut(c,labels,x,ly,say,label)-18;
  if(emo)headPut(c,labels,x,ly,emo,label);
}
function emote(k){
  if(!EMO[k])return;myEmo=k;myEmoT=Date.now();myEmoAt=now;sfx('talk');
  for(const p of peers)bond(p);
}
// 곁에 있는 친구와 같은 몸짓을 잇달아 하면 마음이 통한다 (1분에 한 번)
function bond(p){
  const v=PV[p.peer];
  if(!v||!v.e||v.e!==myEmo||now-v.eAt>6||now-myEmoAt>6||now-emoBond<60)return;
  if(!peerHere(p)||Math.abs(v.x-P.x)+Math.abs(v.y-P.y)>NEAR)return;
  emoBond=now;toast(peerName(p)+' 님과 마음이 통했어요');sfx('heart');playXp(5);
}
// 가위바위보: 둘 다 '냈음'이 된 뒤에야 서로 낸 것을 펼친다
const peerM=p=>{const m=p&&p.presence.m;return m&&typeof m==='object'&&m.w===myPeer&&typeof m.id==='number'&&typeof m.st==='string'?m:null};
function rpsAsk(p){
  if(rps){toast('이미 가위바위보를 하는 중이에요');return}
  if(!net||!myPeer){toast('지금은 연결이 끊겨 있어요');return}
  rps={w:p.peer,id:Date.now(),st:'ask',me:0,you:0,t:now,done:0};speak('가위바위보 하자!');toast(peerName(p)+' 님의 대답을 기다려요');
}
function rpsPick(p){
  dialog({who:peerName(p),role:'가위바위보',text:'가위, 바위, 보! 무엇을 낼까요?',choices:[['가위',()=>rpsChoose(1)],['바위',()=>rpsChoose(2)],['보',()=>rpsChoose(3)]]});
  dlgState.rps=1;
}
function rpsChoose(k){if(!rps||rps.st!=='ok')return;rps.me=k;rps.st='pick';rps.t=now;rpsSync()}
function rpsEnd(p,you){
  rps.you=you;rps.done=1;rps.t=now;
  const r=(rps.me-you+3)%3;
  toast('나 '+RPS[rps.me]+' · '+peerName(p)+' '+RPS[you]+' → '+['비겼어요','이겼어요!','졌어요'][r]);
  sfx(r===1?'level':r?'err':'pick');playXp([6,12,4][r]);
}
function rpsSync(){
  const free=!busy()&&!mg&&!fishing;
  if(rps){
    const p=peers.find(q=>q.peer===rps.w);
    if(!p){if(!rps.done&&rps.st!=='no')toast('친구가 자리를 떠났어요');if(dlgState&&dlgState.rps)closeDlg();rps=null;return}
    const o=peerM(p),m=o&&o.id===rps.id?o:null;
    if(rps.st==='ask'){
      if(m&&m.st==='no'){toast(peerName(p)+' 님이 다음에 하재요');rps=null;return}
      if(m&&['ok','pick','show'].includes(m.st)&&free){rps.st='ok';rps.t=now;rpsPick(p)}
    }
    if(rps.st==='pick'&&m&&(m.st==='pick'||m.st==='show'))rps.st='show';
    if(rps.st==='show'&&!rps.done&&m&&m.st==='show'){const y=m.p|0;if(y>=1&&y<=3)rpsEnd(p,y)}
    return;
  }
  if(!free)return;
  for(const p of peers){
    const m=peerM(p);if(!m||m.st!=='ask'||m.id===rpsSeen)continue;
    rpsSeen=m.id;const id=m.id,w=p.peer;sfx('talk');
    dialog({who:peerName(p),role:'같이 노는 친구',text:'가위바위보 한 판 하자!',choices:[['하기',()=>{
      const q=peers.find(z=>z.peer===w),n=peerM(q);
      if(rps||!n||n.id!==id||n.st!=='ask'){toast('친구가 기다리다 그만뒀어요');return}
      rps={w,id,st:'ok',me:0,you:0,t:now,done:0};rpsPick(q);
    }],['다음에',()=>{if(!rps)rps={w,id,st:'no',me:0,you:0,t:now,done:0}}]]});
    return;
  }
}
// 술래잡기: 판 번호(id)가 크거나 같은 판에서 더 많이 바뀐(q) 쪽을 모두가 따른다
const tagOn=()=>!!(tag&&tag.it);
const tagIt=()=>tagOn()&&tag.it===myPeer;
const tagName=()=>{if(tag.it===myPeer)return '나';const p=peers.find(q=>q.peer===tag.it);return p?peerName(p):'친구'};
const peerTg=p=>{const t=p.presence.tg;return t&&typeof t==='object'&&typeof t.id==='number'&&typeof t.q==='number'&&typeof t.it==='string'?t:null};
const tagNewer=(a,b)=>!b||a.id>b.id||(a.id===b.id&&a.q>b.q);
function tagBegin(){
  if(!net||!myPeer||!peers.length){toast('같이 있는 친구가 없어요');return}
  tag={id:Math.max(Date.now(),(tag?tag.id:0)+1),q:1,it:myPeer};tagStart=tagAt=now;
  speak('술래잡기 하자! 내가 술래!');toast('술래잡기 시작! 내가 술래예요. 셋을 세고 친구 옆에서 행동하면 잡아요');sfx('level');
}
function tagHit(p){
  if(now-tagAt<3){toast('셋을 세고 나서 잡을 수 있어요');return}
  tag={id:tag.id,q:tag.q+1,it:p.peer};toast(peerName(p)+' 님을 잡았어요! 이제 달아나요');sfx('pick');playXp(8);
}
function tagOver(was){
  const me=was.it===myPeer,p=peers.find(q=>q.peer===was.it);
  toast('술래잡기 끝! 마지막 술래: '+(me?'나':p?peerName(p):'떠난 친구'));
  if(now-tagStart>=30)playXp(me?3:10);
}
function tagFinish(){if(!tagOn())return;const was=tag;tag={id:was.id,q:was.q+1,it:''};tagOver(was)}
function tagSync(){
  let best=null;for(const p of peers){const t=peerTg(p);if(t&&tagNewer(t,best))best=t}
  if(best&&tagNewer(best,tag)){
    const was=tag,same=!!(was&&was.id===best.id&&was.it);
    tag={id:best.id,q:best.q,it:best.it.slice(0,80)};
    if(!tag.it){if(same)tagOver(was)}
    else{
      if(!same)tagStart=now;
      const me=tag.it===myPeer;if(me)tagAt=now;
      toast(me?(same?'잡혔어요! 이제 내가 술래예요':'술래잡기 시작! 내가 술래예요'):(same?'술래가 바뀌었어요 → ':'술래잡기 시작! 술래: ')+tagName());
      sfx(me?'err':'talk');
    }
  }
  // 술래가 자리를 떠나거나 친구가 모두 나가면 판이 끝난다
  if(tagOn()&&(tag.it===myPeer?!peers.length:!peers.some(p=>p.peer===tag.it))){tag={id:tag.id,q:tag.q+1,it:''};toast('술래잡기가 끝났어요')}
}
function updPlay(dt){
  if(!net)return;
  rpsSync();
  if(rps){
    const a=now-rps.t;
    if(rps.st==='ask'&&a>20){toast('대답이 없어서 그만뒀어요');rps=null}
    else if(rps.st==='ok'&&a>15){if(dlgState&&dlgState.rps)closeDlg();rpsChoose(1+Math.floor(Math.random()*3))}
    else if(rps.st==='no'&&a>3)rps=null;
    else if(rps.done&&a>4)rps=null;
    else if(!rps.done&&(rps.st==='pick'||rps.st==='show')&&a>25){toast('가위바위보가 끊겼어요');rps=null}
  }
  if(tagOn()&&now-tagStart>180)tagFinish();
  chipT-=dt;if(chipT<=0){chipT=.4;peerChip()}
}

      rb.appendChild(cb);rb.appendChild(lb);body.appendChild(rb);
      // 연결 상태: 친구가 안 보일 때 어디가 문제인지 가늠할 수 있게
      const st=net.status(),sp=el('p','note',st.open?'연결 서버 '+st.all+'곳 가운데 '+st.open+'곳에 닿았어요 · 방에 나 말고 '+st.peers+'명.'+(st.peers?'':' 친구가 안 보이면 방 이름이 같은지, 친구가 게임 화면을 켜 두었는지 확인해 주세요.'):'연결 서버에 아직 닿지 못했어요. 잠시 뒤에 다시 열어 보세요.');
      sp.style.marginTop='8px';body.appendChild(sp);
    }
    const g=el('div','tabs');g.style.flexWrap='wrap';
    for(const t of ['안녕!','같이 낚시하자','이리 와 봐','고마워!','잘 가~']){const b=el('button','btn',t);b.type='button';b.onclick=()=>{speak(t);closeModal()};g.appendChild(b)}
    body.appendChild(g);
    // 몸짓: 친구와 같은 몸짓을 잇달아 하면 마음이 통한다
    body.appendChild(el('p','sub','몸짓 · 곁에 있는 친구와 같은 몸짓을 하면 마음이 통해요'));
    const e=el('div','tabs');e.style.flexWrap='wrap';
    for(let i=1;i<EMO.length;i++){const b=el('button','btn',EMO[i][0]);b.type='button';b.onclick=()=>{closeModal();emote(i)};e.appendChild(b)}
    if(tagOn()){const b=el('button','btn','술래잡기 그만');b.type='button';b.onclick=()=>{closeModal();tagFinish()};e.appendChild(b)}
    else if(net&&peers.length){const b=el('button','btn','술래잡기 시작');b.type='button';b.onclick=()=>{closeModal();tagBegin()};e.appendChild(b)}
    body.appendChild(e);
    const lab=el('label','sub','하고 싶은 말'),inp=el('input');inp.type='text';inp.id='sayInput';inp.maxLength=30;inp.autocomplete='off';
    inp.style.cssText='font:inherit;padding:7px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%;display:block;margin-top:4px';
    const send=()=>{if(inp.value.trim()){speak(inp.value);closeModal()}};
    inp.onkeydown=e=>{if(e.key==='Enter')send()};lab.appendChild(inp);body.appendChild(lab);
    const b=el('button','btn pri','말하기');b.type='button';b.onclick=send;body.appendChild(b);
  });
}

// ───────── 조작 ─────────
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Escape'){if(!$('modal').hidden)closeModal();else if(decoMode)setDeco(false);else if(placing)stopPlacing();else if(mg&&['rite','eye','study','catch','scoop'].includes(mg.kind)){mgEnd();toast('그만뒀어요')}return}
  if(!started||sleeping)return;
  const go=e.code==='Space'||e.code==='KeyE'||e.code==='Enter';
  if(!$('dlg').hidden){
    if(go&&(e.repeat||(dlgState&&dlgState.i<dlgState.txt.length))){e.preventDefault();if(!e.repeat)skipType()}
    return;
  }
  if(!$('modal').hidden)return;
  if(KEYDIR[e.code]){e.preventDefault();dirDown(e.code,e.repeat);return}
  if(go){if(e.target&&e.target.tagName==='BUTTON'&&e.code!=='KeyE')return;e.preventDefault();if(!e.repeat)interact();return}
  if(e.code==='KeyB')openBag();
});
// 방향 입력 하나(방향키든 터치 방향판이든). 놀이 가운데 몇은 방향이 걷기가 아니라 동작 입력이다
function dirDown(code,rep){
  const q=KEYDIR[code],di=()=>DIRS.findIndex(v=>v[0]===q[0]&&v[1]===q[1]);
  if(mg&&mg.kind==='rite'){if(!rep)ritePress(di());return}
  if(mg&&mg.kind==='scoop'){if(!rep)scoopPress(di());return}
  if(mg&&mg.kind==='catch'){if(!rep&&q[0])catchMove(q[0]);return}
  if(mg&&mg.kind==='study'){studyMove(q[0],q[1]);return}
  if(mg&&mg.kind==='eye'){if(!rep&&q[0])eyePick(q[0]<0?0:1);return}
  if(!keys.includes(code))keys.push(code);if(fishing){fishing=null;toast('낚시를 그만뒀어요')}if(mg)mgEnd();
}
window.addEventListener('keyup',e=>{const i=keys.indexOf(e.code);if(i>=0)keys.splice(i,1)});
window.addEventListener('blur',()=>{keys.length=0});
// 잘못 눌린 터치 거르기. guardUntil: 놀이·낚시가 막 시작됐거나 막 끝난 직후에는 잠깐 입력을 받지 않는다(연달아 눌린 터치가 첫 박자를 헛치거나 엉뚱한 곳으로 걸어가지 않게).
// cvPtr: 화면에 손가락 하나가 닿아 있는 동안 다른 손가락은 받지 않는다. lastTap: 같은 자리를 0.2초 안에 또 누른 것은 한 번으로 친다
let guardUntil=0,wasPlay=false,cvPtr=null,cvPtrAt=0,lastTap={t:0,x:0,y:0};
const cvUp=e=>{if(e.pointerId===cvPtr)cvPtr=null};
cv.addEventListener('pointerup',cvUp);cv.addEventListener('pointercancel',cvUp);cv.addEventListener('pointerleave',cvUp);
cv.addEventListener('pointerdown',e=>{
  const t=performance.now();
  if(cvPtr!==null&&e.pointerId!==cvPtr&&t-cvPtrAt<1500)return;
  cvPtr=e.pointerId;cvPtrAt=t;
  if(busy()||t<guardUntil)return;
  if(!mg&&!fishing){if(t-lastTap.t<200&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<24)return;lastTap={t,x:e.clientX,y:e.clientY}}
  const r=cv.getBoundingClientRect(),wx=(e.clientX-r.left)/zoom+cam.x,wy=(e.clientY-r.top)/zoom+cam.y;
  if(decoMode){decoClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(placing&&scene==='town'){placeClick(Math.floor(wx/T),Math.floor(wy/T));return}
  if(mg&&mg.kind==='rite'){riteClick(wx,wy);return}
  if(mg&&mg.kind==='eye'){eyeClick(wx,wy);return}
  if(mg&&mg.kind==='study'){studyClick(wx,wy);return}
  if(mg&&mg.kind==='catch'){catchClick(wx,wy);return}
  if(mg&&mg.kind==='scoop'){scoopClick(wx,wy);return}
  if((scene==='town'||scene==='palace')&&npcOut())for(const id of NPC_IDS){
    if(!npcHere(id))continue;
    const n=N[id],cx=(rx(n)+.5)*T,fy=(ry(n)+.9)*T;
    if(Math.abs(wx-cx)<13&&wy<fy+4&&wy>fy-46){clickTile(n.x,n.y);return}
  }
  clickTile(Math.floor(wx/T),Math.floor(wy/T),wy/T-Math.floor(wy/T)>.35);
});
$('dlgText').addEventListener('click',skipType);
$('actBtn').onclick=()=>{interact();cv.focus({preventScroll:true})};
const tool=(id,fn)=>{$(id).onclick=()=>{if(!started||sleeping)return;if(!$('dlg').hidden)closeDlg();fn()}};
tool('bBag',openBag);tool('bJob',openStatus);tool('bFriends',openFriends);tool('bQuests',openQuests);tool('bHelp',openHelp);tool('bDex',openDex);tool('bSay',openSay);tool('bWear',openWardrobe);tool('bMap',openMap);
tool('bDeco',()=>{setDeco(!decoMode);cv.focus({preventScroll:true})});
tool('bPlace',()=>{if(placing)stopPlacing();else{placing=true;syncPlace();toast('집 둘레 내 땅(밝게 표시된 풀밭)에서 지을 자리를 눌러요')}cv.focus({preventScroll:true})});
tool('bSave',()=>{saveAll();toast(cloudDoc?'저장했어요 · 계정에도 올려서 다른 기기에서 이어 할 수 있어요':'저장했어요 · 이 브라우저에 보관돼요');cv.focus({preventScroll:true})});
tool('bSound',()=>{S.sound=!S.sound;$('bSound').textContent=S.sound?'소리 켬':'소리 끔';touch();sfx('pick');cv.focus({preventScroll:true})});
$('mClose').onclick=closeModal;
$('modal').addEventListener('pointerdown',e=>{if(e.target===$('modal'))closeModal()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&started){keys.length=0;saveLocal();if(cloudDirty)pushCloud()}});

// ───────── 돌리기 ─────────
let last=0,lastTen=-1,saveT=0,cloudT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,Math.max(0,(ts-last)/1000||0));last=ts;now+=dt;
  if(started&&S){
    if(!busy()){updTime(dt);updPlayer(dt);updNpcs(dt);updBeasts(dt);updHerd(dt);updKids(dt);updFishing(dt);updMg(dt)}
    else if(P.t<1){P.t=Math.min(1,P.t+dt*WALK);if(P.t>=1){P.fx=P.x;P.fy=P.y}}
    for(const o of TREES)if(o.sh>0)o.sh-=dt;
    for(const o of ROCKS)if(o.sh>0)o.sh-=dt;
    {const pl=!!(mg||fishing);if(pl!==wasPlay){wasPlay=pl;guardUntil=performance.now()+(pl?450:500)}}
    updPlay(dt);syncPresence();for(const k in PV){const v=PV[k];if(v.t<1)v.t=Math.min(1,v.t+dt*WALK)}
    if(floats.length){for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.3)}
    const ten=Math.floor(S.min/10);if(ten!==lastTen){lastTen=ten;hud()}
    saveT+=dt;if(saveT>8){saveT=0;if(dirty)saveLocal()}
    cloudT+=dt;if(cloudT>90){cloudT=0;if(cloudDirty){saveLocal();pushCloud()}}
  }
  render();
}
function start(hot){
  buildGround();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));else window.addEventListener('resize',resize);
  requestAnimationFrame(frame);
  if(hot&&hot.S){begin(hot.S);return}
  S=newState('',COLORS[0]);S.min=600; // 시작 화면 뒤에 비치는 마을 풍경용. 시작하면 실제 상태로 바뀐다
  const local=loadLocal();let shown=false;
  const show=()=>{if(shown)return;shown=true;let best=local;if(cloudSaved&&(!best||(cloudSaved.ts||0)>(best.ts||0)))best=cloudSaved;showTitle(best)};
  if(window.claude&&window.claude.use){initCloud().then(show,show);setTimeout(show,3500)}else show();
}
const hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(()=>({S:started?S:null}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
